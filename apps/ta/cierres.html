<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>

<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626; --color-peligro-suave:#FEE2E2;
    --color-alerta:#D97706; --color-alerta-suave:#FEF3C7;
    --radio:10px; --sombra:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}

  .barra-superior{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .barra-superior h1{font-size:15px; margin:0;}
  .barra-botones{display:flex; gap:8px;}
  .btn-refrescar{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .btn-refrescar:hover{border-color:var(--color-primario); color:var(--color-primario-oscuro);}
  .btn-primario{background:var(--color-primario); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-primario:hover:not(:disabled){background:var(--color-primario-oscuro);}
  .btn-primario:disabled{opacity:.6; cursor:default;}
  .btn-secundario{background:#fff; border:1px solid var(--color-borde); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; color:var(--color-texto);}
  .btn-chico{background:#fff; border:1px solid var(--color-borde); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--color-texto);}
  .link-volver{background:none; border:none; color:var(--color-primario-oscuro); font-size:13px; cursor:pointer; padding:0; text-decoration:underline; margin-bottom:10px;}
  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px; margin-bottom:14px;}
  .cargando, .error-carga{text-align:center; padding:40px; color:var(--color-texto-suave);}
  .campo{margin-bottom:14px;}
  label{display:block; font-size:11.5px; color:var(--color-texto-suave); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
  input, select, textarea{width:100%; border:1px solid var(--color-borde); border-radius:7px; padding:8px 10px; font-size:13.5px; background:#fff; color:var(--color-texto); font-family:inherit;}
  textarea{resize:vertical; min-height:60px;}
  .fila{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .fila-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .buscador{position:relative;}
  .buscador-vacio{padding:10px; font-size:12.5px; color:var(--color-texto-suave); text-align:center;}
  .comparativo{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px;}

  .caja-comparativo .etiqueta{font-size:10.5px; text-transform:uppercase; color:var(--color-texto-suave); letter-spacing:.03em; margin-bottom:4px;}
  .caja-comparativo .valor{font-size:19px; font-weight:700;}
  .caja-comparativo.positiva .valor{color:var(--color-primario-oscuro);}

  .checklist{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}

  .mensaje-exito{background:var(--color-acento-suave); border-left:3px solid var(--color-primario); color:var(--color-primario-oscuro); font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}
  .badge-estado{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; white-space:nowrap; background:#D1FAE5; color:#15803D;}
</style>

<body>
<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">cierres.html — v8 (cliente confirma el cierre real)</div>

<script>
const h = React.createElement;
const { useState, useEffect, useMemo } = React;

function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function moneda(v){ return "$" + num(v).toFixed(2); }

/* ------------------------------------------------------------
   Elegir orden para cerrar (tabla completa, no buscador ciego)
   ------------------------------------------------------------ */
function SelectorOrden({ onSeleccionar }){
  const [ordenes, setOrdenes] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    tallerQuery("x_taller_orden", [
      "id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_estado","x_studio_fecha_recepcion",
    ], [["x_studio_estado","not in",["Cerrada","Cancelada"]]], 1000)
      .then(setOrdenes)
      .catch(e => setError("No se pudieron cargar las órdenes: " + e.message));
  }, []);

  const columnas = [
    { clave: "x_name", titulo: "Folio" },
    { clave: "x_studio_cliente_id", titulo: "Cliente" },
    { clave: "x_studio_equipo_id", titulo: "Equipo" },
    { clave: "x_studio_estado", titulo: "Estado" },
    { clave: "x_studio_fecha_recepcion", titulo: "Recepción", formatear: formatearFecha },
  ];

  if (error) return h("div", { className: "error-carga" }, error);
  if (!ordenes) return h("div", { className: "buscador-vacio" }, "Cargando órdenes...");

  return TablaInfoAgro(h, { columnas, filas: ordenes, onFilaClick: onSeleccionar });
}

/* ------------------------------------------------------------
   Formulario de cierre para una orden
   ------------------------------------------------------------ */
/* ------------------------------------------------------------
   Cierre sin reparar — cuando el cliente rechazó el presupuesto.
   Solo se cobra el diagnóstico, no hay checklist de reparación.
   ------------------------------------------------------------ */
function CierreSinReparar({ orden, onVolver, onCreado }){
  const [yaExiste, setYaExiste] = useState(false);
  const [cargando, setCargando] = useState(true);
  const [diagnosticoFinal, setDiagnosticoFinal] = useState("");
  const [montoDiagnostico, setMontoDiagnostico] = useState(0);
  const [aceptadoPorCliente, setAceptadoPorCliente] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    tallerQuery("x_taller_cierre", ["id"], [["x_studio_orden_id","=",orden.id]], 1)
      .then(rows => { setYaExiste(rows.length > 0); setCargando(false); })
      .catch(e => { setError("Error al cargar: " + e.message); setCargando(false); });
  }, [orden.id]);

  async function confirmarCierre(){
    if (!diagnosticoFinal.trim()){ setError("Registrá el diagnóstico realizado."); return; }
    if (!aceptadoPorCliente.trim()){ setError("Registrá quién del cliente quedó enterado/conforme con el cierre."); return; }
    setGuardando(true); setError("");
    try {
      const resp = await tallerCrear("x_taller_cierre", {
        x_name: orden.x_name + "-CIERRE-SIN-REPARAR",
        x_studio_orden_id: orden.id,
        x_studio_total_presupuestado: 0,
        x_studio_total_costo_real: num(montoDiagnostico),
        x_studio_variacion_total: num(montoDiagnostico),
        x_studio_porcentaje_variacion: 0,
        x_studio_causa_principal: "Cambio solicitado por el cliente",
        x_studio_diagnostico_final: diagnosticoFinal,
        x_studio_trabajo_realizado: "Sin reparación — cliente no autorizó el presupuesto. Se cobró únicamente el diagnóstico.",
        x_studio_prueba_realizada: "No aplica — equipo no reparado",
        x_studio_resultado_prueba: "No aprobado",
        x_studio_fecha_cierre: fechaParaOdoo(new Date()) + " " + new Date().toTimeString().slice(0,8),
        x_studio_aceptado_por_cliente: aceptadoPorCliente,
        x_studio_fecha_aceptacion_cliente: fechaParaOdoo(new Date()) + " " + new Date().toTimeString().slice(0,8),
      });
      if (!resp.ok) { setError(resp.error || "No se pudo crear el cierre."); setGuardando(false); return; }
      await tallerActualizar("x_taller_orden", orden.id, { x_studio_estado: "Cerrada" });
      onCreado();
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  if (cargando) return h("div", { className: "panel cargando" }, "Cargando...");
  if (yaExiste) {
    return h("div", null,
      h("button", { className: "link-volver", onClick: onVolver }, "← Volver"),
      h("div", { className: "panel error-carga" }, "Esta orden ya tiene un cierre registrado.")
    );
  }

  return h("div", null,
    h("button", { className: "link-volver", onClick: onVolver }, "← Volver"),
    h("div", { className: "panel" },
      h("h2", { style: { margin:"0 0 4px", fontSize:"16px" } }, "❌ Cerrar sin reparar — " + orden.x_name),
      h("div", { style: { fontSize:"12px", color:"var(--color-texto-suave)", marginBottom:"16px" } },
        (Array.isArray(orden.x_studio_cliente_id) ? orden.x_studio_cliente_id[1] : "") + " · " +
        (Array.isArray(orden.x_studio_equipo_id) ? orden.x_studio_equipo_id[1] : "")
      ),
      h("div", { style: { background:"var(--color-alerta-suave)", border:"1px solid var(--color-alerta)", borderRadius:"7px", padding:"10px 12px", fontSize:"12.5px", color:"#92400E", marginBottom:"16px" } },
        "El cliente no autorizó el presupuesto. Este cierre no compara contra ningún presupuesto — solo cobra el diagnóstico realizado."
      ),
      h("div", { className: "campo" },
        h("label", null, "Diagnóstico realizado"),
        h("textarea", { value: diagnosticoFinal, onChange: e => setDiagnosticoFinal(e.target.value), placeholder: "Qué se revisó y qué se encontró..." })
      ),
      h("div", { className: "campo" },
        h("label", null, "Monto a cobrar por el diagnóstico (US$)"),
        h("input", { type: "number", step: "0.01", value: montoDiagnostico, onChange: e => setMontoDiagnostico(e.target.value) })
      ),
      h("div", { className: "campo", style: { marginBottom: "0" } },
        h("label", null, "Notificado / conforme (cliente)"),
        h("input", { type: "text", value: aceptadoPorCliente, onChange: e => setAceptadoPorCliente(e.target.value) })
      ),
      error && h("div", { className: "mensaje-error" }, error),
      h("button", { className: "btn-primario", style: { marginTop: "16px" }, onClick: confirmarCierre, disabled: guardando },
        guardando ? "Cerrando..." : "🔒 Confirmar cierre sin reparar")
    )
  );
}

function FormularioCierre({ orden, onVolver, onCreado }){
  const [presupuesto, setPresupuesto] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [yaExiste, setYaExiste] = useState(false);

  const [totalPresupuestado, setTotalPresupuestado] = useState(0);
  const [totalCostoReal, setTotalCostoReal] = useState(0);
  const [costoRealVieneDeCotizacion, setCostoRealVieneDeCotizacion] = useState(false);
  const [diagnosticoFinal, setDiagnosticoFinal] = useState("");
  const [trabajoRealizado, setTrabajoRealizado] = useState("");
  const [pruebaRealizada, setPruebaRealizada] = useState("");
  const [resultadoPrueba, setResultadoPrueba] = useState("Aprobado");
  const [causaPrincipal, setCausaPrincipal] = useState("");
  const [horometroSalida, setHorometroSalida] = useState("");
  const [kilometrajeSalida, setKilometrajeSalida] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [enviado, setEnviado] = useState(false);

  useEffect(() => { cargar(); }, [orden.id]);

  async function cargar(){
    setCargando(true); setError("");
    try {
      const presRows = await tallerQuery("x_taller_presupuesto", ["id","x_name","x_studio_version","x_studio_estado"],
        [["x_studio_orden_id","=",orden.id],["x_studio_estado","=","Aprobado"]], 10, 0);
      const costoRealRows = await tallerQuery("x_costo_real_detalle", ["id","x_studio_total_costo_real"], [["x_studio_orden_id","=",orden.id]], 500);
      const cierresRows = await tallerQuery("x_taller_cierre", ["id"], [["x_studio_orden_id","=",orden.id]], 1);
      if (cierresRows.length) { setYaExiste(true); setCargando(false); return; }

      if (presRows.length) {
        const masReciente = presRows.sort((a,b) => b.x_studio_version - a.x_studio_version)[0];
        setPresupuesto(masReciente);
        const detalleLineas = await tallerQuery("x_presupuesto_detalle", ["x_studio_total_costo_presupuestado"],
          [["x_studio_presupuesto_id","=",masReciente.id]], 500);
        const total = detalleLineas.reduce((s,l) => s + num(l.x_studio_total_costo_presupuestado), 0);
        setTotalPresupuestado(total);
        // Si en Ejecución todavía no se registró nada de costo real, parte de lo cotizado
        // en vez de cero — es la base correcta, ajustable a mano si algo cambió.
        if (costoRealRows.length === 0) {
          setTotalCostoReal(total);
          setCostoRealVieneDeCotizacion(true);
        }
      }
      if (costoRealRows.length > 0) {
        const totalReal = costoRealRows.reduce((s,l) => s + num(l.x_studio_total_costo_real), 0);
        setTotalCostoReal(totalReal);
      }
    } catch(e) {
      setError("Error al cargar: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  const variacion = totalCostoReal - totalPresupuestado;
  const porcentajeVariacion = totalPresupuestado > 0 ? (variacion / totalPresupuestado) * 100 : 0;

  const checklist = [
    { texto: "Diagnóstico final registrado", ok: diagnosticoFinal.trim().length > 0 },
    { texto: "Trabajo realizado documentado", ok: trabajoRealizado.trim().length > 0 },
    { texto: "Equipo probado", ok: pruebaRealizada.trim().length > 0 },
    { texto: "Horómetro/kilometraje de salida registrado", ok: horometroSalida !== "" },
    { texto: "Causa de la variación explicada", ok: Math.abs(porcentajeVariacion) < 5 || causaPrincipal !== "" },
  ];
  const listoParaCerrar = checklist.every(c => c.ok);

  async function confirmarCierre(){
    if (!listoParaCerrar){ setError("Completá el checklist antes de cerrar."); return; }
    setGuardando(true); setError("");
    try {
      const nombreCierre = orden.x_name + "-CIERRE";
      const resp = await tallerCrear("x_taller_cierre", {
        x_name: nombreCierre,
        x_studio_orden_id: orden.id,
        x_studio_total_presupuestado: totalPresupuestado,
        x_studio_total_costo_real: totalCostoReal,
        x_studio_variacion_total: variacion,
        x_studio_porcentaje_variacion: porcentajeVariacion,
        x_studio_causa_principal: causaPrincipal || false,
        x_studio_diagnostico_final: diagnosticoFinal,
        x_studio_trabajo_realizado: trabajoRealizado,
        x_studio_prueba_realizada: pruebaRealizada,
        x_studio_resultado_prueba: resultadoPrueba,
        x_studio_fecha_cierre: fechaParaOdoo(new Date()) + " " + new Date().toTimeString().slice(0,8),
        // aceptado_por_cliente / fecha_aceptacion_cliente quedan vacíos a propósito —
        // los llena el cliente cuando aprueba desde el link, no el técnico de antemano.
      });
      if (!resp.ok) { setError(resp.error || "No se pudo crear el cierre."); setGuardando(false); return; }
      const idCierre = resp.id;

      // "Terminada", no "Cerrada" — el cierre real de la orden lo confirma el
      // cliente al aprobar desde el link, no el técnico al presionar este botón.
      const valoresOrden = { x_studio_estado: "Terminada" };
      if (horometroSalida !== "") valoresOrden.x_studio_horometro_salida = num(horometroSalida);
      if (kilometrajeSalida !== "") valoresOrden.x_studio_kilometraje_salida = num(kilometrajeSalida);
      await tallerActualizar("x_taller_orden", orden.id, valoresOrden);

      // De una vez, genera el link y lo comparte — no hace falta un paso aparte.
      const respToken = await tallerFetch("/taller/cierre/compartir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cierre_id: idCierre }),
      });
      if (respToken.ok) {
        const url = window.location.href.replace(/cierres\.html.*$/, "aprobar-cierre.html") + "?id=" + idCierre + "&token=" + respToken.token;
        const clienteNombre = Array.isArray(orden.x_studio_cliente_id) ? orden.x_studio_cliente_id[1] : "";
        if (navigator.share) {
          try {
            await navigator.share({
              title: "Cierre " + nombreCierre,
              text: "Hola" + (clienteNombre ? " " + clienteNombre : "") + ", tu orden " + orden.x_name + " está lista. Te comparto el cierre para tu visto bueno.",
              url,
            });
          } catch(e) { /* si cancela el share, no es un error real */ }
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(url);
        }
      }

      setEnviado(true);
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  if (cargando) return h("div", { className: "panel cargando" }, "Cargando datos de la orden...");

  if (yaExiste) {
    return h("div", null,
      h("button", { className: "link-volver", onClick: onVolver }, "← Volver"),
      h("div", { className: "panel error-carga" }, "Esta orden ya tiene un cierre registrado.")
    );
  }

  return h("div", null,
    h("button", { className: "link-volver", onClick: onVolver }, "← Volver"),

    h("div", { className: "panel" },
      h("h2", { style: { margin:"0 0 4px", fontSize:"16px" } }, "Cerrar " + orden.x_name),
      h("div", { style: { fontSize:"12px", color:"var(--color-texto-suave)", marginBottom:"16px" } },
        (Array.isArray(orden.x_studio_cliente_id) ? orden.x_studio_cliente_id[1] : "") + " · " +
        (Array.isArray(orden.x_studio_equipo_id) ? orden.x_studio_equipo_id[1] : "") +
        (presupuesto ? " · Presupuesto: " + presupuesto.x_name : " · ⚠️ Sin presupuesto aprobado encontrado")
      ),

      h("div", { className: "comparativo" },
        h("div", { className: "caja-comparativo" },
          h("div", { className: "etiqueta" }, "Presupuestado"),
          h("div", { className: "valor" }, moneda(totalPresupuestado))
        ),
        h("div", { className: "caja-comparativo" },
          h("div", { className: "etiqueta" }, "Costo real"),
          h("input", { type: "number", step: "0.01", value: totalCostoReal,
            onChange: e => { setTotalCostoReal(num(e.target.value)); setCostoRealVieneDeCotizacion(false); },
            style: { textAlign:"center", fontSize:"16px", fontWeight:"700", border:"1px solid var(--color-borde)" } }),
          costoRealVieneDeCotizacion && h("div", { style: { fontSize:"10px", color:"var(--color-texto-suave)", marginTop:"3px" } },
            "Tomado de la cotización — no se registró consumo real en Ejecución. Ajustá si cambió algo."
          )
        ),
        h("div", { className: "caja-comparativo " + (variacion <= 0 ? "positiva" : "negativa") },
          h("div", { className: "etiqueta" }, "Variación"),
          h("div", { className: "valor" }, (variacion >= 0 ? "+" : "") + moneda(variacion) + " (" + porcentajeVariacion.toFixed(1) + "%)")
        )
      ),

      h("div", { className: "fila" },
        h("div", { className: "campo" },
          h("label", null, "Horómetro de salida"),
          h("input", { type: "number", step: "0.1", value: horometroSalida, onChange: e => setHorometroSalida(e.target.value) })
        ),
        h("div", { className: "campo" },
          h("label", null, "Kilometraje de salida"),
          h("input", { type: "number", step: "1", value: kilometrajeSalida, onChange: e => setKilometrajeSalida(e.target.value) })
        )
      ),

      h("div", { className: "campo" },
        h("label", null, "Diagnóstico final"),
        h("textarea", { value: diagnosticoFinal, onChange: e => setDiagnosticoFinal(e.target.value) })
      ),
      h("div", { className: "campo" },
        h("label", null, "Trabajo realizado"),
        h("textarea", { value: trabajoRealizado, onChange: e => setTrabajoRealizado(e.target.value) })
      ),
      h("div", { className: "fila" },
        h("div", { className: "campo" },
          h("label", null, "Prueba realizada"),
          h("input", { type: "text", value: pruebaRealizada, onChange: e => setPruebaRealizada(e.target.value) })
        ),
        h("div", { className: "campo" },
          h("label", null, "Resultado de la prueba"),
          h("select", { value: resultadoPrueba, onChange: e => setResultadoPrueba(e.target.value) },
            h("option", { value: "Aprobado" }, "Aprobado"),
            h("option", { value: "No aprobado" }, "No aprobado")
          )
        )
      ),

      Math.abs(porcentajeVariacion) >= 5 && h("div", { className: "campo" },
        h("label", null, "Causa principal de la variación"),
        h("select", { value: causaPrincipal, onChange: e => setCausaPrincipal(e.target.value) },
          h("option", { value: "" }, "— Elegí una causa —"),
          INFOTALLER_CAUSAS_DESVIACION.map(c => h("option", { key: c, value: c }, c))
        )
      ),

      h("hr", { style: { border:"none", borderTop:"1px solid var(--color-borde)", margin:"18px 0 12px" } }),

      enviado
        ? h("div", { style: { textAlign:"center", padding:"14px 0" } },
            h("div", { style: { fontSize:"36px", marginBottom:"8px" } }, "📤"),
            h("div", { style: { fontWeight:700, marginBottom:"4px" } }, "Cierre enviado — pendiente de aprobación del cliente"),
            h("div", { style: { fontSize:"12.5px", color:"var(--color-texto-suave)", marginBottom:"14px" } },
              "La orden queda en \"Terminada\" hasta que el cliente dé el visto bueno desde el link. Si aprueba, se cierra sola; si no acepta, vuelve a \"En reparación\" con su comentario."
            ),
            h("button", { className: "btn-primario", onClick: onCreado }, "Volver a la lista")
          )
        : h(React.Fragment, null,
            h("div", { className: "checklist" },
              checklist.map((c,i) => h("div", { key: i, className: "checklist-item " + (c.ok ? "ok" : "falta") },
                c.ok ? "✅" : "⬜", " ", c.texto
              ))
            ),
            error && h("div", { className: "mensaje-error" }, error),
            h("button", { className: "btn-primario", onClick: confirmarCierre, disabled: guardando || !listoParaCerrar },
              guardando ? "Registrando y enviando..." : "📤 Registrar cierre y enviar a cliente")
          )
    )
  );
}

/* ------------------------------------------------------------
   Pantalla principal
   ------------------------------------------------------------ */
/* ------------------------------------------------------------
   Detalle de un cierre existente — documento de soporte para
   asignar al centro de costo (interno) o cuenta por cobrar (externo)
   ------------------------------------------------------------ */
function DetalleCierre({ cierreId, onVolver }){
  const [cierre, setCierre] = useState(null);
  const [orden, setOrden] = useState(null);
  const [cliente, setCliente] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [exito, setExito] = useState("");
  const [generandoPdf, setGenerandoPdf] = useState(false);
  const [generandoLink, setGenerandoLink] = useState(false);

  async function generarLinkVistoBueno(){
    setGenerandoLink(true); setError("");
    try {
      const resp = await tallerFetch("/taller/cierre/compartir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cierre_id: cierreId }),
      });
      if (!resp.ok) { setError(resp.error || "No se pudo generar el link."); return; }
      const url = window.location.href.replace(/cierres\.html.*$/, "aprobar-cierre.html") + "?id=" + cierreId + "&token=" + resp.token;
      const clienteNombre = cliente ? cliente.x_name : "";
      if (navigator.share) {
        await navigator.share({
          title: "Cierre " + cierre.x_name,
          text: "Hola" + (clienteNombre ? " " + clienteNombre : "") + ", te comparto el cierre de tu orden " + (orden ? orden.x_name : "") + " para tu visto bueno.",
          url,
        });
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(url);
        setExito("Link copiado al portapapeles: " + url);
      } else {
        setExito("Link: " + url);
      }
    } catch(e) {
      if (e.name !== "AbortError") setError("Error: " + e.message);
    } finally {
      setGenerandoLink(false);
    }
  }

  useEffect(() => { cargar(); }, [cierreId]);

  async function cargar(){
    setCargando(true); setError("");
    try {
      const cierreRows = await tallerQuery("x_taller_cierre", [
        "id","x_name","x_studio_orden_id","x_studio_total_presupuestado","x_studio_total_costo_real",
        "x_studio_variacion_total","x_studio_porcentaje_variacion","x_studio_causa_principal",
        "x_studio_diagnostico_final","x_studio_trabajo_realizado","x_studio_resultado_prueba",
        "x_studio_fecha_cierre","x_studio_aceptado_por_cliente","x_studio_fecha_aceptacion_cliente",
      ], [["id","=",cierreId]], 1);
      if (!cierreRows.length){ setError("No se encontró el cierre."); setCargando(false); return; }
      const c = cierreRows[0];
      setCierre(c);

      if (Array.isArray(c.x_studio_orden_id)) {
        const ordenRows = await tallerQuery("x_taller_orden", ["id","x_name","x_studio_cliente_id","x_studio_equipo_id"], [["id","=",c.x_studio_orden_id[0]]], 1);
        if (ordenRows.length) {
          setOrden(ordenRows[0]);
          if (Array.isArray(ordenRows[0].x_studio_cliente_id)) {
            const clienteRows = await tallerQuery("x_taller_cliente", [
              "id","x_name","x_studio_tipo_cliente","x_studio_codigo_cliente","x_studio_identificacion_fiscal",
              "x_studio_contacto","x_studio_telefono","x_studio_centro_costo","x_studio_finca","x_studio_cultivo",
              "x_studio_lote","x_studio_condiciones_pago",
            ], [["id","=",ordenRows[0].x_studio_cliente_id[0]]], 1);
            if (clienteRows.length) setCliente(clienteRows[0]);
          }
        }
      }
    } catch(e) {
      setError("Error al cargar: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  function m2oTexto(v){ return Array.isArray(v) ? v[1] : (v || "—"); }

  function construirPDF(){
    if (!window.jspdf) throw new Error("La librería de PDF no cargó (revisá tu conexión y recargá la página).");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "letter" });
    if (typeof doc.autoTable !== "function") throw new Error("El complemento de tablas del PDF no cargó — recargá con Ctrl+Shift+R.");
    const ancho = doc.internal.pageSize.getWidth();
    const esInterno = cliente && cliente.x_studio_tipo_cliente === "Interno";

    doc.setFillColor(22, 163, 74);
    doc.rect(0, 0, ancho, 24, "F");
    doc.setTextColor(255,255,255); doc.setFont(undefined, "bold"); doc.setFontSize(16);
    doc.text("INFOTALLER", 14, 12);
    doc.setFont(undefined, "normal"); doc.setFontSize(9);
    doc.text("División Agrícola — COMASA", 14, 18);
    doc.setFont(undefined, "bold"); doc.setFontSize(13);
    doc.text("DOCUMENTO DE SOPORTE", ancho - 14, 12, { align: "right" });
    doc.setFont(undefined, "normal"); doc.setFontSize(10);
    doc.text(orden ? orden.x_name : "", ancho - 14, 18, { align: "right" });

    doc.setTextColor(17,24,39);
    let y = 34;
    doc.setFont(undefined, "bold"); doc.setFontSize(9); doc.text("CLIENTE", 14, y);
    doc.setFont(undefined, "normal"); doc.text(cliente ? cliente.x_name : "—", 14, y + 5);
    doc.setFont(undefined, "bold"); doc.text("EQUIPO", 110, y);
    doc.setFont(undefined, "normal"); doc.text(orden ? m2oTexto(orden.x_studio_equipo_id) : "—", 110, y + 5);
    y += 14;

    // Bloque de cargo — distinto según interno/externo, que es justo lo que pidió el gerente
    doc.setFillColor(248, 250, 252);
    doc.rect(14, y, ancho - 28, esInterno ? 26 : 22, "F");
    doc.setFont(undefined, "bold"); doc.setFontSize(9);
    doc.text(esInterno ? "CARGAR A CENTRO DE COSTO" : "CUENTA POR COBRAR — CLIENTE EXTERNO", 18, y + 7);
    doc.setFont(undefined, "normal"); doc.setFontSize(9);
    if (esInterno) {
      doc.text("Centro de costo: " + (cliente?.x_studio_centro_costo || "—"), 18, y + 13);
      doc.text("Finca: " + m2oTexto(cliente?.x_studio_finca) + "   Cultivo: " + m2oTexto(cliente?.x_studio_cultivo) + "   Lote: " + m2oTexto(cliente?.x_studio_lote), 18, y + 19);
    } else {
      doc.text("Identificación fiscal: " + (cliente?.x_studio_identificacion_fiscal || "—"), 18, y + 13);
      doc.text("Condiciones de pago: " + (cliente?.x_studio_condiciones_pago || "—") + "   Contacto: " + (cliente?.x_studio_contacto || "—"), 18, y + 19);
    }
    y += esInterno ? 34 : 30;

    doc.autoTable({
      startY: y,
      head: [["Concepto", "Monto"]],
      body: [
        ["Total presupuestado", moneda(cierre.x_studio_total_presupuestado)],
        ["Total costo real", moneda(cierre.x_studio_total_costo_real)],
        ["Variación", (cierre.x_studio_variacion_total >= 0 ? "+" : "") + moneda(cierre.x_studio_variacion_total) + " (" + num(cierre.x_studio_porcentaje_variacion).toFixed(1) + "%)"],
      ],
      headStyles: { fillColor: [22,163,74], textColor: 255, fontStyle: "bold", fontSize: 9 },
      styles: { fontSize: 9.5, cellPadding: 4, textColor: [17,24,39] },
      columnStyles: { 1: { halign: "right", fontStyle: "bold" } },
      margin: { left: 14, right: 14 },
    });
    let yFinal = doc.lastAutoTable.finalY + 10;

    doc.setFillColor(22, 163, 74);
    doc.rect(14, yFinal, ancho - 28, 14, "F");
    doc.setTextColor(255,255,255); doc.setFont(undefined, "bold"); doc.setFontSize(12);
    doc.text("TOTAL A " + (esInterno ? "CARGAR" : "FACTURAR") + ":", 18, yFinal + 9);
    doc.text(moneda(cierre.x_studio_total_costo_real), ancho - 18, yFinal + 9, { align: "right" });
    yFinal += 24;

    doc.setTextColor(17,24,39); doc.setFont(undefined, "normal"); doc.setFontSize(9);
    doc.text("Diagnóstico: " + (cierre.x_studio_diagnostico_final || "—").slice(0, 110), 14, yFinal);
    yFinal += 6;
    doc.text("Resultado de prueba: " + (cierre.x_studio_resultado_prueba || "—") + "   Aceptado por: " + (cierre.x_studio_aceptado_por_cliente || "—"), 14, yFinal);

    const alturaPagina = doc.internal.pageSize.getHeight();
    doc.setDrawColor(228,233,238);
    doc.line(14, alturaPagina - 30, 80, alturaPagina - 30);
    doc.setTextColor(107,114,128); doc.setFontSize(8.5);
    doc.text("Firma de conformidad", 14, alturaPagina - 25);
    doc.text("Cerrado " + formatearFecha(cierre.x_studio_fecha_cierre) + " — Infotaller COMASA", 14, alturaPagina - 12);

    return doc;
  }

  async function generarYCompartir(){
    setGenerandoPdf(true); setError("");
    try {
      const doc = construirPDF();
      const nombreArchivo = cierre.x_name + "-soporte.pdf";
      const blob = doc.output("blob");
      const archivo = new File([blob], nombreArchivo, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        await navigator.share({ files: [archivo], title: "Documento de soporte " + cierre.x_name });
      } else {
        doc.save(nombreArchivo);
      }
    } catch(e) {
      if (e.name !== "AbortError") setError("No se pudo generar/compartir: " + e.message);
    } finally {
      setGenerandoPdf(false);
    }
  }

  function descargar(){
    try { construirPDF().save(cierre.x_name + "-soporte.pdf"); }
    catch(e) { setError("No se pudo generar el PDF: " + e.message); }
  }

  if (cargando) return h("div", { className: "panel cargando" }, "Cargando...");
  if (error && !cierre) return h("div", { className: "panel error-carga" }, error);
  if (!cierre) return null;

  const esInterno = cliente && cliente.x_studio_tipo_cliente === "Interno";

  return h("div", null,
    h("button", { className: "link-volver", onClick: onVolver }, "← Volver"),
    h("div", { className: "panel" },
      h("h2", { style: { margin:"0 0 4px", fontSize:"16px" } }, cierre.x_name),
      h("div", { style: { fontSize:"12px", color:"var(--color-texto-suave)", marginBottom:"16px" } },
        (orden ? orden.x_name : "") + " · " + (cliente ? cliente.x_name : "") + " · " + formatearFecha(cierre.x_studio_fecha_cierre)
      ),
      h("div", { className: "comparativo" },
        h("div", { className: "caja-comparativo" },
          h("div", { className: "etiqueta" }, "Presupuestado"),
          h("div", { className: "valor" }, moneda(cierre.x_studio_total_presupuestado))
        ),
        h("div", { className: "caja-comparativo" },
          h("div", { className: "etiqueta" }, "Costo Real / Total a " + (esInterno ? "cargar" : "facturar")),
          h("div", { className: "valor" }, moneda(cierre.x_studio_total_costo_real))
        ),
        h("div", { className: "caja-comparativo " + (cierre.x_studio_variacion_total <= 0 ? "positiva" : "negativa") },
          h("div", { className: "etiqueta" }, "Variación"),
          h("div", { className: "valor" }, (cierre.x_studio_variacion_total >= 0 ? "+" : "") + moneda(cierre.x_studio_variacion_total))
        )
      ),
      cliente && h("div", { style: { background:"#F8FAFC", borderRadius:"8px", padding:"12px", fontSize:"12.5px", marginBottom:"14px" } },
        h("strong", null, esInterno ? "Cargar a centro de costo" : "Cuenta por cobrar — cliente externo"),
        h("div", { style: { marginTop:"4px", color:"var(--color-texto-suave)" } },
          esInterno
            ? "Centro de costo: " + (cliente.x_studio_centro_costo || "—") + " · Finca: " + m2oTexto(cliente.x_studio_finca) + " · Cultivo: " + m2oTexto(cliente.x_studio_cultivo) + " · Lote: " + m2oTexto(cliente.x_studio_lote)
            : "RUC: " + (cliente.x_studio_identificacion_fiscal || "—") + " · Condiciones de pago: " + (cliente.x_studio_condiciones_pago || "—")
        )
      ),
      error && h("div", { className: "mensaje-error" }, error),
      exito && h("div", { className: "mensaje-exito" }, exito),
      h("div", { className: "barra-botones" },
        h("button", { className: "btn-secundario", onClick: descargar, disabled: generandoPdf }, "⬇️ Descargar PDF"),
        h("button", { className: "btn-secundario", onClick: generarYCompartir, disabled: generandoPdf },
          generandoPdf ? "Generando..." : "📤 Compartir Documento de Soporte"),
        h("button", { className: "btn-primario", onClick: generarLinkVistoBueno, disabled: generandoLink },
          generandoLink ? "Generando link..." : "🔗 Enviar a cliente para visto bueno")
      )
    )
  );
}

function Cierres(){
  const [sesion, setSesion] = useState(null);
  const [cierres, setCierres] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [errorCarga, setErrorCarga] = useState("");
  const [modalSelector, setModalSelector] = useState(false);
  const [ordenParaCerrar, setOrdenParaCerrar] = useState(null);
  const [cierreSeleccionado, setCierreSeleccionado] = useState(null);

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargarLista(); }
  }, []);

  async function cargarLista(){
    setCargando(true); setErrorCarga("");
    try {
      const filas = await tallerQuery("x_taller_cierre", [
        "id","x_name","x_studio_orden_id","x_studio_total_presupuestado","x_studio_total_costo_real",
        "x_studio_variacion_total","x_studio_porcentaje_variacion","x_studio_resultado_prueba","x_studio_fecha_cierre",
      ], [], 1000);
      setCierres(filas);
    } catch(e) {
      setErrorCarga("No se pudieron cargar los cierres: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  if (!sesion) return null;

  if (ordenParaCerrar) {
    const Componente = ordenParaCerrar.x_studio_estado === "Rechazada" ? CierreSinReparar : FormularioCierre;
    return h(Componente, {
      orden: ordenParaCerrar,
      onVolver: () => setOrdenParaCerrar(null),
      onCreado: () => { setOrdenParaCerrar(null); cargarLista(); },
    });
  }

  if (cierreSeleccionado) {
    return h(DetalleCierre, { cierreId: cierreSeleccionado, onVolver: () => setCierreSeleccionado(null) });
  }

  const columnas = [
    { clave: "x_name", titulo: "Cierre" },
    { clave: "x_studio_orden_id", titulo: "Orden" },
    { clave: "x_studio_total_presupuestado", titulo: "Presupuestado", formatear: moneda },
    { clave: "x_studio_total_costo_real", titulo: "Costo Real", formatear: moneda },
    { clave: "x_studio_porcentaje_variacion", titulo: "% Variación", formatear: v => num(v).toFixed(1) + "%" },
    { clave: "x_studio_resultado_prueba", titulo: "Prueba" },
    { clave: "x_studio_fecha_cierre", titulo: "Fecha", formatear: formatearFecha },
  ];

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "✅ Cierres"),
      h("div", { className: "barra-botones" },
        h("button", { className: "btn-refrescar", onClick: cargarLista }, "↻ Refrescar"),
        h("button", { className: "btn-primario", onClick: () => setModalSelector(true) }, "+ Cerrar una Orden")
      )
    ),
    h("div", { className: "panel" },
      cargando
        ? h("div", { className: "cargando" }, "Cargando...")
        : errorCarga
          ? h("div", { className: "error-carga" }, errorCarga)
          : cierres.length === 0
            ? h("div", { className: "error-carga" }, "Todavía no hay cierres registrados.")
            : TablaInfoAgro(h, { columnas, filas: cierres, onFilaClick: c => setCierreSeleccionado(c.id) })
    ),

    modalSelector && h("div", { className: "modal-fondo", style: { position:"fixed", inset:0, background:"rgba(17,24,39,.45)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:500, padding:"20px" }, onClick: () => setModalSelector(false) },
      h("div", { style: { background:"#fff", borderRadius:"12px", padding:"22px", width:"100%", maxWidth:"680px", maxHeight:"85vh", overflowY:"auto", boxShadow:"0 20px 40px rgba(17,24,39,.25)" }, onClick: e => e.stopPropagation() },
        h("h3", { style: { margin:"0 0 14px", fontSize:"15px" } }, "Elegí la orden a cerrar"),
        h(SelectorOrden, { onSeleccionar: o => { setModalSelector(false); setOrdenParaCerrar(o); } }),
        h("div", { style: { display:"flex", justifyContent:"flex-end", marginTop:"14px" } },
          h("button", { className: "btn-secundario", onClick: () => setModalSelector(false) }, "Cancelar")
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Cierres));
</script>

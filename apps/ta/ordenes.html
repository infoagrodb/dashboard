<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotaller — Órdenes de Trabajo</title>
<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>
<script src="core.js?v=5"></script>
<link rel="stylesheet" href="core.css?v=2">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626; --color-peligro-suave:#FEE2E2;
    --radio:10px; --sombra:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--color-fondo); color:var(--color-texto); font-size:13.5px;
  }
  .barra-superior{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .barra-superior h1{font-size:15px; margin:0;}
  .btn-refrescar{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .btn-refrescar:hover{border-color:var(--color-primario); color:var(--color-primario-oscuro);}

  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px;}

  .badge-estado{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; white-space:nowrap;}
  .estado-Recibida, .estado-En-diagnostico{background:#DBEAFE; color:#1D4ED8;}
  .estado-Pendiente-de-presupuesto, .estado-Presupuestada, .estado-Pendiente-de-aprobacion{background:#FEF3C7; color:#B45309;}
  .estado-Aprobada, .estado-En-reparacion, .estado-Pendiente-de-repuesto{background:#DBEAFE; color:#1D4ED8;}
  .estado-Terminada, .estado-Entregada, .estado-Cerrada{background:#D1FAE5; color:#15803D;}
  .estado-Rechazada, .estado-Cancelada{background:#FEE2E2; color:#991B1B;}

  .badge-prioridad{font-size:10px; font-weight:700; padding:1px 7px; border-radius:9px;}
  .prioridad-Baja{background:#F1F5F9; color:#64748B;}
  .prioridad-Normal{background:#E0F2FE; color:#0369A1;}
  .prioridad-Alta{background:#FEF3C7; color:#B45309;}
  .prioridad-Emergencia{background:#FEE2E2; color:#991B1B;}

  .cargando, .error-carga{text-align:center; padding:40px; color:var(--color-texto-suave);}

  /* ---- Modal detalle ---- */
  .modal-fondo{position:fixed; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .modal-detalle{background:#fff; border-radius:12px; padding:22px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 40px rgba(17,24,39,.25);}
  .modal-detalle h3{margin:0 0 4px; font-size:16px;}
  .modal-detalle .folio-sub{color:var(--color-texto-suave); font-size:12px; margin-bottom:16px;}
  .fila-detalle{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .campo-detalle label{display:block; font-size:11px; color:var(--color-texto-suave); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px;}
  .campo-detalle .valor{font-size:13.5px;}
  .campo-detalle textarea, .campo-detalle select{
    width:100%; border:1px solid var(--color-borde); border-radius:7px; padding:8px; font-size:13px; font-family:inherit;
  }
  .modal-botones{display:flex; gap:8px; justify-content:flex-end; margin-top:18px;}
  .btn-primario{background:var(--color-primario); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .btn-primario:hover:not(:disabled){background:var(--color-primario-oscuro);}
  .btn-primario:disabled{opacity:.6; cursor:default;}
  .btn-secundario{background:#fff; border:1px solid var(--color-borde); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; color:var(--color-texto);}
  .mensaje-error{background:var(--color-peligro-suave); border-left:3px solid var(--color-peligro); color:#991B1B; font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}
  .mensaje-exito{background:var(--color-acento-suave); border-left:3px solid var(--color-primario); color:var(--color-primario-oscuro); font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}
</style>
</head>
<body>
<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">ordenes.html — v3 (técnico + diagnóstico + entrega)</div>

<script>
const h = React.createElement;
const { useState, useEffect } = React;

const ESTADOS_QUE_OCUPAN_BAHIA = ["Recibida","En diagnóstico","Pendiente de presupuesto","Presupuestada",
  "Pendiente de aprobación","Aprobada","En reparación","Pendiente de repuesto"];

function claseEstado(estado){
  return "badge-estado estado-" + String(estado).replace(/\s+/g, "-").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function claseTexto(prefijo, valor){
  return prefijo + " " + prefijo + "-" + String(valor).replace(/\s+/g, "-").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/* ------------------------------------------------------------
   Modal de detalle / cambio de estado
   ------------------------------------------------------------ */
function ModalDetalleOrden({ orden, bahias, tecnicos, ocupacionPorBahia, onCerrar, onActualizado }){
  const [nuevoEstado, setNuevoEstado] = useState(orden.x_studio_estado);
  const [nuevaBahiaId, setNuevaBahiaId] = useState(
    Array.isArray(orden.x_studio_bahia_id) ? String(orden.x_studio_bahia_id[0]) : ""
  );
  const [nuevoTecnicoId, setNuevoTecnicoId] = useState(
    Array.isArray(orden.x_studio_tecnico_responsable_id) ? String(orden.x_studio_tecnico_responsable_id[0]) : ""
  );
  const [diagnostico, setDiagnostico] = useState(orden.x_studio_diagnostico || "");
  const [fechaEntrega, setFechaEntrega] = useState(orden.x_studio_fecha_entrega ? orden.x_studio_fecha_entrega.slice(0,10) : "");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");
  const [exito, setExito] = useState("");

  function m2oTexto(v){
    return Array.isArray(v) ? v[1] : (v || "—");
  }

  const bahiaActualId = Array.isArray(orden.x_studio_bahia_id) ? orden.x_studio_bahia_id[0] : null;
  const tecnicoActualId = Array.isArray(orden.x_studio_tecnico_responsable_id) ? orden.x_studio_tecnico_responsable_id[0] : null;

  async function guardar(){
    const cambios = {};
    if (nuevoEstado !== orden.x_studio_estado) cambios.x_studio_estado = nuevoEstado;

    const bahiaSeleccionadaId = nuevaBahiaId ? Number(nuevaBahiaId) : null;
    const bahiaCambio = bahiaSeleccionadaId !== bahiaActualId;
    if (bahiaCambio) cambios.x_studio_bahia_id = bahiaSeleccionadaId || false;

    const tecnicoSeleccionadoId = nuevoTecnicoId ? Number(nuevoTecnicoId) : null;
    if (tecnicoSeleccionadoId !== tecnicoActualId) cambios.x_studio_tecnico_responsable_id = tecnicoSeleccionadoId || false;

    if (diagnostico !== (orden.x_studio_diagnostico || "")) cambios.x_studio_diagnostico = diagnostico;

    if (fechaEntrega !== (orden.x_studio_fecha_entrega ? orden.x_studio_fecha_entrega.slice(0,10) : "")) {
      cambios.x_studio_fecha_entrega = fechaEntrega ? fechaEntrega + " " + new Date().toTimeString().slice(0,8) : false;
    }

    if (Object.keys(cambios).length === 0){
      setError("No hay cambios para guardar.");
      return;
    }

    // Validar capacidad SOLO si se está asignando una bahía nueva (no al quitarla)
    if (bahiaCambio && bahiaSeleccionadaId) {
      const bahia = bahias.find(b => b.id === bahiaSeleccionadaId);
      const ocupados = ocupacionPorBahia[bahiaSeleccionadaId] || 0;
      if (bahia && ocupados >= bahia.x_studio_capacidad) {
        if (bahia.x_studio_modo_limite === "Bloquear al llegar al límite") {
          setError(`"${bahia.x_name}" ya está al límite (${ocupados}/${bahia.x_studio_capacidad}). Esta bahía bloquea nuevas asignaciones al llegar al tope — elegí otra o libera espacio primero.`);
          return;
        } else {
          if (!confirm(`"${bahia.x_name}" ya está al límite (${ocupados}/${bahia.x_studio_capacidad}). Esta bahía solo advierte, no bloquea — ¿asignar de todas formas?`)) {
            return;
          }
        }
      }
    }

    setGuardando(true); setError(""); setExito("");
    try {
      const resp = await tallerActualizar("x_taller_orden", orden.id, cambios);
      if (resp.ok) {
        setExito("Guardado correctamente.");
        onActualizado({
          ...orden, ...cambios,
          x_studio_bahia_id: bahiaSeleccionadaId ? [bahiaSeleccionadaId, bahias.find(b=>b.id===bahiaSeleccionadaId)?.x_name] : false,
          x_studio_tecnico_responsable_id: tecnicoSeleccionadoId ? [tecnicoSeleccionadoId, tecnicos.find(t=>t.id===tecnicoSeleccionadoId)?.x_name] : false,
        });
      } else {
        setError(resp.error || "No se pudo actualizar.");
      }
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal-detalle", onClick: e => e.stopPropagation() },
      h("h3", null, orden.x_name),
      h("div", { className: "folio-sub" }, "Recepcionado: " + formatearFecha(orden.x_studio_fecha_recepcion)),

      h("div", { className: "fila-detalle" },
        h("div", { className: "campo-detalle" },
          h("label", null, "Cliente"),
          h("div", { className: "valor" }, m2oTexto(orden.x_studio_cliente_id))
        ),
        h("div", { className: "campo-detalle" },
          h("label", null, "Equipo"),
          h("div", { className: "valor" }, m2oTexto(orden.x_studio_equipo_id))
        )
      ),
      h("div", { className: "campo-detalle", style: { marginBottom: "12px" } },
        h("label", null, "Prioridad"),
        h("div", { className: "valor" }, h("span", { className: claseTexto("badge-prioridad", orden.x_studio_prioridad) }, orden.x_studio_prioridad))
      ),
      h("div", { className: "campo-detalle", style: { marginBottom: "12px" } },
        h("label", null, "Problema reportado por el cliente"),
        h("div", { className: "valor" }, orden.x_studio_problema_reportado || "—")
      ),

      h("div", { className: "campo-detalle", style: { marginBottom: "12px" } },
        h("label", null, "Diagnóstico (causa raíz)"),
        h("textarea", {
          value: diagnostico, onChange: e => setDiagnostico(e.target.value), rows: 3,
          placeholder: "Pruebas realizadas y causa raíz del problema...",
          style: { width:"100%", border:"1px solid var(--color-borde)", borderRadius:"7px", padding:"8px", fontSize:"13px", fontFamily:"inherit", resize:"vertical" },
        })
      ),

      h("div", { className: "fila-detalle" },
        h("div", { className: "campo-detalle" },
          h("label", null, "Cambiar estado"),
          h("select", { value: nuevoEstado, onChange: e => setNuevoEstado(e.target.value) },
            INFOTALLER_ESTADOS_ORDEN.map(e => h("option", { key: e, value: e }, e))
          )
        ),
        h("div", { className: "campo-detalle" },
          h("label", null, "Asignar bahía"),
          h("select", { value: nuevaBahiaId, onChange: e => setNuevaBahiaId(e.target.value) },
            h("option", { value: "" }, "— Sin asignar —"),
            bahias.map(b => {
              const ocupados = ocupacionPorBahia[b.id] || 0;
              return h("option", { key: b.id, value: b.id }, b.x_name + " (" + ocupados + "/" + b.x_studio_capacidad + ")");
            })
          )
        )
      ),

      h("div", { className: "fila-detalle" },
        h("div", { className: "campo-detalle" },
          h("label", null, "Técnico responsable"),
          h("select", { value: nuevoTecnicoId, onChange: e => setNuevoTecnicoId(e.target.value) },
            h("option", { value: "" }, "— Sin asignar —"),
            tecnicos.map(t => h("option", { key: t.id, value: t.id }, t.x_name))
          )
        ),
        h("div", { className: "campo-detalle", style: { marginBottom: "0" } },
          h("label", null, "Fecha de entrega"),
          h("input", { type: "date", value: fechaEntrega, onChange: e => setFechaEntrega(e.target.value) })
        )
      ),

      error && h("div", { className: "mensaje-error" }, error),
      exito && h("div", { className: "mensaje-exito" }, exito),

      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar }, "Cerrar"),
        h("button", { className: "btn-primario", onClick: guardar, disabled: guardando }, guardando ? "Guardando..." : "Guardar cambios")
      )
    )
  );
}

/* ------------------------------------------------------------
   Pantalla principal
   ------------------------------------------------------------ */
function OrdenesDeTrabajo(){
  const [sesion, setSesion] = useState(null);
  const [ordenes, setOrdenes] = useState(null);
  const [bahias, setBahias] = useState([]);
  const [tecnicos, setTecnicos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [errorCarga, setErrorCarga] = useState("");
  const [ordenSeleccionada, setOrdenSeleccionada] = useState(null);

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargarOrdenes(); }
  }, []);

  async function cargarOrdenes(){
    setCargando(true); setErrorCarga("");
    try {
      const [filas, filasBahias, filasTecnicos] = await Promise.all([
        tallerQuery("x_taller_orden", [
          "id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_estado",
          "x_studio_prioridad","x_studio_fecha_recepcion","x_studio_bahia_id",
          "x_studio_tecnico_responsable_id","x_studio_problema_reportado","x_studio_diagnostico",
          "x_studio_fecha_entrega",
        ], [], 1000, 0),
        tallerQuery("x_taller_bahia", ["id","x_name","x_studio_capacidad","x_studio_modo_limite"], [], 500),
        tallerQuery("x_taller_usuario", ["id","x_name","x_studio_rol"], [["x_studio_rol","=","Técnico"]], 500),
      ]);
      setOrdenes(filas);
      setBahias(filasBahias);
      setTecnicos(filasTecnicos);
    } catch(e) {
      setErrorCarga("No se pudieron cargar las órdenes: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  if (!sesion) return null;

  const columnas = [
    { clave: "x_name", titulo: "Folio" },
    { clave: "x_studio_cliente_id", titulo: "Cliente" },
    { clave: "x_studio_equipo_id", titulo: "Equipo" },
    { clave: "x_studio_estado", titulo: "Estado" },
    { clave: "x_studio_prioridad", titulo: "Prioridad" },
    { clave: "x_studio_fecha_recepcion", titulo: "Fecha Recepción", formatear: formatearFecha },
    { clave: "x_studio_bahia_id", titulo: "Bahía" },
    { clave: "x_studio_tecnico_responsable_id", titulo: "Técnico" },
  ];

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "🛠️ Órdenes de Trabajo"),
      h("button", { className: "btn-refrescar", onClick: cargarOrdenes }, "↻ Refrescar")
    ),

    h("div", { className: "panel" },
      cargando
        ? h("div", { className: "cargando" }, "Cargando órdenes...")
        : errorCarga
          ? h("div", { className: "error-carga" }, errorCarga)
          : TablaInfoAgro(h, {
              columnas,
              filas: ordenes || [],
              onFilaClick: setOrdenSeleccionada,
            })
    ),

    ordenSeleccionada && h(ModalDetalleOrden, {
      orden: ordenSeleccionada,
      bahias,
      tecnicos,
      ocupacionPorBahia: calcularOcupacion(ordenes || [], ordenSeleccionada.id),
      onCerrar: () => setOrdenSeleccionada(null),
      onActualizado: actualizada => {
        setOrdenes(prev => prev.map(o => o.id === actualizada.id ? actualizada : o));
        setOrdenSeleccionada(null);
      },
    })
  );
}

// Cuenta cuántas órdenes activas ocupan cada bahía, EXCLUYENDO la orden que se está
// editando (para que reasignarla a la misma bahía no se cuente contra sí misma).
function calcularOcupacion(ordenes, idOrdenExcluir){
  const conteo = {};
  ordenes.forEach(o => {
    if (o.id === idOrdenExcluir) return;
    if (!ESTADOS_QUE_OCUPAN_BAHIA.includes(o.x_studio_estado)) return;
    if (!o.x_studio_bahia_id) return;
    const bId = Array.isArray(o.x_studio_bahia_id) ? o.x_studio_bahia_id[0] : o.x_studio_bahia_id;
    conteo[bId] = (conteo[bId] || 0) + 1;
  });
  return conteo;
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(OrdenesDeTrabajo));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotaller — Ingresar</title>
<script>
  // Captura cualquier error (incluido que un script del CDN no cargue) y lo
  // muestra en una caja roja visible en pantalla — para diagnosticar sin
  // necesidad de abrir las herramientas de desarrollador del navegador.
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
  setTimeout(function(){
    if (!document.getElementById('raiz') || !document.getElementById('raiz').hasChildNodes()){
      var caja = document.getElementById('cajaErrorDiag');
      if (!caja) {
        caja = document.createElement('div');
        caja.id = 'cajaErrorDiag';
        caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
          + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;';
        document.body.appendChild(caja);
      }
      caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ Pasaron 4 segundos y React nunca dibujó nada (sin error explícito) — probablemente un script del CDN no cargó a tiempo.';
    }
  }, 4000);
</script>
<script src="core.js?v=5"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626;
    --radio:10px; --sombra-panel:0 10px 28px rgba(17,24,39,.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,#F8FAFC 0%,var(--color-acento-suave) 100%);
    color:var(--color-texto);
  }
  .tarjeta{
    background:var(--color-panel); border:1px solid var(--color-borde); border-radius:16px;
    box-shadow:var(--sombra-panel); padding:36px 32px; width:100%; max-width:380px;
  }
  .logo{font-size:34px; text-align:center; margin-bottom:4px;}
  h1{font-size:19px; text-align:center; margin:0 0 4px; color:var(--color-texto);}
  .subtitulo{font-size:12.5px; text-align:center; color:var(--color-texto-suave); margin:0 0 24px;}
  label{display:block; font-size:12px; color:var(--color-texto-suave); margin:14px 0 4px; text-transform:uppercase; letter-spacing:.03em;}
  input{
    width:100%; border:1px solid var(--color-borde); border-radius:8px; padding:10px 12px;
    font-size:14.5px; background:#fff; color:var(--color-texto);
  }
  input:focus{outline:2px solid var(--color-primario); outline-offset:1px; border-color:var(--color-primario);}
  button{
    width:100%; margin-top:22px; background:var(--color-primario); color:#fff; border:none;
    border-radius:8px; padding:11px; font-size:14.5px; font-weight:600; cursor:pointer;
    transition:background .15s;
  }
  button:hover:not(:disabled){background:var(--color-primario-oscuro);}
  button:disabled{opacity:.6; cursor:default;}
  .error{
    margin-top:14px; background:#FEE2E2; border-left:3px solid var(--color-peligro);
    color:#991B1B; font-size:12.5px; padding:8px 10px; border-radius:6px;
  }
  .pie{margin-top:20px; text-align:center; font-size:11.5px; color:var(--color-texto-suave);}
</style>
</head>
<body>
<div id="raiz"></div>

<script>
// Sin JSX ni Babel: React.createElement directo. Más verboso, pero elimina
// por completo la dependencia de transformar código en el navegador.
const h = React.createElement;
const { useState, useEffect } = React;

function Login(){
  const [usuario, setUsuario] = useState("");
  const [clave, setClave] = useState("");
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    if (obtenerSesion()) window.location.href = "index.html";
  }, []);

  async function enviar(e){
    e.preventDefault();
    setError("");
    if (!usuario.trim() || !clave){
      setError("Ingresá usuario y clave.");
      return;
    }
    setCargando(true);
    try{
      const resp = await tallerLogin(usuario.trim(), clave);
      if (resp.ok){
        guardarSesion(resp.usuario);
        window.location.href = "index.html";
      } else {
        setError(resp.error || "Usuario o clave incorrectos.");
      }
    } catch(err){
      setError("No se pudo conectar con el servidor: " + err.message);
    } finally {
      setCargando(false);
    }
  }

  return h("div", { className: "tarjeta" },
    h("div", { className: "logo" }, "🔧"),
    h("h1", null, "Infotaller"),
    h("p", { className: "subtitulo" }, "Taller de Reparación — División Agrícola COMASA"),
    h("form", { onSubmit: enviar },
      h("label", { htmlFor: "campoUsuario" }, "Usuario"),
      h("input", {
        id: "campoUsuario", type: "text", autoComplete: "username", autoFocus: true,
        value: usuario, onChange: e => setUsuario(e.target.value),
      }),
      h("label", { htmlFor: "campoClave" }, "Clave"),
      h("input", {
        id: "campoClave", type: "password", autoComplete: "current-password",
        value: clave, onChange: e => setClave(e.target.value),
      }),
      h("button", { type: "submit", disabled: cargando }, cargando ? "Verificando..." : "Ingresar"),
      error ? h("div", { className: "error" }, error) : null
    ),
    h("p", { className: "pie" }, "Acceso restringido — cada usuario tiene su propio rol y permisos.")
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Login));
</script>
</body>
</html>

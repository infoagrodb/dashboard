<script>
const h = React.createElement;
const { useState, useEffect, useRef } = React;

/* ------------------------------------------------------------
   Buscador genérico reutilizable (cliente / equipo)
   ------------------------------------------------------------ */
function Buscador({ placeholder, buscar, renderItem, onSeleccionar, deshabilitado }){
  const [texto, setTexto] = useState("");
  const [resultados, setResultados] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const timerRef = useRef(null);

  function cambiar(valor){
    setTexto(valor);
    if (timerRef.current) clearTimeout(timerRef.current);
    if (!valor.trim()){ setResultados(null); return; }
    timerRef.current = setTimeout(async () => {
      setBuscando(true);
      try {
        const r = await buscar(valor.trim());
        setResultados(r);
      } catch(e) {
        setResultados([]);
      } finally {
        setBuscando(false);
      }
    }, 300);
  }

  return h("div", { className: "buscador" },
    h("input", {
      type: "text", placeholder, value: texto, disabled: deshabilitado,
      onChange: e => cambiar(e.target.value),
    }),
    resultados !== null && h("div", { className: "buscador-resultados" },
      buscando ? h("div", { className: "buscador-vacio" }, "Buscando...") :
      resultados.length === 0 ? h("div", { className: "buscador-vacio" }, "Sin resultados") :
      resultados.map(item => h("div", {
          key: item.id, className: "buscador-item",
          onClick: () => { onSeleccionar(item); setTexto(""); setResultados(null); },
        }, renderItem(item))
      )
    )
  );
}

/* ------------------------------------------------------------
   Modal simple para crear cliente nuevo
   ------------------------------------------------------------ */
/* La creación de clientes se movió a Configuración (Administración → Clientes),
   controlada por un Administrador. Recepción ya NO crea clientes: siempre
   llega con el cliente que trae la Solicitud de Servicio de origen. */

/* ------------------------------------------------------------
   Modal simple para registrar equipo nuevo (de un cliente externo)
   ------------------------------------------------------------ */
function ModalNuevoEquipo({ cliente, onCerrar, onCreado }){
  const [nombre, setNombre] = useState("");
  const [tipoEquipo, setTipoEquipo] = useState("Tractor");
  const [marca, setMarca] = useState("");
  const [modelo, setModelo] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");

  async function guardar(){
    if (!nombre.trim()){ setError("El nombre/identificación del equipo es obligatorio."); return; }
    setGuardando(true); setError("");
    try {
      const resp = await tallerCrear("x_equiposagricolas", {
        x_name: nombre.trim(),
        x_studio_cliente_id: cliente.id,
        x_studio_tipo_equipo: tipoEquipo,
        x_studio_marca: marca || false,
        x_studio_modelo: modelo || false,
      });
      if (resp.ok) {
        onCreado({ id: resp.id, x_name: nombre.trim() });
      } else {
        setError(resp.error || "No se pudo registrar el equipo.");
      }
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal", onClick: e => e.stopPropagation() },
      h("h3", null, "🚜 Nuevo Equipo — ", cliente.x_name),
      h("div", { className: "campo" },
        h("label", null, "Identificación (marca + modelo, placa, etc.) ", h("span", { className: "req" }, "*")),
        h("input", { type: "text", value: nombre, autoFocus: true, onChange: e => setNombre(e.target.value) })
      ),
      h("div", { className: "fila" },
        h("div", { className: "campo" },
          h("label", null, "Tipo de equipo"),
          h("select", { value: tipoEquipo, onChange: e => setTipoEquipo(e.target.value) },
            ["Tractor","Implemento","Vehículo","Motor","Bomba","Otro"].map(t => h("option", { key: t, value: t }, t))
          )
        ),
        h("div", { className: "campo" },
          h("label", null, "Marca"),
          h("input", { type: "text", value: marca, onChange: e => setMarca(e.target.value) })
        )
      ),
      h("div", { className: "campo" },
        h("label", null, "Modelo"),
        h("input", { type: "text", value: modelo, onChange: e => setModelo(e.target.value) })
      ),
      error && h("div", { className: "mensaje mensaje-error" }, error),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar, disabled: guardando }, "Cancelar"),
        h("button", { className: "btn-primario", onClick: guardar, disabled: guardando }, guardando ? "Guardando..." : "Registrar equipo")
      )
    )
  );
}

/* ------------------------------------------------------------
   Pantalla principal de Recepción
   ------------------------------------------------------------ */
function m2oTextoLocal(v){ return Array.isArray(v) ? v[1] : (v || "—"); }

function ModalElegirSolicitud({ solicitudes, onCerrar, onElegir }){
  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal modal-ancho", onClick: e => e.stopPropagation() },
      h("h3", null, "📞 Elegí la Solicitud a Recibir"),
      solicitudes === null
        ? h("div", { className: "buscador-vacio" }, "Cargando...")
        : solicitudes.length === 0
          ? h("div", { className: "buscador-vacio" }, "No hay solicitudes pendientes ahora mismo.")
          : h("div", { className: "lista-solicitudes lista-solicitudes-modal" },
              solicitudes.map(s => h("div", {
                  key: s.id, className: "fila-solicitud", onClick: () => onElegir(s), role: "button", tabIndex: 0,
                },
                h("div", { className: "fila-solicitud-izq" },
                  h("div", { className: "fila-solicitud-folio" },
                    s.x_name,
                    s.x_studio_prioridad && s.x_studio_prioridad !== "Normal" && h("span", { className: "badge-prioridad" }, s.x_studio_prioridad)
                  ),
                  h("div", { className: "fila-solicitud-cliente" }, m2oTextoLocal(s.x_studio_cliente_id)),
                  h("div", { className: "fila-solicitud-detalle" },
                    (m2oTextoLocal(s.x_studio_equipo_id) !== "—" ? m2oTextoLocal(s.x_studio_equipo_id) : s.x_studio_descripcion_equipo) +
                    " — " + (s.x_studio_problema_reportado || "").slice(0, 90) + ((s.x_studio_problema_reportado || "").length > 90 ? "…" : "")
                  )
                ),
                h("div", { className: "fila-solicitud-der" },
                  h("span", { className: "fila-solicitud-fecha" }, formatearFechaHora(s.create_date)),
                  h("span", { className: "fila-solicitud-flecha" }, "→")
                )
              ))
            ),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar }, "Cerrar")
      )
    )
  );
}

function Recepcion(){
  const [sesion, setSesion] = useState(null);

  const paramsUrl = new URLSearchParams(window.location.search);
  const idSolicitud = paramsUrl.get("desde_solicitud");
  const [cargandoSolicitud, setCargandoSolicitud] = useState(!!idSolicitud);
  const [solicitudOrigen, setSolicitudOrigen] = useState(null);

  const [cliente, setCliente] = useState(null);
  const [equipo, setEquipo] = useState(null);
  const [equiposDelCliente, setEquiposDelCliente] = useState(null);
  const [cargandoEquipos, setCargandoEquipos] = useState(false);
  const [modalEquipo, setModalEquipo] = useState(false);

  const [fechaRecepcion, setFechaRecepcion] = useState(() => fechaParaOdoo(new Date()));
  const [fechaPrometida, setFechaPrometida] = useState("");
  const [prioridad, setPrioridad] = useState("Normal");
  const [problema, setProblema] = useState("");
  const [horometro, setHorometro] = useState("");
  const [kilometraje, setKilometraje] = useState("");

  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");
  const [errorHorometro, setErrorHorometro] = useState("");
  const [folioCreado, setFolioCreado] = useState(null);
  const [pendientesCount, setPendientesCount] = useState(null); // null = aún no se sabe
  const [solicitudesPendientes, setSolicitudesPendientes] = useState(null); // null = cargando
  const [modalPendientes, setModalPendientes] = useState(false);
  const [recepcionadasRecientes, setRecepcionadasRecientes] = useState(null); // null = cargando
  const [respuestaCruda, setRespuestaCruda] = useState(null);

  const ELEMENTOS_ACTA = ["Llantas en buen estado","Espejos","Batería","Herramientas/gata","Combustible","Extintor","Radio/GPS","Sin daños visibles adicionales"];
  const [elementosPresentes, setElementosPresentes] = useState([]);
  const [notasActa, setNotasActa] = useState("");
  const [fotos, setFotos] = useState([]);
  const [subiendoFotos, setSubiendoFotos] = useState(false);

  function aplicarSolicitud(s){
    setSolicitudOrigen(s);
    if (Array.isArray(s.x_studio_cliente_id)) {
      setCliente({ id: s.x_studio_cliente_id[0], x_name: s.x_studio_cliente_id[1], x_studio_tipo_cliente: "Externo" });
    }
    // Si la solicitud ya trae el equipo formal vinculado (no solo la descripción libre), se precarga directo.
    if (Array.isArray(s.x_studio_equipo_id)) {
      setEquipo({ id: s.x_studio_equipo_id[0], x_name: s.x_studio_equipo_id[1] });
    }
    setProblema(
      (!Array.isArray(s.x_studio_equipo_id) && s.x_studio_descripcion_equipo ? "Equipo (según la solicitud): " + s.x_studio_descripcion_equipo + "\n\n" : "") +
      (s.x_studio_problema_reportado || "")
    );
  }

  async function cargarPendientesCount(){
    try {
      const filas = await tallerQuery("x_taller_solicitud", [
        "id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_descripcion_equipo",
        "x_studio_problema_reportado","x_studio_prioridad","create_date",
      ], [["x_studio_estado","=","Pendiente"]], 500);
      filas.sort((a,b) => new Date(a.create_date) - new Date(b.create_date)); // más antigua primero
      setSolicitudesPendientes(filas);
      setPendientesCount(filas.length);
    } catch(e) {
      setSolicitudesPendientes([]);
      setPendientesCount(0);
    }
  }

  async function cargarRecepcionadasRecientes(){
    try {
      const filas = await tallerQuery("x_taller_solicitud", [
        "id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_descripcion_equipo",
        "x_studio_orden_generada_id","create_date",
      ], [["x_studio_estado","=","Convertida"]], 20);
      filas.sort((a,b) => new Date(b.create_date) - new Date(a.create_date)); // más reciente primero
      setRecepcionadasRecientes(filas);
    } catch(e) {
      setRecepcionadasRecientes([]);
    }
  }

  function elegirSolicitudPendiente(s){
    aplicarSolicitud(s);
    setModalPendientes(false);
  }

  function irASolicitud(){
    window.parent.postMessage({ tipo: "navegar", pestana: "solicitud" }, "*");
  }

  useEffect(() => { cargarPendientesCount(); cargarRecepcionadasRecientes(); }, []);

  useEffect(() => {
    if (!idSolicitud) return;
    (async () => {
      try {
        const filas = await tallerQuery("x_taller_solicitud", [
          "id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_descripcion_equipo","x_studio_problema_reportado","create_date",
        ], [["id","=",Number(idSolicitud)]], 1);
        if (filas.length) {
          aplicarSolicitud(filas[0]);
        } else {
          setError("No se encontró la solicitud de origen.");
        }
      } catch(e) {
        setError("No se pudo cargar la solicitud: " + e.message);
      } finally {
        setCargandoSolicitud(false);
      }
    })();
  }, []);

  function alternarElemento(item){
    setElementosPresentes(prev => prev.includes(item) ? prev.filter(x => x !== item) : [...prev, item]);
  }

  function agregarFotos(archivos){
    setFotos(prev => [...prev, ...Array.from(archivos)]);
  }

  function quitarFoto(indice){
    setFotos(prev => prev.filter((_,i) => i !== indice));
  }

  function validarHorometro(valor){
    if (valor === "" || valor === null || valor === undefined){
      const msg = "Obligatorio.";
      setErrorHorometro(msg);
      return msg;
    }
    const num = Number(valor);
    if (isNaN(num) || num < 0){
      const msg = "No es un número válido.";
      setErrorHorometro(msg);
      return msg;
    }
    if (equipo && equipo.x_studio_horometro_actual > 0 && num < equipo.x_studio_horometro_actual){
      const msg = `No puede ser menor al último registrado (${equipo.x_studio_horometro_actual}).`;
      setErrorHorometro(msg);
      return msg;
    }
    setErrorHorometro("");
    return "";
  }

    if (s) setSesion(s);

        [["x_studio_cliente_id","=",idCliente]], 500);
      setEquiposDelCliente(filas);

  async function compartirRecepcion(){
    const texto = "Hola" + (cliente ? " " + cliente.x_name : "") + ", te confirmamos la recepción de tu equipo en el taller.\n\n" +
      "N.º de orden: " + folioCreado + "\n" +
      "Equipo: " + (equipo ? equipo.x_name : "—") + "\n" +
      "Fecha de recepción: " + formatearFecha(fechaRecepcion) + "\n" +
      (solicitudOrigen ? "Solicitud de origen: " + solicitudOrigen.x_name + " (" + formatearFechaHora(solicitudOrigen.create_date) + ")\n" : "") +
      "Problema reportado: " + (problema || "—") + "\n\n" +
      "Te vamos a mantener al tanto del avance. — Infotaller, COMASA";
    if (navigator.share) {
      try { await navigator.share({ title: "Recepción " + folioCreado, text: texto }); }
      catch(e) { /* si cancela el share, no es un error real */ }
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(texto);
      setError(""); // limpia cualquier error viejo
      alert("Copiado al portapapeles — pegalo donde quieras enviarlo.");
    }
  }

  function generarPDFRecepcion(){
    if (!window.jspdf) { setError("La librería de PDF no cargó — recargá la página."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "letter" });
    if (typeof doc.autoTable !== "function") { setError("El complemento de tablas no cargó — recargá la página."); return; }
    const ancho = doc.internal.pageSize.getWidth();

    doc.setTextColor(17,24,39);
    doc.setFont(undefined,"bold"); doc.setFontSize(14);
    doc.text("INFOTALLER", 14, 14);
    doc.setFont(undefined,"normal"); doc.setFontSize(9);
    doc.text("División Agrícola — COMASA", 14, 19);
    doc.text("Departamento de Taller", 14, 23.5);

    doc.setFont(undefined,"bold"); doc.setFontSize(13);
    doc.text("ACTA DE RECEPCIÓN", ancho-14, 14, { align:"right" });
    doc.setFont(undefined,"normal"); doc.setFontSize(9);
    doc.text("N.º: " + folioCreado, ancho-14, 19, { align:"right" });

    doc.setDrawColor(17,24,39); doc.setLineWidth(0.5);
    doc.line(14, 28, ancho-14, 28);

    let y = 36;
    doc.setFont(undefined,"bold"); doc.setFontSize(9); doc.text("CLIENTE", 14, y);
    doc.setFont(undefined,"normal"); doc.text(cliente ? cliente.x_name : "—", 14, y+5);
    doc.setFont(undefined,"bold"); doc.text("FECHA DE RECEPCIÓN", 90, y);
    doc.setFont(undefined,"normal"); doc.text(formatearFecha(fechaRecepcion), 90, y+5);
    y += 12;
    doc.setFont(undefined,"bold"); doc.text("EQUIPO", 14, y);
    doc.setFont(undefined,"normal"); doc.text(equipo ? equipo.x_name : "—", 14, y+5);
    doc.setFont(undefined,"bold"); doc.text("PRIORIDAD", 90, y);
    doc.setFont(undefined,"normal"); doc.text(prioridad, 90, y+5);
    y += 12;
    doc.setFont(undefined,"bold"); doc.text("HORÓMETRO DE RECEPCIÓN", 14, y);
    doc.setFont(undefined,"normal"); doc.text(String(horometro || "—"), 14, y+5);
    doc.setFont(undefined,"bold"); doc.text("KILOMETRAJE DE RECEPCIÓN", 90, y);
    doc.setFont(undefined,"normal"); doc.text(String(kilometraje || "—"), 90, y+5);
    y += 12;
    if (solicitudOrigen) {
      doc.setFont(undefined,"bold"); doc.text("SOLICITUD DE ORIGEN", 14, y);
      doc.setFont(undefined,"normal"); doc.text(solicitudOrigen.x_name + " · " + formatearFechaHora(solicitudOrigen.create_date), 14, y+5);
      y += 12;
    }

    doc.setFont(undefined,"bold"); doc.setFontSize(9); doc.text("PROBLEMA REPORTADO POR EL CLIENTE", 14, y); y += 5;
    doc.setFont(undefined,"normal");
    const probLineas = doc.splitTextToSize(problema || "—", ancho-28);
    doc.text(probLineas, 14, y); y += probLineas.length * 4.5 + 8;

    if (elementosPresentes.length || notasActa.trim()) {
      doc.setFont(undefined,"bold"); doc.text("ELEMENTOS PRESENTES AL RECIBIR", 14, y); y += 5;
      doc.setFont(undefined,"normal"); doc.setFontSize(8.5);
      const elemTexto = elementosPresentes.length ? elementosPresentes.join(", ") : "Ninguno marcado";
      const elemLineas = doc.splitTextToSize(elemTexto, ancho-28);
      doc.text(elemLineas, 14, y); y += elemLineas.length * 4 + 4;
      if (notasActa.trim()) {
        doc.setFont(undefined,"bold"); doc.setFontSize(9); doc.text("NOTAS DEL ACTA", 14, y); y += 5;
        doc.setFont(undefined,"normal"); doc.setFontSize(8.5);
        const notaLineas = doc.splitTextToSize(notasActa, ancho-28);
        doc.text(notaLineas, 14, y); y += notaLineas.length * 4 + 4;
      }
      y += 6;
    }

    if (y > 220) { doc.addPage(); y = 20; }
    doc.setFont(undefined,"normal"); doc.setFontSize(9); doc.setTextColor(17,24,39);
    doc.text("Recepcionado por: " + (sesion ? sesion.nombre : "—"), 14, y); y += 20;
    doc.line(14, y, 90, y);
    doc.setFontSize(8); doc.setTextColor(107,114,128);
    doc.text("Firma de quien recibe (taller)", 14, y+4);
    doc.line(ancho-90, y, ancho-14, y);
    doc.text("Firma de quien entrega (cliente)", ancho-90, y+4);

    doc.save(folioCreado + "-acta-recepcion.pdf");
  }

  function reiniciarFormulario(){
    setCliente(null); setEquipo(null);
    setFechaRecepcion(fechaParaOdoo(new Date()));

    setHorometro(""); setKilometraje("");

  async function registrar(){
    setError("");
    if (!cliente){ setError("Seleccioná un cliente."); return; }
    if (!equipo){ setError("Seleccioná un equipo."); return; }
    if (!problema.trim()){ setError("Describí el problema reportado por el cliente."); return; }
    const msgHorometro = validarHorometro(horometro);
    if (msgHorometro){
      document.getElementById("campoHorometro")?.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    const horometroNum = Number(horometro);

    setGuardando(true);
    try {
      const folio = await tallerFolio("OT");
      const textoActa = "ACTA DE RECEPCIÓN\nElementos presentes: " +
        (elementosPresentes.length ? elementosPresentes.join(", ") : "ninguno marcado") +
        (notasActa.trim() ? "\nNotas: " + notasActa.trim() : "") +
        (solicitudOrigen ? "\nGenerada desde la solicitud " + solicitudOrigen.x_name : "");
      const payload = {
        x_name: folio,
        x_studio_cliente_id: cliente.id,
        x_studio_equipo_id: equipo.id,
        x_studio_fecha_recepcion: fechaRecepcion + " " + new Date().toTimeString().slice(0,8),
        x_studio_fecha_prometida: fechaPrometida || false,
        x_studio_estado: "Recibida",
        x_studio_prioridad: prioridad,
        x_studio_problema_reportado: problema.trim(),
        x_studio_horometro_recepcion: horometroNum,
        x_studio_kilometraje_recepcion: kilometraje ? Number(kilometraje) : 0,
        x_studio_responsable_recepcion_id: sesion.id,
        x_studio_requiere_presupuesto: true,
        x_studio_observaciones: textoActa,
      };
      const resp = await tallerCrear("x_taller_orden", payload);
      setRespuestaCruda({ folio, payload_enviado: payload, respuesta_servidor: resp });
      if (resp.ok) {
        const idOrden = resp.id;

        // Si esta recepción viene de una Solicitud de Servicio, la marca como
        // Convertida y la enlaza a la orden que se acaba de crear.
        if (solicitudOrigen) {
          try {
            await tallerActualizar("x_taller_solicitud", solicitudOrigen.id, {
              x_studio_estado: "Convertida",
              x_studio_orden_generada_id: idOrden,
            });
          } catch(e) { /* no bloquea el flujo — la orden ya quedó registrada */ }
        }

        // Actualiza el horómetro/kilometraje "vigente" del equipo con esta lectura más reciente,
        // para que la próxima recepción compare contra el dato más nuevo.
        try {
          const actualizacionEquipo = { x_studio_horometro_actual: horometroNum };
          if (kilometraje) actualizacionEquipo.x_studio_kilometraje_actual = Number(kilometraje);
          await tallerActualizar("x_equiposagricolas", equipo.id, actualizacionEquipo);
        } catch(e) { /* no bloquea el flujo si esto falla — la orden ya quedó registrada */ }

        // Subir las fotos del acta, una por una (no en paralelo, mismo motivo que en Presupuestos).
        if (fotos.length) {
          setSubiendoFotos(true);
          for (const foto of fotos) {
            try { await tallerSubirAdjunto("x_taller_orden", idOrden, foto); }
            catch(e) { /* si una foto falla no se pierde la orden ya creada, solo se avisa */ setError(prev => (prev ? prev + " " : "") + "Una foto no se pudo subir: " + e.message); }
          }
          setSubiendoFotos(false);
        }
        setFolioCreado(folio);
      } else {
        setError(resp.error || "No se pudo registrar la recepción.");
      }
    } catch(e) {
      setError("Error: " + e.message);
      setRespuestaCruda({ excepcion: e.message });
    } finally {
      setGuardando(false);
    }
  }

      ),
      h("div", { className: "campo" },
        h("label", null, "Notas adicionales del acta (daños, observaciones)"),
        h("textarea", { value: notasActa, onChange: e => setNotasActa(e.target.value), placeholder: "Rayón en la puerta izquierda, falta tapón de radiador..." })
      ),
      h("div", { className: "campo", style: { marginBottom: "0" } },
        h("label", null, "Fotos"),
        h("input", { type: "file", accept: "image/*", capture: "environment", multiple: true,
          onChange: e => { agregarFotos(e.target.files); e.target.value = ""; } }),
        fotos.length > 0 && h("div", { style: { display:"flex", flexWrap:"wrap", gap:"8px", marginTop:"10px" } },
          fotos.map((f, i) => h("div", { key: i, style: { position:"relative" } },
            h("img", { src: URL.createObjectURL(f), style: { width:"64px", height:"64px", objectFit:"cover", borderRadius:"6px", border:"1px solid var(--color-borde)" } }),
            h("button", { type: "button", onClick: () => quitarFoto(i),
              style: { position:"absolute", top:"-6px", right:"-6px", background:"var(--color-peligro)", color:"#fff", border:"none", borderRadius:"50%", width:"18px", height:"18px", fontSize:"11px", cursor:"pointer", lineHeight:"1" } }, "✕")
          ))
        )
      )
    ),

    !folioCreado && h("button", { className: "btn-primario", onClick: registrar, disabled: guardando || subiendoFotos },
      subiendoFotos ? "Subiendo fotos..." : guardando ? "Registrando..." : "✅ Registrar recepción"
    ),

    modalEquipo && cliente && h(ModalNuevoEquipo, {
      cliente,
      onCerrar: () => setModalEquipo(false),
      onCreado: eq => { setEquipo(eq); setModalEquipo(false); cargarEquiposDelCliente(cliente.id); },
    }),
    modalPendientes && h(ModalElegirSolicitud, {
      solicitudes: solicitudesPendientes,
      onCerrar: () => setModalPendientes(false),
      onElegir: elegirSolicitudPendiente,
    })
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Recepcion));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotaller — Seguimiento</title>
<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>
<script src="core.js?v=7"></script>
<link rel="stylesheet" href="core.css?v=2">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626; --color-peligro-suave:#FEE2E2;
    --color-alerta:#D97706; --color-alerta-suave:#FEF3C7;
    --radio:10px; --sombra:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--color-fondo); color:var(--color-texto); font-size:13.5px;}
  .barra-superior{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .barra-superior h1{font-size:15px; margin:0;}
  .btn-refrescar{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .btn-refrescar:hover{border-color:var(--color-primario); color:var(--color-primario-oscuro);}
  .pestanas{display:flex; gap:6px; margin-bottom:14px;}
  .pestana{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 14px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .pestana.activa{background:var(--color-primario); border-color:var(--color-primario); color:#fff; font-weight:600;}
  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px;}
  .cargando, .error-carga{text-align:center; padding:40px; color:var(--color-texto-suave);}
  .badge-dias{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px;}
  .badge-urgente{background:#FEE2E2; color:#991B1B;}
  .badge-pronto{background:#FEF3C7; color:#B45309;}
  .badge-ok{background:#D1FAE5; color:#15803D;}

  .modal-fondo{position:fixed; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .modal{background:#fff; border-radius:12px; padding:22px; width:100%; max-width:440px; box-shadow:0 20px 40px rgba(17,24,39,.25);}
  .modal h3{margin:0 0 4px; font-size:15px;}
  .modal .sub{font-size:12px; color:var(--color-texto-suave); margin-bottom:16px;}
  .campo{margin-bottom:14px;}
  label{display:block; font-size:11.5px; color:var(--color-texto-suave); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
  input, textarea{width:100%; border:1px solid var(--color-borde); border-radius:7px; padding:8px 10px; font-size:13.5px; background:#fff; color:var(--color-texto); font-family:inherit;}
  textarea{resize:vertical; min-height:70px;}
  .btn-primario{background:var(--color-primario); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .btn-primario:hover:not(:disabled){background:var(--color-primario-oscuro);}
  .btn-primario:disabled{opacity:.6; cursor:default;}
  .btn-secundario{background:#fff; border:1px solid var(--color-borde); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; color:var(--color-texto);}
  .modal-botones{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
  .mensaje-error{background:var(--color-peligro-suave); border-left:3px solid var(--color-peligro); color:#991B1B; font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}
</style>
</head>
<body>
<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">seguimiento.html — v1</div>

<script>
const h = React.createElement;
const { useState, useEffect } = React;

function diasDesde(fechaStr){
  if (!fechaStr) return null;
  const d = new Date(String(fechaStr).replace(" ", "T"));
  if (isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

function ModalSeguimiento({ cierre, onCerrar, onGuardado }){
  const [fecha, setFecha] = useState(fechaParaOdoo(new Date()));
  const [notas, setNotas] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");

  async function guardar(){
    if (!notas.trim()){ setError("Anotá qué te dijo el cliente o qué encontraste."); return; }
    setGuardando(true); setError("");
    try {
      const resp = await tallerActualizar("x_taller_cierre", cierre.id, {
        x_studio_seguimiento_realizado: true,
        x_studio_fecha_seguimiento: fecha,
        x_studio_notas_seguimiento: notas.trim(),
      });
      if (resp.ok) onGuardado();
      else setError(resp.error || "No se pudo guardar.");
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal", onClick: e => e.stopPropagation() },
      h("h3", null, "📞 Registrar Seguimiento"),
      h("div", { className: "sub" }, cierre.x_name + " — " + (Array.isArray(cierre.x_studio_orden_id) ? cierre.x_studio_orden_id[1] : "")),
      h("div", { className: "campo" },
        h("label", null, "Fecha del contacto"),
        h("input", { type: "date", value: fecha, onChange: e => setFecha(e.target.value) })
      ),
      h("div", { className: "campo", style: { marginBottom: "0" } },
        h("label", null, "Notas — cómo funcionó el equipo, quejas, satisfacción"),
        h("textarea", { value: notas, autoFocus: true, onChange: e => setNotas(e.target.value) })
      ),
      error && h("div", { className: "mensaje-error" }, error),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar, disabled: guardando }, "Cancelar"),
        h("button", { className: "btn-primario", onClick: guardar, disabled: guardando }, guardando ? "Guardando..." : "Marcar como contactado")
      )
    )
  );
}

function Seguimiento(){
  const [sesion, setSesion] = useState(null);
  const [cierres, setCierres] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [errorCarga, setErrorCarga] = useState("");
  const [pestana, setPestana] = useState("pendientes");
  const [cierreEditando, setCierreEditando] = useState(null);

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargar(); }
  }, []);

  async function cargar(){
    setCargando(true); setErrorCarga("");
    try {
      const filas = await tallerQuery("x_taller_cierre", [
        "id","x_name","x_studio_orden_id","x_studio_total_costo_real","x_studio_fecha_cierre",
        "x_studio_seguimiento_realizado","x_studio_fecha_seguimiento","x_studio_notas_seguimiento",
      ], [], 2000);
      setCierres(filas);
    } catch(e) {
      setErrorCarga("No se pudo cargar: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  if (!sesion) return null;

  const pendientes = (cierres || []).filter(c => !c.x_studio_seguimiento_realizado)
    .map(c => ({ ...c, _dias: diasDesde(c.x_studio_fecha_cierre) }))
    .sort((a,b) => (b._dias||0) - (a._dias||0));
  const realizados = (cierres || []).filter(c => c.x_studio_seguimiento_realizado);

  const columnasPendientes = [
    { clave: "x_name", titulo: "Cierre" },
    { clave: "x_studio_orden_id", titulo: "Orden" },
    { clave: "x_studio_total_costo_real", titulo: "Total", formatear: v => "$" + Number(v||0).toFixed(2) },
    { clave: "x_studio_fecha_cierre", titulo: "Fecha de cierre", formatear: formatearFecha },
    { clave: "_dias", titulo: "Días transcurridos", formatear: d => (d === null ? "—" : d + " días") },
  ];
  const columnasRealizados = [
    { clave: "x_name", titulo: "Cierre" },
    { clave: "x_studio_orden_id", titulo: "Orden" },
    { clave: "x_studio_fecha_seguimiento", titulo: "Fecha de contacto", formatear: formatearFecha },
    { clave: "x_studio_notas_seguimiento", titulo: "Notas" },
  ];

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "📞 Seguimiento Post-entrega"),
      h("button", { className: "btn-refrescar", onClick: cargar }, "↻ Refrescar")
    ),
    h("div", { className: "pestanas" },
      h("button", { className: "pestana" + (pestana === "pendientes" ? " activa" : ""), onClick: () => setPestana("pendientes") },
        "Pendientes (" + pendientes.length + ")"),
      h("button", { className: "pestana" + (pestana === "realizados" ? " activa" : ""), onClick: () => setPestana("realizados") },
        "Ya contactados (" + realizados.length + ")")
    ),
    h("div", { className: "panel" },
      cargando
        ? h("div", { className: "cargando" }, "Cargando...")
        : errorCarga
          ? h("div", { className: "error-carga" }, errorCarga)
          : pestana === "pendientes"
            ? (pendientes.length === 0
                ? h("div", { className: "error-carga" }, "No hay seguimientos pendientes. 🎉")
                : TablaInfoAgro(h, { columnas: columnasPendientes, filas: pendientes, onFilaClick: setCierreEditando }))
            : (realizados.length === 0
                ? h("div", { className: "error-carga" }, "Todavía no se ha registrado ningún seguimiento.")
                : TablaInfoAgro(h, { columnas: columnasRealizados, filas: realizados }))
    ),
    cierreEditando && h(ModalSeguimiento, {
      cierre: cierreEditando,
      onCerrar: () => setCierreEditando(null),
      onGuardado: () => { setCierreEditando(null); cargar(); },
    })
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Seguimiento));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotaller — Bahías</title>
<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>
<script src="core.js?v=8"></script>
<link rel="stylesheet" href="core.css?v=2">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626; --color-peligro-suave:#FEE2E2;
    --color-alerta:#D97706; --color-alerta-suave:#FEF3C7;
    --radio:10px; --sombra:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--color-fondo); color:var(--color-texto); font-size:13.5px;
  }
  .barra-superior{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .barra-superior h1{font-size:15px; margin:0;}
  .barra-botones{display:flex; gap:8px;}
  .btn-refrescar{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .btn-refrescar:hover{border-color:var(--color-primario); color:var(--color-primario-oscuro);}
  .btn-primario{background:var(--color-primario); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-primario:hover:not(:disabled){background:var(--color-primario-oscuro);}
  .btn-primario:disabled{opacity:.6; cursor:default;}
  .btn-secundario{background:#fff; border:1px solid var(--color-borde); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; color:var(--color-texto);}
  .btn-peligro{background:#fff; border:1px solid var(--color-peligro); color:var(--color-peligro); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer;}
  .btn-peligro:hover{background:var(--color-peligro-suave);}

  /* ---- Tarjetas de tablero ---- */
  .tablero{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; margin-bottom:18px;}
  .tarjeta-bahia{
    background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio);
    box-shadow:var(--sombra); padding:14px; cursor:pointer; transition:border-color .12s;
  }
  .tarjeta-bahia:hover{border-color:var(--color-primario);}
  .tarjeta-bahia .nombre{font-weight:700; font-size:14px; margin-bottom:2px;}
  .tarjeta-bahia .responsable{font-size:11.5px; color:var(--color-texto-suave); margin-bottom:10px;}
  .barra-ocupacion{height:8px; border-radius:4px; background:#F1F5F9; overflow:hidden; margin-bottom:6px;}
  .barra-ocupacion .relleno{height:100%; border-radius:4px;}
  .ocupacion-texto{font-size:12px; font-weight:600; display:flex; justify-content:space-between;}
  .nivel-ok .relleno{background:#16A34A;}
  .nivel-ok .ocupacion-texto{color:#15803D;}
  .nivel-lleno .relleno{background:#D97706;}
  .nivel-lleno .ocupacion-texto{color:#B45309;}
  .nivel-sobre .relleno{background:#DC2626;}
  .nivel-sobre .ocupacion-texto{color:#991B1B;}
  .tag-modo{font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--color-texto-suave); margin-top:8px;}

  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px;}
  .cargando, .error-carga{text-align:center; padding:40px; color:var(--color-texto-suave);}

  /* ---- Modal ---- */
  .modal-fondo{position:fixed; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .modal{background:#fff; border-radius:12px; padding:22px; width:100%; max-width:440px; box-shadow:0 20px 40px rgba(17,24,39,.25);}
  .modal h3{margin:0 0 14px; font-size:15px;}
  .campo{margin-bottom:14px;}
  label{display:block; font-size:11.5px; color:var(--color-texto-suave); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
  input, select, textarea{width:100%; border:1px solid var(--color-borde); border-radius:7px; padding:8px 10px; font-size:13.5px; background:#fff; color:var(--color-texto); font-family:inherit;}
  textarea{resize:vertical; min-height:60px;}
  .fila{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .modal-botones{display:flex; gap:8px; justify-content:space-between; margin-top:18px;}
  .modal-botones-derecha{display:flex; gap:8px;}
  .mensaje-error{background:var(--color-peligro-suave); border-left:3px solid var(--color-peligro); color:#991B1B; font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}
</style>
</head>
<body>
<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">bahias.html — v3 (carga secuencial)</div>

<script>
const h = React.createElement;
const { useState, useEffect } = React;

const ESTADOS_QUE_OCUPAN_BAHIA = ["Recibida","En diagnóstico","Pendiente de presupuesto","Presupuestada",
  "Pendiente de aprobación","Aprobada","En reparación","Pendiente de repuesto"];

function nivelOcupacion(ocupados, capacidad){
  if (capacidad <= 0) return "nivel-ok";
  const pct = ocupados / capacidad;
  if (pct > 1) return "nivel-sobre";
  if (pct === 1) return "nivel-lleno";
  return "nivel-ok";
}

/* ------------------------------------------------------------
   Modal crear/editar bahía
   ------------------------------------------------------------ */
function ModalBahia({ bahia, usuarios, onCerrar, onGuardado, onDesactivada }){
  const esEdicion = !!bahia;
  const [nombre, setNombre] = useState(bahia ? bahia.x_name : "");
  const [responsableId, setResponsableId] = useState(bahia && Array.isArray(bahia.x_studio_responsable_id) ? bahia.x_studio_responsable_id[0] : "");
  const [capacidad, setCapacidad] = useState(bahia ? bahia.x_studio_capacidad : 1);
  const [modoLimite, setModoLimite] = useState(bahia ? bahia.x_studio_modo_limite : "Solo advertir");
  const [ubicacion, setUbicacion] = useState(bahia ? bahia.x_studio_ubicacion || "" : "");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");

  async function guardar(){
    if (!nombre.trim()){ setError("El nombre es obligatorio."); return; }
    if (!capacidad || capacidad < 1){ setError("La capacidad debe ser al menos 1."); return; }
    setGuardando(true); setError("");
    const valores = {
      x_name: nombre.trim(),
      x_studio_responsable_id: responsableId || false,
      x_studio_capacidad: Number(capacidad),
      x_studio_modo_limite: modoLimite,
      x_studio_ubicacion: ubicacion || false,
    };
    try {
      const resp = esEdicion
        ? await tallerActualizar("x_taller_bahia", bahia.id, valores)
        : await tallerCrear("x_taller_bahia", valores);
      if (resp.ok) {
        onGuardado();
      } else {
        setError(resp.error || "No se pudo guardar.");
      }
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  async function desactivar(){
    if (!confirm(`¿Desactivar la bahía "${bahia.x_name}"? No se borra, solo deja de estar disponible.`)) return;
    setGuardando(true); setError("");
    try {
      const resp = await tallerDesactivar("x_taller_bahia", bahia.id, "Desactivada desde el panel");
      if (resp.ok) onDesactivada();
      else setError(resp.error || "No se pudo desactivar.");
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal", onClick: e => e.stopPropagation() },
      h("h3", null, esEdicion ? "🅿️ Editar Bahía" : "🅿️ Nueva Bahía"),

      h("div", { className: "campo" },
        h("label", null, "Nombre / Código"),
        h("input", { type: "text", value: nombre, autoFocus: true, onChange: e => setNombre(e.target.value) })
      ),
      h("div", { className: "fila" },
        h("div", { className: "campo" },
          h("label", null, "Responsable"),
          h("select", { value: responsableId, onChange: e => setResponsableId(e.target.value) },
            h("option", { value: "" }, "— Sin asignar —"),
            (usuarios || []).map(u => h("option", { key: u.id, value: u.id }, u.x_name))
          )
        ),
        h("div", { className: "campo" },
          h("label", null, "Capacidad (equipos)"),
          h("input", { type: "number", min: 1, value: capacidad, onChange: e => setCapacidad(e.target.value) })
        )
      ),
      h("div", { className: "campo" },
        h("label", null, "Modo al llegar al límite"),
        h("select", { value: modoLimite, onChange: e => setModoLimite(e.target.value) },
          h("option", { value: "Solo advertir" }, "Solo advertir"),
          h("option", { value: "Bloquear al llegar al límite" }, "Bloquear al llegar al límite")
        )
      ),
      h("div", { className: "campo", style: { marginBottom: "0" } },
        h("label", null, "Ubicación (opcional)"),
        h("input", { type: "text", value: ubicacion, onChange: e => setUbicacion(e.target.value) })
      ),

      error && h("div", { className: "mensaje-error" }, error),

      h("div", { className: "modal-botones" },
        esEdicion
          ? h("button", { className: "btn-peligro", onClick: desactivar, disabled: guardando }, "Desactivar")
          : h("span"),
        h("div", { className: "modal-botones-derecha" },
          h("button", { className: "btn-secundario", onClick: onCerrar, disabled: guardando }, "Cancelar"),
          h("button", { className: "btn-primario", onClick: guardar, disabled: guardando }, guardando ? "Guardando..." : "Guardar")
        )
      )
    )
  );
}

/* ------------------------------------------------------------
   Pantalla principal
   ------------------------------------------------------------ */
/* ------------------------------------------------------------
   Detalle de una bahía — lista los equipos que están ahí ahora
   ------------------------------------------------------------ */
function DetalleBahia({ bahia, onVolver, onConfigurar }){
  const [ordenes, setOrdenes] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    tallerQuery("x_taller_orden", [
      "id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_estado",
      "x_studio_tecnico_responsable_id","x_studio_fecha_recepcion",
    ], [["x_studio_bahia_id","=",bahia.id],["x_studio_estado","in",ESTADOS_QUE_OCUPAN_BAHIA]], 500)
      .then(setOrdenes)
      .catch(e => setError("No se pudieron cargar las órdenes: " + e.message));
  }, [bahia.id]);

  const columnas = [
    { clave: "x_name", titulo: "Folio" },
    { clave: "x_studio_cliente_id", titulo: "Cliente" },
    { clave: "x_studio_equipo_id", titulo: "Equipo" },
    { clave: "x_studio_estado", titulo: "Estado" },
    { clave: "x_studio_tecnico_responsable_id", titulo: "Técnico" },
    { clave: "x_studio_fecha_recepcion", titulo: "Recepción", formatear: formatearFecha },
  ];

  return h("div", null,
    h("button", { className: "link-volver", onClick: onVolver, style: { background:"none", border:"none", color:"var(--color-primario-oscuro)", fontSize:"13px", cursor:"pointer", padding:"0", textDecoration:"underline", marginBottom:"10px", display:"block" } }, "← Volver a Bahías"),
    h("div", { className: "barra-superior" },
      h("h1", null, "🅿️ " + bahia.x_name),
      h("button", { className: "btn-primario", onClick: onConfigurar }, "⚙️ Configurar")
    ),
    h("div", { className: "panel" },
      h("div", { style: { fontSize:"12px", color:"var(--color-texto-suave)", marginBottom:"12px" } },
        "Responsable: " + (Array.isArray(bahia.x_studio_responsable_id) ? bahia.x_studio_responsable_id[1] : "sin asignar") +
        " · Capacidad: " + bahia.x_studio_capacidad + " · " + bahia.x_studio_modo_limite
      ),
      error
        ? h("div", { className: "error-carga" }, error)
        : !ordenes
          ? h("div", { className: "cargando" }, "Cargando...")
          : ordenes.length === 0
            ? h("div", { className: "error-carga" }, "No hay equipos en esta bahía ahora mismo.")
            : TablaInfoAgro(h, { columnas, filas: ordenes })
    )
  );
}

function Bahias(){
  const [sesion, setSesion] = useState(null);
  const [bahias, setBahias] = useState(null);
  const [usuarios, setUsuarios] = useState([]);
  const [ocupacionPorBahia, setOcupacionPorBahia] = useState({});
  const [cargando, setCargando] = useState(true);
  const [errorCarga, setErrorCarga] = useState("");
  const [modalAbierto, setModalAbierto] = useState(false);
  const [bahiaEditando, setBahiaEditando] = useState(null);
  const [bahiaViendoDetalle, setBahiaViendoDetalle] = useState(null);

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargarTodo(); }
  }, []);

  async function cargarTodo(){
    setCargando(true); setErrorCarga("");
    try {
      const filasBahias = await tallerQuery("x_taller_bahia", ["id","x_name","x_studio_responsable_id","x_studio_capacidad","x_studio_modo_limite","x_studio_ubicacion"], [], 500);
      const filasUsuarios = await tallerQuery("x_taller_usuario", ["id","x_name"], [], 500);
      const filasOrdenes = await tallerQuery("x_taller_orden", ["id","x_studio_bahia_id","x_studio_estado"], [["x_studio_bahia_id","!=",false]], 2000);
      const ocupacion = {};
      filasOrdenes.forEach(o => {
        if (!ESTADOS_QUE_OCUPAN_BAHIA.includes(o.x_studio_estado)) return;
        const bId = Array.isArray(o.x_studio_bahia_id) ? o.x_studio_bahia_id[0] : o.x_studio_bahia_id;
        ocupacion[bId] = (ocupacion[bId] || 0) + 1;
      });
      setBahias(filasBahias);
      setUsuarios(filasUsuarios);
      setOcupacionPorBahia(ocupacion);
      // si estamos viendo el detalle de una bahía, refrescamos también su copia local
      setBahiaViendoDetalle(prev => prev ? filasBahias.find(b => b.id === prev.id) || prev : prev);
    } catch(e) {
      setErrorCarga("No se pudieron cargar las bahías: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  if (!sesion) return null;

  function abrirNueva(){ setBahiaEditando(null); setModalAbierto(true); }
  function abrirEditar(b){ setBahiaEditando(b); setModalAbierto(true); }
  function cerrarModal(){ setModalAbierto(false); setBahiaEditando(null); }
  function alGuardar(){ cerrarModal(); cargarTodo(); }

  if (bahiaViendoDetalle) {
    return h(React.Fragment, null,
      h(DetalleBahia, {
        bahia: bahiaViendoDetalle,
        onVolver: () => setBahiaViendoDetalle(null),
        onConfigurar: () => abrirEditar(bahiaViendoDetalle),
      }),
      modalAbierto && h(ModalBahia, {
        bahia: bahiaEditando, usuarios,
        onCerrar: cerrarModal,
        onGuardado: () => { cerrarModal(); cargarTodo(); },
        onDesactivada: () => { cerrarModal(); setBahiaViendoDetalle(null); cargarTodo(); },
      })
    );
  }

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "🅿️ Bahías"),
      h("div", { className: "barra-botones" },
        h("button", { className: "btn-refrescar", onClick: cargarTodo }, "↻ Refrescar"),
        h("button", { className: "btn-primario", onClick: abrirNueva }, "+ Nueva Bahía")
      )
    ),

    cargando
      ? h("div", { className: "panel cargando" }, "Cargando bahías...")
      : errorCarga
        ? h("div", { className: "panel error-carga" }, errorCarga)
        : bahias.length === 0
          ? h("div", { className: "panel error-carga" }, "Todavía no hay bahías configuradas. Creá la primera con \"+ Nueva Bahía\".")
          : h("div", { className: "tablero" },
              bahias.map(b => {
                const ocupados = ocupacionPorBahia[b.id] || 0;
                const nivel = nivelOcupacion(ocupados, b.x_studio_capacidad);
                const pctAncho = Math.min(100, (ocupados / (b.x_studio_capacidad || 1)) * 100);
                return h("div", { key: b.id, className: "tarjeta-bahia " + nivel, onClick: () => setBahiaViendoDetalle(b), style: { position: "relative" } },
                  h("button", {
                    onClick: e => { e.stopPropagation(); abrirEditar(b); },
                    title: "Configurar",
                    style: { position:"absolute", top:"10px", right:"10px", background:"#fff", border:"1px solid var(--color-borde)", borderRadius:"6px", width:"26px", height:"26px", cursor:"pointer", fontSize:"13px" },
                  }, "⚙️"),
                  h("div", { className: "nombre" }, b.x_name),
                  h("div", { className: "responsable" },
                    "Responsable: " + (Array.isArray(b.x_studio_responsable_id) ? b.x_studio_responsable_id[1] : "sin asignar")
                  ),
                  h("div", { className: "barra-ocupacion" }, h("div", { className: "relleno", style: { width: pctAncho + "%" } })),
                  h("div", { className: "ocupacion-texto" },
                    h("span", null, ocupados + " / " + b.x_studio_capacidad + " ocupados"),
                    nivel === "nivel-sobre" && h("span", null, "⚠️ sobrepasada"),
                    nivel === "nivel-lleno" && h("span", null, "🔴 llena")
                  ),
                  h("div", { className: "tag-modo" }, b.x_studio_modo_limite)
                );
              })
            ),

    modalAbierto && h(ModalBahia, {
      bahia: bahiaEditando,
      usuarios,
      onCerrar: cerrarModal,
      onGuardado: alGuardar,
      onDesactivada: alGuardar,
    })
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Bahias));
</script>
</body>
</html>

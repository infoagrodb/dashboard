<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>

<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626; --color-peligro-suave:#FEE2E2;
    --radio:10px; --sombra:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--color-fondo); color:var(--color-texto); font-size:13.5px;}
  .barra-superior{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .barra-superior h1{font-size:15px; margin:0;}
  .barra-botones{display:flex; gap:8px;}
  .btn-refrescar{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .btn-refrescar:hover{border-color:var(--color-primario); color:var(--color-primario-oscuro);}
  .btn-primario{background:var(--color-primario); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-primario:hover:not(:disabled){background:var(--color-primario-oscuro);}
  .btn-primario:disabled{opacity:.6; cursor:default;}
  .btn-secundario{background:#fff; border:1px solid var(--color-borde); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; color:var(--color-texto);}
  .btn-peligro{background:#fff; border:1px solid var(--color-peligro); color:var(--color-peligro); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer;}
  .btn-peligro:hover{background:var(--color-peligro-suave);}
  .btn-chico{background:#fff; border:1px solid var(--color-borde); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--color-texto);}
  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px; margin-bottom:14px;}
  .cargando, .error-carga, .acceso-denegado{text-align:center; padding:40px; color:var(--color-texto-suave);}
  .pestanas{display:flex; gap:6px; margin-bottom:14px;}
  .pestana{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 14px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .pestana.activa{background:var(--color-primario); border-color:var(--color-primario); color:#fff; font-weight:600;}

  .buscador{position:relative;}
  .buscador-resultados{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--color-borde); border-radius:7px; box-shadow:var(--sombra); max-height:200px; overflow-y:auto; z-index:50; margin-top:4px;}
  .buscador-item{padding:8px 10px; cursor:pointer; border-bottom:1px solid var(--color-fondo); font-size:13px;}
  .buscador-item:hover{background:var(--color-acento-suave);}
  .buscador-item .sub{font-size:11px; color:var(--color-texto-suave);}
  .buscador-vacio{padding:10px; font-size:12.5px; color:var(--color-texto-suave); text-align:center;}
  .seleccionado{display:flex; align-items:center; justify-content:space-between; background:var(--color-acento-suave); border:1px solid #A7F3D0; border-radius:7px; padding:9px 12px; font-size:13px;}

  .modal-fondo{position:fixed; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .modal{background:#fff; border-radius:12px; padding:22px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; box-shadow:0 20px 40px rgba(17,24,39,.25);}

  .badge-estado{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px;}

<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">solicitud.html — v4 (equipo de la lista + fecha + compartir)</div>

<script>
const h = React.createElement;
const { useState, useEffect, useRef } = React;

const ROLES_CON_PRIVILEGIO = ["Recepción","Supervisor","Administrador"];

function Buscador({ placeholder, buscar, renderItem, onSeleccionar }){
  const [texto, setTexto] = useState("");
  const [resultados, setResultados] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const timerRef = useRef(null);

  function cambiar(valor){
    setTexto(valor);
    if (timerRef.current) clearTimeout(timerRef.current);
    if (!valor.trim()){ setResultados(null); return; }
    timerRef.current = setTimeout(async () => {
      setBuscando(true);
      try { setResultados(await buscar(valor.trim())); }
      catch(e) { setResultados([]); }
      finally { setBuscando(false); }
    }, 300);
  }

  return h("div", { className: "buscador" },
    h("input", { type: "text", placeholder, value: texto, onChange: e => cambiar(e.target.value) }),
    resultados !== null && h("div", { className: "buscador-resultados" },
      buscando ? h("div", { className: "buscador-vacio" }, "Buscando...") :
      resultados.length === 0 ? h("div", { className: "buscador-vacio" }, "Sin resultados") :
      resultados.map(item => h("div", {
          key: item.id, className: "buscador-item",
          onClick: () => { onSeleccionar(item); setTexto(""); setResultados(null); },
        }, renderItem(item))
      )
    )
  );
}

function ModalNuevoCliente({ onCerrar, onCreado }){
  const [nombre, setNombre] = useState("");
  const [telefono, setTelefono] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");

  async function guardar(){
    if (!nombre.trim()){ setError("El nombre es obligatorio."); return; }
    setGuardando(true); setError("");
    try {
      const resp = await tallerCrear("x_taller_cliente", {
        x_name: nombre.trim(), x_studio_tipo_cliente: "Externo", x_studio_telefono: telefono || false,
      });
      if (resp.ok) onCreado({ id: resp.id, x_name: nombre.trim(), x_studio_tipo_cliente: "Externo" });
      else setError(resp.error || "No se pudo crear.");
    } catch(e) { setError("Error: " + e.message); }
    finally { setGuardando(false); }
  }

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal", onClick: e => e.stopPropagation() },
      h("h3", null, "🧑‍🤝‍🧑 Nuevo Cliente"),
      h("div", { className: "campo" },
        h("label", null, "Nombre"),
        h("input", { type: "text", value: nombre, autoFocus: true, onChange: e => setNombre(e.target.value) })
      ),
      h("div", { className: "campo", style: { marginBottom: "0" } },
        h("label", null, "Teléfono"),
        h("input", { type: "text", value: telefono, onChange: e => setTelefono(e.target.value) })
      ),
      error && h("div", { className: "mensaje-error" }, error),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar, disabled: guardando }, "Cancelar"),
        h("button", { className: "btn-primario", onClick: guardar, disabled: guardando }, guardando ? "Guardando..." : "Crear cliente")
      )
    )
  );
}

function ModalNuevaSolicitud({ onCerrar, onCreada }){
  const [cliente, setCliente] = useState(null);
  const [modalCliente, setModalCliente] = useState(false);
  const [equiposDelCliente, setEquiposDelCliente] = useState(null);
  const [cargandoEquipos, setCargandoEquipos] = useState(false);
  const [equipoId, setEquipoId] = useState(""); // "" = nada, "OTRO" = no está en la lista
  const [descripcionEquipo, setDescripcionEquipo] = useState("");
  const [problema, setProblema] = useState("");
  const [prioridad, setPrioridad] = useState("Normal");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    if (!cliente) { setEquiposDelCliente(null); return; }
    setCargandoEquipos(true);
    tallerQuery("x_equiposagricolas", ["id","x_name","x_studio_marca","x_studio_modelo"], [["x_studio_cliente_id","=",cliente.id]], 500)
      .then(setEquiposDelCliente)
      .catch(() => setEquiposDelCliente([]))
      .finally(() => setCargandoEquipos(false));
  }, [cliente?.id]);

  async function buscarClientes(texto){
    return tallerQuery("x_taller_cliente", ["id","x_name","x_studio_tipo_cliente","x_studio_telefono"], [["x_name","ilike",texto]], 15);
  }

  async function guardar(){
    if (!cliente){ setError("Elegí o creá el cliente."); return; }
    if (!equipoId){ setError("Elegí el equipo de la lista, o \"No está en la lista\" para describirlo."); return; }
    if (equipoId === "OTRO" && !descripcionEquipo.trim()){ setError("Describí el equipo (aunque sea por marca/tipo)."); return; }
    if (!problema.trim()){ setError("Describí el problema reportado."); return; }
    setGuardando(true); setError("");
    try {
      const folio = await tallerFolio("SOL");
      const equipoElegido = equipoId !== "OTRO" ? equiposDelCliente.find(e => String(e.id) === equipoId) : null;
      const resp = await tallerCrear("x_taller_solicitud", {
        x_name: folio,
        x_studio_cliente_id: cliente.id,
        x_studio_equipo_id: equipoElegido ? equipoElegido.id : false,
        x_studio_descripcion_equipo: equipoElegido ? equipoElegido.x_name : descripcionEquipo.trim(),
        x_studio_problema_reportado: problema.trim(),
        x_studio_prioridad: prioridad,
        x_studio_estado: "Pendiente",
      });
      if (resp.ok) onCreada();
      else setError(resp.error || "No se pudo registrar la solicitud.");
    } catch(e) { setError("Error: " + e.message); }
    finally { setGuardando(false); }
  }

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal", onClick: e => e.stopPropagation() },
      h("h3", null, "📞 Nueva Solicitud de Servicio"),
      h("div", { className: "campo" },
        h("label", null, "Cliente"),
        cliente
          ? h("div", { className: "seleccionado" },
              h("div", null, h("strong", null, cliente.x_name)),
              h("button", { className: "btn-chico", onClick: () => { setCliente(null); setEquipoId(""); } }, "Cambiar")
            )
          : h(React.Fragment, null,
              h(Buscador, { placeholder: "Buscar cliente...", buscar: buscarClientes, onSeleccionar: setCliente,
                renderItem: c => h(React.Fragment, null, c.x_name, h("div", { className: "sub" }, c.x_studio_tipo_cliente)) }),
              h("button", { className: "btn-chico", style: { marginTop: "6px" }, onClick: () => setModalCliente(true) }, "+ Cliente nuevo")
            )
      ),
      h("div", { className: "campo" },
        h("label", null, "Equipo"),
        !cliente
          ? h("div", { style: { fontSize: "12.5px", color: "var(--color-texto-suave)" } }, "Elegí primero un cliente.")
          : cargandoEquipos
            ? h("div", { style: { fontSize: "12.5px", color: "var(--color-texto-suave)" } }, "Cargando equipos...")
            : h(React.Fragment, null,
                h("select", { value: equipoId, onChange: e => setEquipoId(e.target.value) },
                  h("option", { value: "", disabled: true }, "— Elegí un equipo —"),
                  (equiposDelCliente || []).map(eq => h("option", { key: eq.id, value: eq.id },
                    eq.x_name + ([eq.x_studio_marca, eq.x_studio_modelo].filter(Boolean).length ? " (" + [eq.x_studio_marca, eq.x_studio_modelo].filter(Boolean).join(" ") + ")" : "")
                  )),
                  h("option", { value: "OTRO" }, "No está en la lista (equipo nuevo)")
                ),
                equipoId === "OTRO" && h("input", {
                  type: "text", value: descripcionEquipo, onChange: e => setDescripcionEquipo(e.target.value),
                  placeholder: "Ej: Tractor Case, Camión Ford...", style: { marginTop: "8px" },
                })
              )
      ),
      h("div", { className: "campo" },
        h("label", null, "Prioridad"),
        h("select", { value: prioridad, onChange: e => setPrioridad(e.target.value) },
          INFOTALLER_PRIORIDADES.map(p => h("option", { key: p, value: p }, p))
        )
      ),
      h("div", { className: "campo", style: { marginBottom: "0" } },
        h("label", null, "Problema reportado"),
        h("textarea", { value: problema, onChange: e => setProblema(e.target.value) })
      ),
      error && h("div", { className: "mensaje-error" }, error),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar, disabled: guardando }, "Cancelar"),
        h("button", { className: "btn-primario", onClick: guardar, disabled: guardando }, guardando ? "Guardando..." : "Registrar solicitud")
      ),
      modalCliente && h(ModalNuevoCliente, { onCerrar: () => setModalCliente(false), onCreado: c => { setCliente(c); setModalCliente(false); } })
    )
  );
}

function ModalAnular({ solicitud, onCerrar, onAnulada }){
  const [motivo, setMotivo] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");

  async function anular(){
    if (!motivo.trim()){ setError("Escribí el motivo de la anulación."); return; }
    setGuardando(true); setError("");
    try {
      const resp = await tallerActualizar("x_taller_solicitud", solicitud.id, {
        x_studio_estado: "Anulada",
        x_studio_motivo_anulacion: motivo.trim(),
      });
      if (resp.ok) onAnulada();
      else setError(resp.error || "No se pudo anular.");
    } catch(e) { setError("Error: " + e.message); }
    finally { setGuardando(false); }
  }

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal", onClick: e => e.stopPropagation() },
      h("h3", null, "🗑️ Anular Solicitud"),
      h("div", { className: "campo", style: { marginBottom: "0" } },
        h("label", null, "Motivo"),
        h("textarea", { value: motivo, autoFocus: true, onChange: e => setMotivo(e.target.value), placeholder: "El cliente ya no la necesita, se resolvió por su cuenta..." })
      ),
      error && h("div", { className: "mensaje-error" }, error),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar, disabled: guardando }, "Volver"),
        h("button", { className: "btn-peligro", onClick: anular, disabled: guardando }, guardando ? "Guardando..." : "Confirmar anulación")
      )
    )
  );
}

function DetalleSolicitud({ solicitud, onVolver }){
  const [modalAnular, setModalAnular] = useState(false);

  function m2oTexto(v){ return Array.isArray(v) ? v[1] : (v || "—"); }

  function convertir(){
    window.parent.postMessage({ tipo: "navegar", pestana: "recepcion", sufijo: "?desde_solicitud=" + solicitud.id }, "*");
  }

  async function compartirConCliente(){
    const clienteNombre = m2oTexto(solicitud.x_studio_cliente_id);
    const texto = "Hola" + (clienteNombre !== "—" ? " " + clienteNombre : "") + ", te confirmamos tu solicitud de servicio.\n\n" +
      "N.º de solicitud: " + solicitud.x_name + "\n" +
      "Equipo: " + solicitud.x_studio_descripcion_equipo + "\n" +
      "Problema reportado: " + solicitud.x_studio_problema_reportado + "\n" +
      "Fecha: " + formatearFechaHora(solicitud.create_date) + "\n\n" +
      "El taller te contacta para coordinar la recepción del equipo. — Infotaller, COMASA";
    if (navigator.share) {
      try { await navigator.share({ title: "Solicitud " + solicitud.x_name, text: texto }); }
      catch(e) { /* si cancela el share, no es un error real */ }
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(texto);
      alert("Copiado al portapapeles — pegalo donde quieras enviarlo.");
    }
  }

  return h("div", null,
    h("button", { className: "btn-secundario", onClick: onVolver, style: { marginBottom: "10px" } }, "← Volver"),
    h("div", { className: "modal-detalle" },
      h("div", { style: { display:"flex", justifyContent:"space-between", alignItems:"flex-start" } },
        h("h3", null, solicitud.x_name),
        h("span", { className: "badge-estado estado-" + solicitud.x_studio_estado }, solicitud.x_studio_estado)
      ),
      h("div", { style: { fontSize: "12px", color: "var(--color-texto-suave)", marginBottom: "12px" } },
        m2oTexto(solicitud.x_studio_cliente_id)
      ),
      h("div", { className: "campo" },
        h("label", null, "Fecha de la solicitud"),
        h("div", { style: { fontSize: "13px" } }, formatearFechaHora(solicitud.create_date))
      ),
      h("div", { className: "campo" },
        h("label", null, "Equipo"),
        h("div", { style: { fontSize: "13px" } }, solicitud.x_studio_descripcion_equipo)
      ),
      h("div", { className: "campo" },
        h("label", null, "Problema reportado"),
        h("div", { style: { whiteSpace: "pre-wrap", fontSize: "13px" } }, solicitud.x_studio_problema_reportado)
      ),
      solicitud.x_studio_estado === "Anulada" && h("div", { className: "campo" },
        h("label", null, "Motivo de anulación"),
        h("div", { style: { fontSize: "13px" } }, solicitud.x_studio_motivo_anulacion)
      ),
      h("button", { className: "btn-secundario", onClick: compartirConCliente, style: { width: "100%", marginTop: "6px" } },
        "🔗 Enviar datos al cliente"),
      solicitud.x_studio_estado === "Pendiente" && h(React.Fragment, null,
        h("button", { className: "btn-primario", onClick: convertir, style: { width: "100%", marginTop: "8px" } },
          "🚜 El equipo llegó — Continuar a Recepción"),
        h("button", { className: "btn-peligro", onClick: () => setModalAnular(true), style: { width: "100%", marginTop: "8px" } },
          "🗑️ Anular solicitud")
      ),
      modalAnular && h(ModalAnular, { solicitud, onCerrar: () => setModalAnular(false), onAnulada: onVolver })
    )
  );
}

function SolicitudDeServicio(){
  const [sesion, setSesion] = useState(null);
  const [solicitudes, setSolicitudes] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [errorCarga, setErrorCarga] = useState("");
  const [modalNueva, setModalNueva] = useState(false);
  const [solicitudAbierta, setSolicitudAbierta] = useState(null);
  const [pestana, setPestana] = useState("pendientes");

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargar(); }
  }, []);

  async function cargar(){
    setCargando(true); setErrorCarga("");
    try {
      const filas = await tallerQuery("x_taller_solicitud", [
        "id","x_name","x_studio_cliente_id","x_studio_descripcion_equipo","x_studio_problema_reportado",
        "x_studio_prioridad","x_studio_estado","x_studio_motivo_anulacion","x_studio_orden_generada_id","create_date",
      ], [], 1000);

      // Para las convertidas, se trae el equipo real que quedó asignado en la orden
      // generada (la solicitud solo tenía una descripción libre, no el equipo formal).
      const idsOrdenesGeneradas = [...new Set(
        filas.filter(f => Array.isArray(f.x_studio_orden_generada_id)).map(f => f.x_studio_orden_generada_id[0])
      )];
      let equipoPorOrden = {};
      if (idsOrdenesGeneradas.length) {
        const ordenesRows = await tallerQuery("x_taller_orden", ["id","x_studio_equipo_id"], [["id","in",idsOrdenesGeneradas]], idsOrdenesGeneradas.length);
        ordenesRows.forEach(o => { equipoPorOrden[o.id] = o.x_studio_equipo_id; });
      }
      const filasConEquipo = filas.map(f => ({
        ...f,
        _equipoDerivado: Array.isArray(f.x_studio_orden_generada_id) ? (equipoPorOrden[f.x_studio_orden_generada_id[0]] || false) : false,
      }));

      setSolicitudes(filasConEquipo);
    } catch(e) {
      setErrorCarga("No se pudieron cargar las solicitudes: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  if (!sesion) return null;

  if (!ROLES_CON_PRIVILEGIO.includes(sesion.rol)) {
    return h("div", { className: "panel acceso-denegado" }, "🔒 Tu rol no tiene privilegio para gestionar solicitudes de servicio.");
  }

  if (solicitudAbierta) {
    return h(DetalleSolicitud, { solicitud: solicitudAbierta, onVolver: () => { setSolicitudAbierta(null); cargar(); } });
  }

  const pendientes = (solicitudes || []).filter(s => s.x_studio_estado === "Pendiente");
  const otras = (solicitudes || []).filter(s => s.x_studio_estado !== "Pendiente");

  const columnas = [
    { clave: "x_name", titulo: "Folio" },
    { clave: "x_studio_cliente_id", titulo: "Cliente" },
    { clave: "x_studio_descripcion_equipo", titulo: "Equipo" },
    { clave: "x_studio_prioridad", titulo: "Prioridad" },
    { clave: "create_date", titulo: "Fecha", formatear: formatearFechaHora },
  ];
  const columnasOtras = [
    ...columnas,
    { clave: "x_studio_estado", titulo: "Estado" },
    { clave: "x_studio_orden_generada_id", titulo: "Orden Generada" },
    { clave: "_equipoDerivado", titulo: "Equipo Derivado" },
  ];

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "📞 Solicitud de Servicio"),
      h("div", { className: "barra-botones" },
        h("button", { className: "btn-refrescar", onClick: cargar }, "↻ Refrescar"),
        h("button", { className: "btn-primario", onClick: () => setModalNueva(true) }, "+ Nueva Solicitud")
      )
    ),
    h("div", { className: "pestanas" },
      h("button", { className: "pestana" + (pestana === "pendientes" ? " activa" : ""), onClick: () => setPestana("pendientes") },
        "Pendientes (" + pendientes.length + ")"),
      h("button", { className: "pestana" + (pestana === "otras" ? " activa" : ""), onClick: () => setPestana("otras") },
        "Convertidas / Anuladas (" + otras.length + ")")
    ),
    h("div", { className: "panel" },
      cargando
        ? h("div", { className: "cargando" }, "Cargando...")
        : errorCarga
          ? h("div", { className: "error-carga" }, errorCarga)
          : pestana === "pendientes"
            ? (pendientes.length === 0
                ? h("div", { className: "error-carga" }, "No hay solicitudes pendientes ahora mismo.")
                : TablaInfoAgro(h, { columnas, filas: pendientes, onFilaClick: setSolicitudAbierta }))
            : (otras.length === 0
                ? h("div", { className: "error-carga" }, "Sin historial todavía.")
                : TablaInfoAgro(h, { columnas: columnasOtras, filas: otras, onFilaClick: setSolicitudAbierta }))
    ),
    modalNueva && h(ModalNuevaSolicitud, { onCerrar: () => setModalNueva(false), onCreada: () => { setModalNueva(false); cargar(); } })
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(SolicitudDeServicio));
</script>
</body>
</html>

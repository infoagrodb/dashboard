<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>

<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626; --color-peligro-suave:#FEE2E2;

  *{box-sizing:border-box;}
  body{

  .barra-botones{display:flex; gap:8px;}

  .btn-primario{background:var(--color-primario); color:#fff; border:none; border-radius:999px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-primario:hover:not(:disabled){background:var(--color-primario-oscuro);}
  .btn-primario:disabled{opacity:.6; cursor:default;}
  .btn-secundario{background:#fff; border:1px solid var(--color-borde); border-radius:999px; padding:9px 14px; font-size:13px; cursor:pointer; color:var(--color-texto);}
  .btn-peligro{background:#fff; border:1px solid var(--color-peligro); color:var(--color-peligro); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer;}
  .btn-peligro:hover{background:var(--color-peligro-suave);}
  .btn-chico{background:#fff; border:1px solid var(--color-borde); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--color-texto);}
  .btn-chico:hover{border-color:var(--color-primario); color:var(--color-primario-oscuro);}
  .link-chico{background:none; border:none; color:var(--color-primario-oscuro); font-size:11.5px; cursor:pointer; padding:0; text-decoration:underline; display:block;}
  .link-volver{background:none; border:none; color:var(--color-primario-oscuro); font-size:13px; cursor:pointer; padding:0; text-decoration:underline; margin-bottom:10px;}

  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px; margin-bottom:14px;}
  .cargando, .error-carga{text-align:center; padding:40px; color:var(--color-texto-suave);}

  .badge-estado{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; white-space:nowrap;}
  .estado-Borrador{background:#F1F5F9; color:#64748B;}
  .estado-Enviado{background:#FEF3C7; color:#B45309;}
  .estado-Aprobado{background:#D1FAE5; color:#15803D;}
  .estado-Rechazado{background:#FEE2E2; color:#991B1B;}
  .estado-Sustituido{background:#E0E7FF; color:#4338CA;}

  .buscador{position:relative;}
  .buscador-resultados{
    position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--color-borde);
    border-radius:7px; box-shadow:var(--sombra); max-height:220px; overflow-y:auto; z-index:50; margin-top:4px;

  .cabecera-presupuesto{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}

  .campo{margin-bottom:14px;}
  label{display:block; font-size:11.5px; color:var(--color-texto-suave); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
  input, select, textarea{width:100%; border:1px solid var(--color-borde); border-radius:7px; padding:8px 10px; font-size:13.5px; background:#fff; color:var(--color-texto); font-family:inherit;}
  textarea{resize:vertical; min-height:50px;}
  .fila{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .campo-articulo-fila > .buscador{flex:1;}

    position:relative; flex-shrink:0; width:40px; height:40px; border-radius:10px; border:none;

  .btn-agregar-articulo .punto-notificacion{

    background:var(--color-peligro); border:2px solid #fff;
  }
  .seleccion-articulo{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    background:var(--color-acento-suave); border:1px solid #A7F3D0; border-radius:8px; padding:10px 12px;
  }
  .seleccion-articulo .descripcion{font-weight:600; font-size:13.5px; color:var(--color-texto);}
  .seleccion-articulo .codigo{font-size:11.5px; color:var(--color-texto-suave); margin-top:2px;}
  .form-nueva-linea .campo-chico{min-width:110px; flex:1;}
  .form-nueva-linea label{margin-bottom:3px;}

  .totales-resumen{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  .totales-caja{background:#F8FAFC; border-radius:8px; padding:12px;}
  .totales-caja .linea-total{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0;}
  .totales-caja .linea-total.grande{font-size:15px; font-weight:700; border-top:1px solid var(--color-borde); margin-top:6px; padding-top:8px; color:var(--color-primario-oscuro);}

  .mensaje-error{background:var(--color-peligro-suave); border-left:3px solid var(--color-peligro); color:#991B1B; font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}
  .mensaje-exito{background:var(--color-acento-suave); border-left:3px solid var(--color-primario); color:var(--color-primario-oscuro); font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}

  .modal-fondo{position:fixed; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .modal{background:#fff; border-radius:12px; padding:22px; width:100%; max-width:420px; box-shadow:0 20px 40px rgba(17,24,39,.25);}
  .modal.modal-ancho{max-width:680px;}
  .modal.modal-extra-ancho{max-width:760px;}

  .modal-botones{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
</style>

<body>
<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">presupuestos.html — v19 (UM después de Descripción en Agregar Línea)</div>

<script>
const h = React.createElement;
const { useState, useEffect, useRef, useMemo } = React;

const TIPOS_LINEA = ["Repuesto","Material","Mano de obra","Servicio","Otro"];

function claseEstado(estado){
  return "badge-estado estado-" + String(estado).replace(/\s+/g, "");
}
function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function moneda(v){ return "$" + num(v).toFixed(2); }

function Buscador({ placeholder, buscar, renderItem, onSeleccionar }){
  const [texto, setTexto] = useState("");
  const [resultados, setResultados] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const timerRef = useRef(null);

  function cambiar(valor){
    setTexto(valor);
    if (timerRef.current) clearTimeout(timerRef.current);
    if (!valor.trim()){ setResultados(null); return; }
    timerRef.current = setTimeout(async () => {
      setBuscando(true);
      try { setResultados(await buscar(valor.trim())); }
      catch(e) { setResultados([]); }
      finally { setBuscando(false); }
    }, 300);
  }

  return h("div", { className: "buscador" },
    h("input", { type: "text", placeholder, value: texto, onChange: e => cambiar(e.target.value) }),
    resultados !== null && h("div", { className: "buscador-resultados" },
      buscando ? h("div", { className: "buscador-vacio" }, "Buscando...") :
      resultados.length === 0 ? h("div", { className: "buscador-vacio" }, "Sin resultados") :
      resultados.map(item => h("div", {
          key: item.id, className: "buscador-item",
          onClick: () => { onSeleccionar(item); setTexto(""); setResultados(null); },
        }, renderItem(item))
      )
    )
  );
}

function ModalNuevoPresupuesto({ onCerrar, onCreado }){
  const [orden, setOrden] = useState(null);
  const [ordenes, setOrdenes] = useState(null);
  const [cargandoOrdenes, setCargandoOrdenes] = useState(true);
  const [creando, setCreando] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    tallerQuery("x_taller_orden", [
      "id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_estado","x_studio_fecha_recepcion",
    ], [["x_studio_estado","not in",["Cerrada","Cancelada","Entregada"]]], 1000)
      .then(setOrdenes)
      .catch(e => setError("No se pudieron cargar las órdenes: " + e.message))
      .finally(() => setCargandoOrdenes(false));
  }, []);

  async function crear(){
    setCreando(true); setError("");
    try {
      const existentes = await tallerQuery("x_taller_presupuesto", ["id","x_studio_version"], [["x_studio_orden_id","=",orden.id]], 100);
      const versionAnterior = existentes.length ? existentes.sort((a,b) => b.x_studio_version - a.x_studio_version)[0] : null;
      const siguienteVersion = versionAnterior ? versionAnterior.x_studio_version + 1 : 1;
      const nombre = orden.x_name + "-V" + siguienteVersion;
      const resp = await tallerCrear("x_taller_presupuesto", {
        x_name: nombre,
        x_studio_orden_id: orden.id,
        x_studio_version: siguienteVersion,
        x_studio_fecha_presupuesto: fechaParaOdoo(new Date()),
        x_studio_estado: "Borrador",
        x_studio_vigencia_dias: 8,
      });
      if (!resp.ok) {
        setError(resp.error || "No se pudo crear el presupuesto.");
        setCreando(false);
        return;
      }

      // Copiar las líneas de la versión anterior — la nueva versión no arranca en blanco.
      // Una por una (no Promise.all): mandar muchas peticiones a la vez puede hacer que
      // Cloudflare devuelva una página de error HTML en vez de JSON.
      if (versionAnterior) {
        const lineasAnteriores = await tallerQuery("x_presupuesto_detalle", [
          "x_name","x_studio_tipo_linea","x_studio_sku","x_studio_descripcion","x_studio_cantidad_presupuestada",
          "x_studio_unidad_medida","x_studio_costo_manual","x_studio_costo_unitario_presupuestado",
          "x_studio_origen_costo","x_studio_costo_inventario_consultado","x_studio_total_costo_presupuestado",
        ], [["x_studio_presupuesto_id","=",versionAnterior.id]], 500);
        for (const l of lineasAnteriores) {
          await tallerCrear("x_presupuesto_detalle", {
            x_name: l.x_name,
            x_studio_presupuesto_id: resp.id,
            x_studio_tipo_linea: l.x_studio_tipo_linea,
            x_studio_sku: l.x_studio_sku || false,
            x_studio_descripcion: l.x_studio_descripcion,
            x_studio_cantidad_presupuestada: l.x_studio_cantidad_presupuestada,
            x_studio_unidad_medida: l.x_studio_unidad_medida,
            x_studio_costo_manual: l.x_studio_costo_manual,
            x_studio_costo_unitario_presupuestado: l.x_studio_costo_unitario_presupuestado,
            x_studio_origen_costo: l.x_studio_origen_costo,
            x_studio_costo_inventario_consultado: l.x_studio_costo_inventario_consultado || 0,
            x_studio_total_costo_presupuestado: l.x_studio_total_costo_presupuestado,
          });
        }
      }

      onCreado(resp.id);
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setCreando(false);
    }
  }

  const columnasOrdenes = [
    { clave: "x_name", titulo: "Folio" },
    { clave: "x_studio_cliente_id", titulo: "Cliente" },
    { clave: "x_studio_equipo_id", titulo: "Equipo" },
    { clave: "x_studio_estado", titulo: "Estado" },
    { clave: "x_studio_fecha_recepcion", titulo: "Recepción", formatear: formatearFecha },
  ];

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal modal-ancho", onClick: e => e.stopPropagation() },
      h("h3", null, "💵 Nuevo Presupuesto"),
      h("div", { className: "campo" },
        h("label", null, "Elegí la orden de trabajo"),
        orden
          ? h("div", { style: { display:"flex", justifyContent:"space-between", alignItems:"center", background:"#D1FAE5", borderRadius:"7px", padding:"9px 12px" } },
              h("div", null,
                h("strong", null, orden.x_name),
                h("div", { className: "sub" }, (Array.isArray(orden.x_studio_cliente_id) ? orden.x_studio_cliente_id[1] : "") + " · " + orden.x_studio_estado)
              ),
              h("button", { className: "btn-chico", onClick: () => setOrden(null) }, "Cambiar")
            )
          : cargandoOrdenes
            ? h("div", { className: "buscador-vacio" }, "Cargando órdenes...")
            : h("div", { style: { maxHeight: "360px", overflowY: "auto" } },
                TablaInfoAgro(h, { columnas: columnasOrdenes, filas: ordenes || [], onFilaClick: setOrden })
              )
      ),
      error && h("div", { className: "mensaje-error" }, error),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar, disabled: creando }, "Cancelar"),
        h("button", { className: "btn-primario", onClick: crear, disabled: creando || !orden }, creando ? "Creando..." : "Crear versión")
      )
    )
  );
}

function FilaLinea({ linea, soloLectura, onCambiar, onGuardar, onQuitar }){
  const total = num(linea.x_studio_cantidad_presupuestada) * num(linea.x_studio_costo_manual);
  return h("tr", null,
    h("td", { className: "col-tipo" },
      soloLectura ? linea.x_studio_tipo_linea :
      h("select", { value: linea.x_studio_tipo_linea, onChange: e => onCambiar({ ...linea, x_studio_tipo_linea: e.target.value }) },
        TIPOS_LINEA.map(t => h("option", { key: t, value: t }, t))
      )
    ),
    h("td", null,
      soloLectura ? linea.x_studio_descripcion :
      h("input", { type: "text", value: linea.x_studio_descripcion || "", onChange: e => onCambiar({ ...linea, x_studio_descripcion: e.target.value }) })
    ),
    h("td", { className: "col-num" },
      soloLectura ? linea.x_studio_cantidad_presupuestada :
      h("input", { type: "number", step: "0.01", value: linea.x_studio_cantidad_presupuestada, onChange: e => onCambiar({ ...linea, x_studio_cantidad_presupuestada: e.target.value }) })
    ),
    h("td", { className: "col-num" },
      soloLectura ? linea.x_studio_unidad_medida :
      h("input", { type: "text", value: linea.x_studio_unidad_medida || "", onChange: e => onCambiar({ ...linea, x_studio_unidad_medida: e.target.value }) })
    ),
    h("td", { className: "col-num" },
      soloLectura ? moneda(linea.x_studio_costo_manual) :
      h("input", { type: "number", step: "0.01", value: linea.x_studio_costo_manual, onChange: e => onCambiar({ ...linea, x_studio_costo_manual: e.target.value }) })
    ),
    h("td", { className: "col-num texto-derecha" }, moneda(total)),
    !soloLectura && h("td", null,
      h("button", { className: "btn-chico", onClick: onGuardar }, linea._guardando ? "..." : (linea.id ? "💾" : "➕")),
      h("button", { className: "btn-quitar", onClick: onQuitar, title: "Quitar" }, "✕")
    )
  );
}

function ModalArticuloNuevo({ textoInicial, onCerrar, onCreado }){
  const [descripcion, setDescripcion] = useState(textoInicial || "");
  const [codigo, setCodigo] = useState("");
  const [categoria, setCategoria] = useState("");
  const [unidadMedida, setUnidadMedida] = useState("und");
  const [costo, setCosto] = useState(0);
  const [guardando, setGuardando] = useState(false);
  const [error, setError] = useState("");

  async function guardar(){
    if (!descripcion.trim()){ setError("La descripción es obligatoria."); return; }
    setGuardando(true); setError("");
    try {
      const resp = await tallerCrear("x_taller_articulo", {
        x_name: descripcion.trim(),
        x_studio_codigo: codigo || false,
        x_studio_categoria: categoria || false,
        x_studio_unidad_medida: unidadMedida || false,
        x_studio_costo_promedio: num(costo),
        x_studio_origen_erp: "Otro",
        x_studio_activo_en_erp: false,
        x_studio_notas_internas: "Pendiente de creación en Exactus — solicitado desde presupuesto el " + formatearFecha(new Date()),
      });
      if (resp.ok) {
        onCreado({
          ARTICULO: codigo || ("LOCAL-" + resp.id),
          DESCRIPCION: descripcion.trim(),
          COSTO_PROM_DOL: num(costo),
          COSTO_ULT_DOL: num(costo),
          UNIDAD_ALMACEN: unidadMedida,
        });
      } else {
        setError(resp.error || "No se pudo crear el artículo.");
      }
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  return h("div", { className: "modal-fondo", onClick: onCerrar },
    h("div", { className: "modal", onClick: e => e.stopPropagation() },
      h("h3", null, "📦 Crear Artículo Nuevo"),
      h("div", { style: { background:"var(--color-alerta-suave)", border:"1px solid var(--color-alerta)", borderRadius:"7px", padding:"9px 11px", fontSize:"12px", color:"#92400E", marginBottom:"14px" } },
        "Este artículo todavía no existe en Exactus. Se crea aquí para no detener el presupuesto — avisale al equipo de Exactus para que lo den de alta oficialmente allá."
      ),
      h("div", { className: "campo" },
        h("label", null, "Descripción"),
        h("input", { type: "text", value: descripcion, autoFocus: true, onChange: e => setDescripcion(e.target.value) })
      ),
      h("div", { className: "fila" },
        h("div", { className: "campo" },
          h("label", null, "Código (si ya tenés uno pensado)"),
          h("input", { type: "text", value: codigo, onChange: e => setCodigo(e.target.value) })
        ),
        h("div", { className: "campo" },
          h("label", null, "Unidad de medida"),
          h("input", { type: "text", value: unidadMedida, onChange: e => setUnidadMedida(e.target.value) })
        )
      ),
      h("div", { className: "fila" },
        h("div", { className: "campo" },
          h("label", null, "Categoría"),
          h("input", { type: "text", value: categoria, onChange: e => setCategoria(e.target.value) })
        ),
        h("div", { className: "campo" },
          h("label", null, "Costo estimado (US$)"),
          h("input", { type: "number", step: "0.01", value: costo, onChange: e => setCosto(e.target.value) })
        )
      ),
      error && h("div", { className: "mensaje-error" }, error),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: onCerrar, disabled: guardando }, "Cancelar"),
        h("button", { className: "btn-primario", onClick: guardar, disabled: guardando }, guardando ? "Creando..." : "Crear y usar en la línea")
      )
    )
  );
}

function DetallePresupuesto({ presupuestoId, onVolver }){
  const [presupuesto, setPresupuesto] = useState(null);
  const [orden, setOrden] = useState(null);
  const [lineas, setLineas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [exito, setExito] = useState("");
  const [nuevaLinea, setNuevaLinea] = useState(lineaVacia());
  const [guardandoNueva, setGuardandoNueva] = useState(false);
  const [modalNuevaLinea, setModalNuevaLinea] = useState(false);
  const [modalArticuloNuevo, setModalArticuloNuevo] = useState(false);
  const [aprobando, setAprobando] = useState(false);
  const [nombreAprobador, setNombreAprobador] = useState("");
  const [modalAprobar, setModalAprobar] = useState(false);
  const [modalRechazar, setModalRechazar] = useState(false);
  const [motivoRechazo, setMotivoRechazo] = useState("");

  function lineaVacia(){
    return { x_studio_tipo_linea: "Repuesto", x_studio_descripcion: "", x_studio_sku: "", x_studio_cantidad_presupuestada: 1, x_studio_unidad_medida: "und", x_studio_costo_manual: 0, x_studio_origen_costo: "Manual" };
  }

  useEffect(() => { cargar(); }, [presupuestoId]);

  async function cargar(){
    setCargando(true); setError("");
    try {
      const presRows = await tallerQuery("x_taller_presupuesto", [
        "id","x_name","x_studio_orden_id","x_studio_version","x_studio_estado","x_studio_fecha_presupuesto",
        "x_studio_descuento","x_studio_impuestos","x_studio_otros_costos","x_studio_vigencia_dias",
        "x_studio_elaborado_por","x_studio_aprobado_por_cliente","x_studio_fecha_aprobacion","x_studio_observaciones",
      ], [["id","=",presupuestoId]], 1);
      const lineasRows = await tallerQuery("x_presupuesto_detalle", [
        "id","x_studio_tipo_linea","x_studio_descripcion","x_studio_cantidad_presupuestada",
        "x_studio_unidad_medida","x_studio_costo_manual","x_studio_origen_costo",
      ], [["x_studio_presupuesto_id","=",presupuestoId]], 500);
      if (!presRows.length){ setError("No se encontró el presupuesto."); setCargando(false); return; }
      setPresupuesto(presRows[0]);
      setLineas(lineasRows);
      if (Array.isArray(presRows[0].x_studio_orden_id)) {
        const ordenRows = await tallerQuery("x_taller_orden", ["id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_fecha_recepcion"], [["id","=",presRows[0].x_studio_orden_id[0]]], 1);
        if (ordenRows.length) setOrden(ordenRows[0]);
      }
    } catch(e) {
      setError("Error al cargar: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  const soloLectura = presupuesto && presupuesto.x_studio_estado !== "Borrador";

  const totales = useMemo(() => {
    const subMateriales = lineas.filter(l => ["Repuesto","Material","Otro"].includes(l.x_studio_tipo_linea))
      .reduce((s,l) => s + num(l.x_studio_cantidad_presupuestada) * num(l.x_studio_costo_manual), 0);
    const subManoObra = lineas.filter(l => l.x_studio_tipo_linea === "Mano de obra")
      .reduce((s,l) => s + num(l.x_studio_cantidad_presupuestada) * num(l.x_studio_costo_manual), 0);
    const subServicios = lineas.filter(l => l.x_studio_tipo_linea === "Servicio")
      .reduce((s,l) => s + num(l.x_studio_cantidad_presupuestada) * num(l.x_studio_costo_manual), 0);
    const subtotal = subMateriales + subManoObra + subServicios;
    const descuento = presupuesto ? num(presupuesto.x_studio_descuento) : 0;
    const impuestos = presupuesto ? num(presupuesto.x_studio_impuestos) : 0;
    const otros = presupuesto ? num(presupuesto.x_studio_otros_costos) : 0;
    const total = subtotal - descuento + impuestos + otros;
    return { subMateriales, subManoObra, subServicios, subtotal, descuento, impuestos, otros, total };
  }, [lineas, presupuesto]);

  async function guardarLinea(linea, indice){
    setLineas(prev => prev.map((l,i) => i === indice ? { ...l, _guardando: true } : l));
    const valores = {
      x_name: linea.x_studio_descripcion || "Línea sin descripción",
      x_studio_presupuesto_id: presupuestoId,
      x_studio_tipo_linea: linea.x_studio_tipo_linea,
      x_studio_descripcion: linea.x_studio_descripcion,
      x_studio_cantidad_presupuestada: num(linea.x_studio_cantidad_presupuestada),
      x_studio_unidad_medida: linea.x_studio_unidad_medida,
      x_studio_costo_manual: num(linea.x_studio_costo_manual),
      x_studio_costo_unitario_presupuestado: num(linea.x_studio_costo_manual),
      x_studio_origen_costo: "Manual",
      x_studio_total_costo_presupuestado: num(linea.x_studio_cantidad_presupuestada) * num(linea.x_studio_costo_manual),
    };
    try {
      if (linea.id) {
        await tallerActualizar("x_presupuesto_detalle", linea.id, valores);
      } else {
        const resp = await tallerCrear("x_presupuesto_detalle", valores);
        if (resp.ok) {
          setLineas(prev => prev.map((l,i) => i === indice ? { ...linea, id: resp.id, _guardando: false } : l));
          return;
        }
      }
      setLineas(prev => prev.map((l,i) => i === indice ? { ...l, _guardando: false } : l));
    } catch(e) {
      setError("No se pudo guardar la línea: " + e.message);
      setLineas(prev => prev.map((l,i) => i === indice ? { ...l, _guardando: false } : l));
    }
  }

  async function quitarLinea(linea, indice){
    if (linea.id) {
      if (!confirm("¿Quitar esta línea del presupuesto?")) return;
      try { await tallerDesactivar("x_presupuesto_detalle", linea.id, "Quitada por el usuario"); }
      catch(e) { setError("No se pudo quitar: " + e.message); return; }
    }
    setLineas(prev => prev.filter((_,i) => i !== indice));
  }

  async function agregarNuevaLinea(){
    setGuardandoNueva(true); setError("");
    const esDeInventario = nuevaLinea.x_studio_origen_costo === "Inventario";
    const valores = {
      x_name: nuevaLinea.x_studio_descripcion || "Línea sin descripción",
      x_studio_presupuesto_id: presupuestoId,
      x_studio_tipo_linea: nuevaLinea.x_studio_tipo_linea,
      x_studio_descripcion: nuevaLinea.x_studio_descripcion,
      x_studio_sku: nuevaLinea.x_studio_sku || false,
      x_studio_cantidad_presupuestada: num(nuevaLinea.x_studio_cantidad_presupuestada),
      x_studio_unidad_medida: nuevaLinea.x_studio_unidad_medida,
      x_studio_costo_manual: num(nuevaLinea.x_studio_costo_manual),
      x_studio_costo_inventario_consultado: esDeInventario ? num(nuevaLinea.x_studio_costo_manual) : 0,
      x_studio_costo_unitario_presupuestado: num(nuevaLinea.x_studio_costo_manual),
      x_studio_origen_costo: esDeInventario ? "Inventario" : "Manual",
      x_studio_total_costo_presupuestado: num(nuevaLinea.x_studio_cantidad_presupuestada) * num(nuevaLinea.x_studio_costo_manual),
    };
    try {
      const resp = await tallerCrear("x_presupuesto_detalle", valores);
      if (resp.ok) {
        setLineas(prev => [...prev, { ...valores, id: resp.id }]);
        setNuevaLinea(lineaVacia());
        setModalNuevaLinea(false);
      } else {
        setError(resp.error || "No se pudo agregar la línea.");
      }
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardandoNueva(false);
    }
  }

  const [generandoPdf, setGenerandoPdf] = useState(false);
  const [generandoLink, setGenerandoLink] = useState(false);

  async function generarLinkAprobacion(){
    setGenerandoLink(true); setError(""); setExito("");
    try {
      const resp = await tallerFetch("/taller/presupuesto/compartir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ presupuesto_id: presupuestoId }),
      });
      if (!resp.ok) { setError(resp.error || "No se pudo generar el link."); return; }
      const url = window.location.href.replace(/presupuestos\.html.*$/, "aprobar.html") + "?id=" + presupuestoId + "&token=" + resp.token;
      const clienteNombre = orden && Array.isArray(orden.x_studio_cliente_id) ? orden.x_studio_cliente_id[1] : "";
      if (navigator.share) {
        await navigator.share({
          title: "Presupuesto " + presupuesto.x_name,
          text: "Hola" + (clienteNombre ? " " + clienteNombre : "") + ", te comparto el presupuesto " + presupuesto.x_name + " (" + moneda(totales.total) + ") para tu revisión y aprobación.",
          url,
        });
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(url);
        setExito("Link copiado al portapapeles: " + url);
      } else {
        setExito("Link: " + url);
      }
    } catch(e) {
      if (e.name !== "AbortError") setError("Error: " + e.message);
    } finally {
      setGenerandoLink(false);
    }
  }

  function construirPDF(){
    if (!window.jspdf) throw new Error("La librería de PDF no cargó (revisá tu conexión y recargá la página).");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "letter" });
    if (typeof doc.autoTable !== "function") throw new Error("El complemento de tablas del PDF no cargó — recargá la página con Ctrl+Shift+R e intentá de nuevo.");
    const anchoPagina = doc.internal.pageSize.getWidth();
    const clienteNombre = orden && Array.isArray(orden.x_studio_cliente_id) ? orden.x_studio_cliente_id[1] : "—";
    const equipoNombre = orden && Array.isArray(orden.x_studio_equipo_id) ? orden.x_studio_equipo_id[1] : "—";

    // Encabezado plano — sin bloques de color, estilo cotización formal
    doc.setTextColor(17, 24, 39);
    doc.setFont(undefined, "bold"); doc.setFontSize(14);
    doc.text("INFOTALLER", 14, 14);
    doc.setFont(undefined, "normal"); doc.setFontSize(9);
    doc.text("División Agrícola — COMASA", 14, 19);
    doc.setFont(undefined, "normal"); doc.setFontSize(9);
    doc.text("Departamento de Taller", 14, 23.5);

    doc.setFont(undefined, "bold"); doc.setFontSize(13);
    doc.text("PRESUPUESTO", anchoPagina - 14, 14, { align: "right" });
    doc.setFont(undefined, "normal"); doc.setFontSize(9);
    doc.text("N.º: " + presupuesto.x_name, anchoPagina - 14, 19, { align: "right" });
    doc.text("Versión: " + presupuesto.x_studio_version, anchoPagina - 14, 23.5, { align: "right" });

    doc.setDrawColor(17, 24, 39);
    doc.setLineWidth(0.5);
    doc.line(14, 28, anchoPagina - 14, 28);

    // Datos de la orden / cliente / equipo — con trazabilidad de fechas (orden vs. versión del presupuesto)
    let y = 36;
    const filaDato = (etiqueta, valor, x) => {
      doc.setFont(undefined, "bold"); doc.setFontSize(9); doc.text(etiqueta, x, y);
      doc.setFont(undefined, "normal"); doc.text(String(valor || "—"), x, y + 5);
    };
    filaDato("ORDEN", orden ? orden.x_name : "—", 14);
    filaDato("FECHA DE LA ORDEN", orden ? formatearFecha(orden.x_studio_fecha_recepcion) : "—", 90);
    filaDato("FECHA DE ESTA VERSIÓN", formatearFecha(presupuesto.x_studio_fecha_presupuesto), 150);
    y += 12;
    filaDato("CLIENTE", clienteNombre, 14);
    filaDato("EQUIPO", equipoNombre, 90);
    filaDato("VIGENCIA", (presupuesto.x_studio_vigencia_dias || 0) + " días", 150);
    y += 14;

    // Tabla de líneas — ordenadas por tipo: Repuesto, Material, Servicio, Mano de obra, Otro
    const ordenTipos = { "Repuesto": 0, "Material": 1, "Servicio": 2, "Mano de obra": 3, "Otro": 4 };
    const lineasOrdenadas = [...lineas].sort((a, b) =>
      (ordenTipos[a.x_studio_tipo_linea] ?? 99) - (ordenTipos[b.x_studio_tipo_linea] ?? 99)
    );
    doc.autoTable({
      startY: y,
      head: [["Tipo", "Descripción", "Cant.", "UM", "Costo Unit.", "Total"]],
      body: lineasOrdenadas.map(l => [
        l.x_studio_tipo_linea,
        l.x_studio_descripcion,
        num(l.x_studio_cantidad_presupuestada).toString(),
        l.x_studio_unidad_medida || "",
        moneda(l.x_studio_costo_manual),
        moneda(num(l.x_studio_cantidad_presupuestada) * num(l.x_studio_costo_manual)),
      ]),
      headStyles: { fillColor: [255,255,255], textColor: [17,24,39], fontStyle: "bold", fontSize: 9, lineWidth: 0.3, lineColor: [17,24,39] },
      styles: { fontSize: 9, cellPadding: 3, textColor: [17, 24, 39], lineWidth: 0.15, lineColor: [200,200,200] },
      columnStyles: { 2: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "right" } },
      margin: { left: 14, right: 14 },
    });

    let yFinal = doc.lastAutoTable.finalY + 8;

    // Totales, alineados a la derecha
    const xEtiqueta = anchoPagina - 80, xValor = anchoPagina - 14;
    const filaTotal = (etiqueta, valor, grande) => {
      doc.setFont(undefined, grande ? "bold" : "normal");
      doc.setFontSize(grande ? 12 : 9.5);
      doc.setTextColor(grande ? 21 : 55, grande ? 128 : 65, grande ? 61 : 81);
      doc.text(etiqueta, xEtiqueta, yFinal);
      doc.text(valor, xValor, yFinal, { align: "right" });
      yFinal += grande ? 7 : 5.5;
    };
    filaTotal("Materiales/Repuestos", moneda(totales.subMateriales));
    filaTotal("Mano de obra", moneda(totales.subManoObra));
    filaTotal("Servicios", moneda(totales.subServicios));
    filaTotal("Descuento", "-" + moneda(totales.descuento));
    filaTotal("Impuestos", moneda(totales.impuestos));
    doc.setDrawColor(228, 233, 238); doc.line(xEtiqueta, yFinal - 3, xValor, yFinal - 3);
    filaTotal("TOTAL", moneda(totales.total), true);

    // Sello de aprobado, si aplica
    if (presupuesto.x_studio_estado === "Aprobado") {
      doc.setTextColor(21, 128, 61);
      doc.setFont(undefined, "bold"); doc.setFontSize(10);
      doc.text("✔ APROBADO por " + presupuesto.x_studio_aprobado_por_cliente + " el " + formatearFecha(presupuesto.x_studio_fecha_aprobacion), 14, yFinal + 10);
    }

    // Pie: firma y generado por
    const alturaPagina = doc.internal.pageSize.getHeight();
    doc.setDrawColor(228, 233, 238);
    doc.line(14, alturaPagina - 30, 80, alturaPagina - 30);
    doc.setTextColor(107, 114, 128); doc.setFont(undefined, "normal"); doc.setFontSize(8.5);
    doc.text("Firma de aprobación", 14, alturaPagina - 25);
    doc.text("Generado " + formatearFechaHora(new Date()) + " — Infotaller COMASA", 14, alturaPagina - 12);

    return doc;
  }

  async function generarYCompartirPdf(){
    setGenerandoPdf(true); setError("");
    try {
      const doc = construirPDF();
      const nombreArchivo = presupuesto.x_name + ".pdf";
      const blob = doc.output("blob");
      const archivo = new File([blob], nombreArchivo, { type: "application/pdf" });

      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        await navigator.share({
          files: [archivo],
          title: "Presupuesto " + presupuesto.x_name,
          text: "Presupuesto " + presupuesto.x_name + " — total " + moneda(totales.total),
        });
      } else {
        doc.save(nombreArchivo);
      }
    } catch(e) {
      if (e.name !== "AbortError") setError("No se pudo generar/compartir el PDF: " + e.message);
    } finally {
      setGenerandoPdf(false);
    }
  }

  function descargarPdf(){
    try {
      const doc = construirPDF();
      doc.save(presupuesto.x_name + ".pdf");
    } catch(e) {
      setError("No se pudo generar el PDF: " + e.message);
    }
  }

  async function confirmarAprobacion(){
    if (!nombreAprobador.trim()){ setError("Escribí el nombre de quien aprueba."); return; }
    setAprobando(true); setError("");
    try {
      const resp = await tallerActualizar("x_taller_presupuesto", presupuestoId, {
        x_studio_estado: "Aprobado",
        x_studio_aprobado_por_cliente: nombreAprobador.trim(),
        x_studio_fecha_aprobacion: fechaParaOdoo(new Date()) + " " + new Date().toTimeString().slice(0,8),
      });
      if (resp.ok) {
        setModalAprobar(false);
        setExito("Presupuesto aprobado.");
        cargar();
      } else {
        setError(resp.error || "No se pudo aprobar.");
      }
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setAprobando(false);
    }
  }

  async function confirmarRechazo(){
    setAprobando(true); setError("");
    try {
      const resp = await tallerActualizar("x_taller_presupuesto", presupuestoId, {
        x_studio_estado: "Rechazado",
        x_studio_observaciones: (presupuesto.x_studio_observaciones || "") + "\nRechazado: " + motivoRechazo,
      });
      if (!resp.ok) { setError(resp.error || "No se pudo rechazar."); setAprobando(false); return; }
      if (orden) {
        await tallerActualizar("x_taller_orden", orden.id, { x_studio_estado: "Rechazada" });
      }
      setModalRechazar(false);
      setExito("Presupuesto rechazado. La orden pasó a estado Rechazada — desde Cierres podés cerrarla cobrando el diagnóstico.");
      cargar();
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setAprobando(false);
    }
  }

  if (cargando) return h("div", { className: "panel cargando" }, "Cargando presupuesto...");
  if (error && !presupuesto) return h("div", { className: "panel error-carga" }, error);
  if (!presupuesto) return null;

  return h("div", null,
    h("button", { className: "link-volver", onClick: onVolver }, "← Volver a la lista"),

    h("div", { className: "panel" },
      h("div", { className: "cabecera-presupuesto" },
        h("div", null,
          h("h2", null, presupuesto.x_name),
          h("div", { className: "sub" },
            orden ? "Orden: " + orden.x_name + " · " + (Array.isArray(orden.x_studio_cliente_id) ? orden.x_studio_cliente_id[1] : "") : "",
            " · " + formatearFecha(presupuesto.x_studio_fecha_presupuesto)
          )
        ),
        h("span", { className: claseEstado(presupuesto.x_studio_estado) }, presupuesto.x_studio_estado)
      ),

      presupuesto.x_studio_estado === "Aprobado" && h("div", { className: "mensaje-exito" },
        "✅ Aprobado por " + presupuesto.x_studio_aprobado_por_cliente + " el " + formatearFecha(presupuesto.x_studio_fecha_aprobacion) + " — este presupuesto ya no se puede editar."
      ),

      h("div", { style: { display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"8px" } },
        h("span", { style: { fontSize:"12.5px", fontWeight:600, color:"var(--color-texto-suave)" } }, "Líneas del presupuesto"),
        !soloLectura && h("button", { className: "btn-primario", onClick: () => setModalNuevaLinea(true) }, "+ Agregar línea")
      ),

      h("table", { className: "tabla-lineas" },
        h("thead", null,
          h("tr", null,
            h("th", null, "Tipo"), h("th", null, "Descripción"), h("th", null, "Cant."),
            h("th", null, "UM"), h("th", null, "Costo Unit."), h("th", { className: "texto-derecha" }, "Total"),
            !soloLectura && h("th", null, "")
          )
        ),
        h("tbody", null,
          lineas.map((l, i) => h(FilaLinea, {
            key: l.id || "nueva" + i, linea: l, soloLectura,
            onCambiar: nueva => setLineas(prev => prev.map((x,idx) => idx === i ? nueva : x)),
            onGuardar: () => guardarLinea(l, i),
            onQuitar: () => quitarLinea(l, i),
          })),
          lineas.length === 0 && h("tr", null, h("td", { colSpan: 7, style: { textAlign:"center", color:"var(--color-texto-suave)", padding:"14px" } }, "Sin líneas todavía."))
        )
      ),

      modalNuevaLinea && h("div", { className: "modal-fondo", onClick: () => setModalNuevaLinea(false) },
      h("div", { className: "modal modal-extra-ancho", onClick: e => e.stopPropagation() },
      h("h3", null, "+ Agregar Línea al Presupuesto"),
      h("div", { className: "grid-nueva-linea" },
        h("div", { className: "campo campo-ancho" },
          h("label", null, "Tipo"),
          h("select", { value: nuevaLinea.x_studio_tipo_linea, onChange: e => setNuevaLinea({ ...nuevaLinea, x_studio_tipo_linea: e.target.value, x_studio_sku: "", x_studio_descripcion: "", x_studio_origen_costo: "Manual" }) },
            TIPOS_LINEA.map(t => h("option", { key: t, value: t }, t))
          )
        ),

        h("div", { className: "campo campo-ancho" },
          h("label", null, "Descripción" + (["Repuesto","Material"].includes(nuevaLinea.x_studio_tipo_linea) ? " (buscá por nombre o código — Exactus + InfoAgro)" : "")),
          ["Repuesto","Material"].includes(nuevaLinea.x_studio_tipo_linea)
            ? (nuevaLinea.x_studio_descripcion
                ? h("div", { className: "seleccion-articulo" },
                    h("div", null,
                      h("div", { className: "descripcion" }, nuevaLinea.x_studio_descripcion),
                      nuevaLinea.x_studio_sku && h("div", { className: "codigo" },
                        "Código: " + nuevaLinea.x_studio_sku + (nuevaLinea.x_studio_origen_costo === "Inventario" ? " · costo de Exactus (ajustable abajo)" : " · costo manual")
                      )
                    ),
                    h("button", { className: "btn-chico", type: "button", onClick: () => setNuevaLinea({ ...nuevaLinea, x_studio_descripcion: "", x_studio_sku: "" }) }, "Cambiar")
                  )
                : h("div", { className: "campo-articulo-fila" },
                    h(Buscador, {
                      placeholder: "Buscar por nombre o código de artículo...",
                      buscar: async texto => (await buscarArticulosCombinado(texto)).map(a => ({ ...a, id: a.ARTICULO })),
                      onSeleccionar: a => {
                        const costo = num(a.COSTO_PROM_DOL) > 0 ? num(a.COSTO_PROM_DOL) : num(a.COSTO_ULT_DOL);
                        setNuevaLinea({
                          ...nuevaLinea,
                          x_studio_descripcion: a.DESCRIPCION,
                          x_studio_sku: a.ARTICULO,
                          x_studio_costo_manual: costo,
                          x_studio_origen_costo: a.ORIGEN === "Exactus" ? "Inventario" : "Manual",
                          x_studio_unidad_medida: a.UNIDAD_ALMACEN || nuevaLinea.x_studio_unidad_medida,
                        });
                      },
                      renderItem: a => h(React.Fragment, null,
                        h("div", { style: { display:"flex", justifyContent:"space-between", gap:"8px" } },
                          h("span", null, a.DESCRIPCION),
                          h("span", { style: { fontSize:"9.5px", fontWeight:700, padding:"1px 6px", borderRadius:"8px", whiteSpace:"nowrap",
                              background: a.ORIGEN === "Exactus" ? (a.TIENE_EXISTENCIA ? "#D1FAE5" : "#FEF3C7") : "#E0E7FF",
                              color: a.ORIGEN === "Exactus" ? (a.TIENE_EXISTENCIA ? "#15803D" : "#B45309") : "#4338CA" } },
                            a.ORIGEN === "Exactus" ? (a.TIENE_EXISTENCIA ? "Exactus · en bodega" : "Exactus · sin existencia") : a.ORIGEN)
                        ),
                        h("div", { className: "sub" },
                          a.ARTICULO + " · " + moneda(num(a.COSTO_PROM_DOL) > 0 ? a.COSTO_PROM_DOL : a.COSTO_ULT_DOL) +
                          (a.UNIDAD_ALMACEN ? " / " + a.UNIDAD_ALMACEN : "")
                        )
                      ),
                    }),
                    h("button", {
                      className: "btn-agregar-articulo", type: "button", title: "¿No aparece? Crear artículo nuevo",
                      onClick: () => setModalArticuloNuevo(true),
                    }, "+", h("span", { className: "punto-notificacion" }))
                  )
              )
            : h("input", { type: "text", value: nuevaLinea.x_studio_descripcion, onChange: e => setNuevaLinea({ ...nuevaLinea, x_studio_descripcion: e.target.value }) })
        ),

        h("div", { className: "campo" },
          h("label", null, "UM"),
          h("input", { type: "text", value: nuevaLinea.x_studio_unidad_medida, onChange: e => setNuevaLinea({ ...nuevaLinea, x_studio_unidad_medida: e.target.value }) })
        ),
        h("div", { className: "campo" },
          h("label", null, "Cantidad"),
          h("input", { type: "number", step: "0.01", value: nuevaLinea.x_studio_cantidad_presupuestada, onChange: e => setNuevaLinea({ ...nuevaLinea, x_studio_cantidad_presupuestada: e.target.value }) })
        ),
        h("div", { className: "campo" },
          h("label", null, "Costo Unit."),
          h("input", { type: "number", step: "0.01", value: nuevaLinea.x_studio_costo_manual, onChange: e => setNuevaLinea({ ...nuevaLinea, x_studio_costo_manual: e.target.value }) })
        )
      ),
      h("div", { className: "modal-botones" },
        h("button", { className: "btn-secundario", onClick: () => setModalNuevaLinea(false), disabled: guardandoNueva }, "Cancelar"),
        h("button", { className: "btn-primario", onClick: agregarNuevaLinea, disabled: guardandoNueva || !nuevaLinea.x_studio_descripcion.trim() },
          guardandoNueva ? "Guardando..." : "+ Agregar")
      )
      )),

      h("div", { className: "totales-resumen" },
        h("div", { className: "totales-caja" },
          h("div", { className: "linea-total" }, h("span", null, "Materiales/Repuestos"), h("span", null, moneda(totales.subMateriales))),
          h("div", { className: "linea-total" }, h("span", null, "Mano de obra"), h("span", null, moneda(totales.subManoObra))),
          h("div", { className: "linea-total" }, h("span", null, "Servicios"), h("span", null, moneda(totales.subServicios))),
          h("div", { className: "linea-total" }, h("span", null, "Subtotal"), h("span", null, moneda(totales.subtotal)))
        ),
        h("div", { className: "totales-caja" },
          !soloLectura ? h(React.Fragment, null,
            h("div", { className: "campo", style: { marginBottom: "8px" } },
              h("label", null, "Descuento"),
              h("input", { type: "number", step: "0.01", value: presupuesto.x_studio_descuento || 0,
                onChange: e => setPresupuesto({ ...presupuesto, x_studio_descuento: e.target.value }) })
            ),
            h("div", { className: "campo", style: { marginBottom: "8px" } },
              h("label", null, "Impuestos"),
              h("input", { type: "number", step: "0.01", value: presupuesto.x_studio_impuestos || 0,
                onChange: e => setPresupuesto({ ...presupuesto, x_studio_impuestos: e.target.value }) })
            )
          ) : h(React.Fragment, null,
            h("div", { className: "linea-total" }, h("span", null, "Descuento"), h("span", null, "-" + moneda(totales.descuento))),
            h("div", { className: "linea-total" }, h("span", null, "Impuestos"), h("span", null, moneda(totales.impuestos)))
          ),
          h("div", { className: "linea-total grande" }, h("span", null, "TOTAL"), h("span", null, moneda(totales.total)))
        )
      ),

      error && h("div", { className: "mensaje-error" }, error),
      exito && h("div", { className: "mensaje-exito" }, exito),

      h("div", { className: "barra-botones", style: { marginTop: "16px", marginBottom: soloLectura ? "0" : "10px" } },
        h("button", { className: "btn-secundario", onClick: descargarPdf, disabled: generandoPdf || lineas.length === 0 },
          "⬇️ Descargar PDF"),
        h("button", { className: "btn-secundario", onClick: generarYCompartirPdf, disabled: generandoPdf || lineas.length === 0 },
          generandoPdf ? "Generando..." : "📤 Compartir PDF"),
        presupuesto.x_studio_estado !== "Aprobado" && h("button", { className: "btn-primario", onClick: generarLinkAprobacion, disabled: generandoLink || lineas.length === 0 },
          generandoLink ? "Generando link..." : "🔗 Enviar a cliente para aprobar")
      ),

      !soloLectura && h("div", { className: "barra-botones" },
        h("button", { className: "btn-secundario", onClick: async () => {
            const resp = await tallerActualizar("x_taller_presupuesto", presupuestoId, {
              x_studio_descuento: num(presupuesto.x_studio_descuento), x_studio_impuestos: num(presupuesto.x_studio_impuestos),
              x_studio_total_presupuesto: totales.total, x_studio_subtotal_materiales: totales.subMateriales,
              x_studio_subtotal_mano_obra: totales.subManoObra, x_studio_subtotal_servicios: totales.subServicios,
            });
            if (resp.ok) setExito("Totales guardados."); else setError(resp.error || "No se pudo guardar.");
          } }, "💾 Guardar totales"),
        h("button", { className: "btn-peligro", onClick: () => setModalRechazar(true), disabled: lineas.length === 0 }, "❌ Rechazar"),
        h("button", { className: "btn-primario", onClick: () => setModalAprobar(true), disabled: lineas.length === 0 }, "✅ Marcar como Aprobado")
      )
    ),

    modalAprobar && h("div", { className: "modal-fondo", onClick: () => setModalAprobar(false) },
      h("div", { className: "modal", onClick: e => e.stopPropagation() },
        h("h3", null, "Aprobar presupuesto"),
        h("div", { className: "campo" },
          h("label", null, "Nombre de quien aprueba (cliente)"),
          h("input", { type: "text", value: nombreAprobador, autoFocus: true, onChange: e => setNombreAprobador(e.target.value) })
        ),
        h("div", { className: "mensaje-error", style: { background:"var(--color-alerta-suave)", borderColor:"var(--color-alerta)", color:"#92400E" } },
          "Total a aprobar: " + moneda(totales.total) + ". Una vez aprobado, este presupuesto queda bloqueado para edición."
        ),
        error && h("div", { className: "mensaje-error" }, error),
        h("div", { className: "modal-botones" },
          h("button", { className: "btn-secundario", onClick: () => setModalAprobar(false), disabled: aprobando }, "Cancelar"),
          h("button", { className: "btn-primario", onClick: confirmarAprobacion, disabled: aprobando }, aprobando ? "Guardando..." : "Confirmar aprobación")
        )
      )
    ),

    modalRechazar && h("div", { className: "modal-fondo", onClick: () => setModalRechazar(false) },
      h("div", { className: "modal", onClick: e => e.stopPropagation() },
        h("h3", null, "❌ Rechazar presupuesto"),
        h("div", { className: "campo", style: { marginBottom: "0" } },
          h("label", null, "Motivo del cliente"),
          h("textarea", { value: motivoRechazo, autoFocus: true, rows: 3, onChange: e => setMotivoRechazo(e.target.value) })
        ),
        h("div", { className: "mensaje-error", style: { background:"var(--color-alerta-suave)", borderColor:"var(--color-alerta)", color:"#92400E" } },
          "La orden " + (orden ? orden.x_name : "") + " va a pasar a estado Rechazada. Desde Cierres vas a poder cerrarla cobrando solo el diagnóstico, sin reparar el equipo."
        ),
        error && h("div", { className: "mensaje-error" }, error),
        h("div", { className: "modal-botones" },
          h("button", { className: "btn-secundario", onClick: () => setModalRechazar(false), disabled: aprobando }, "Cancelar"),
          h("button", { className: "btn-peligro", onClick: confirmarRechazo, disabled: aprobando }, aprobando ? "Guardando..." : "Confirmar rechazo")
        )
      )
    ),

    modalArticuloNuevo && h(ModalArticuloNuevo, {
      textoInicial: nuevaLinea.x_studio_descripcion,
      onCerrar: () => setModalArticuloNuevo(false),
      onCreado: a => {
        setNuevaLinea({
          ...nuevaLinea,
          x_studio_descripcion: a.DESCRIPCION,
          x_studio_sku: a.ARTICULO,
          x_studio_costo_manual: a.COSTO_PROM_DOL,
          x_studio_origen_costo: "Manual",
          x_studio_unidad_medida: a.UNIDAD_ALMACEN || nuevaLinea.x_studio_unidad_medida,
        });
        setModalArticuloNuevo(false);
      },
    })
  );
}

function Presupuestos(){
  const [sesion, setSesion] = useState(null);
  const [presupuestos, setPresupuestos] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [errorCarga, setErrorCarga] = useState("");
  const [modalNuevo, setModalNuevo] = useState(false);
  const [presupuestoAbierto, setPresupuestoAbierto] = useState(null);

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargarLista(); }
  }, []);

  async function cargarLista(){
    setCargando(true); setErrorCarga("");
    try {
      const filas = await tallerQuery("x_taller_presupuesto", [
        "id","x_name","x_studio_orden_id","x_studio_version","x_studio_estado",
        "x_studio_fecha_presupuesto","x_studio_total_presupuesto","x_studio_elaborado_por",
      ], [], 1000);

      // x_studio_equipo_id vive en la orden, no en el presupuesto — se trae aparte y se une.
      const idsOrdenes = [...new Set(filas.filter(f => Array.isArray(f.x_studio_orden_id)).map(f => f.x_studio_orden_id[0]))];
      let equipoPorOrden = {};
      if (idsOrdenes.length) {
        const ordenesRows = await tallerQuery("x_taller_orden", ["id","x_studio_equipo_id"], [["id","in",idsOrdenes]], idsOrdenes.length);
        ordenesRows.forEach(o => { equipoPorOrden[o.id] = o.x_studio_equipo_id; });
      }
      const filasConEquipo = filas.map(f => ({
        ...f,
        x_studio_equipo_id: Array.isArray(f.x_studio_orden_id) ? (equipoPorOrden[f.x_studio_orden_id[0]] || false) : false,
      }));

      setPresupuestos(filasConEquipo);
    } catch(e) {
      setErrorCarga("No se pudieron cargar los presupuestos: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  if (!sesion) return null;

  if (presupuestoAbierto) {
    return h(DetallePresupuesto, { presupuestoId: presupuestoAbierto, onVolver: () => { setPresupuestoAbierto(null); cargarLista(); } });
  }

  const columnas = [
    { clave: "x_name", titulo: "Cotización" },
    { clave: "x_studio_orden_id", titulo: "Orden" },
    { clave: "x_studio_equipo_id", titulo: "Equipo" },
    { clave: "x_studio_version", titulo: "Versión" },
    { clave: "x_studio_estado", titulo: "Estado" },
    { clave: "x_studio_total_presupuesto", titulo: "Total", formatear: moneda },
    { clave: "x_studio_fecha_presupuesto", titulo: "Fecha", formatear: formatearFecha },
    { clave: "x_studio_elaborado_por", titulo: "Elaborado por" },
  ];

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "💵 Presupuestos"),
      h("div", { className: "barra-botones" },
        h("button", { className: "btn-refrescar", onClick: cargarLista }, "↻ Refrescar"),
        h("button", { className: "btn-primario", onClick: () => setModalNuevo(true) }, "+ Nuevo Presupuesto")
      )
    ),
    h("div", { className: "panel" },
      cargando
        ? h("div", { className: "cargando" }, "Cargando...")
        : errorCarga
          ? h("div", { className: "error-carga" }, errorCarga)
          : TablaInfoAgro(h, { columnas, filas: presupuestos || [], onFilaClick: p => setPresupuestoAbierto(p.id) })
    ),
    modalNuevo && h(ModalNuevoPresupuesto, {
      onCerrar: () => setModalNuevo(false),
      onCreado: id => { setModalNuevo(false); setPresupuestoAbierto(id); },
    })
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Presupuestos));
</script>
</body>
</html>

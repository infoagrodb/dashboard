<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abriendo presupuesto…</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1e293b;
  }
  .caja {
    text-align: center;
    padding: 28px 32px;
    max-width: 360px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 4px solid #cbd5e1;
    border-top-color: #1e293b;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  p { margin: 4px 0; font-size: 0.95rem; }
  .error { color: #b91c1c; display: none; }
  .error a { color: #1e293b; }
</style>
</head>
<body>
  <div class="caja">
    <div class="spinner" id="spinner"></div>
    <p id="mensaje">Abriendo presupuesto…</p>
    <p class="error" id="error">
      El link no es válido o ya venció.<br>
      Pedí que te compartan el link nuevamente.
    </p>
  </div>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const codigo = params.get('c');
      const elMensaje = document.getElementById('mensaje');
      const elError = document.getElementById('error');
      const elSpinner = document.getElementById('spinner');

      function mostrarError() {
        elSpinner.style.display = 'none';
        elMensaje.style.display = 'none';
        elError.style.display = 'block';
      }

      if (!codigo) { mostrarError(); return; }

      try {
        const resp = await fetch(
          'https://weathered-recipe-d18c.ignagher.workers.dev/taller/presupuesto/resolver-link?code=' + encodeURIComponent(codigo)
        );
        const datos = await resp.json();
        if (datos && datos.ok && datos.url) {
          location.replace(datos.url);
        } else {
          mostrarError();
        }
      } catch (e) {
        mostrarError();
      }
    })();
  </script>
</body>
</html>

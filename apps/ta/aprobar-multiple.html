<script>
const h = React.createElement;
const WORKER_BASE = "https://weathered-recipe-d18c.ignagher.workers.dev";

function moneda(v) {
  v = Number(v) || 0;
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatearFecha(f) {
  if (!f) return "—";
  try {
    const d = new Date(f.replace(" ", "T") + (f.length <= 10 ? "" : "Z"));
    if (isNaN(d.getTime())) return f;
    const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return String(d.getDate()).padStart(2, "0") + "-" + meses[d.getMonth()] + "-" + String(d.getFullYear()).slice(-2);
  } catch(e) { return f; }
}
function campoM2O(v) { return Array.isArray(v) ? v[1] : "—"; }

function precioLinea(l) {
  const precio = l.x_studio_precio_venta_unitario || l.x_studio_costo_manual;
  const total = l.x_studio_total_venta_presupuestada || (Number(l.x_studio_cantidad_presupuestada) || 0) * (Number(precio) || 0);
  return { precio: Number(precio) || 0, total: Number(total) || 0 };
}
function totalLineas(lineas) {
  return (lineas || []).reduce((acc, l) => acc + precioLinea(l).total, 0);
}

function PizarronFirma({ onCambio }) {
  const ref = React.useRef(null);
  const dibujando = React.useRef(false);

  function posicion(e, canvas) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - rect.left) * (canvas.width / rect.width), y: (p.clientY - rect.top) * (canvas.height / rect.height) };
  }
  function iniciar(e) {
    e.preventDefault();
    dibujando.current = true;
    const canvas = ref.current, ctx = canvas.getContext("2d");
    const { x, y } = posicion(e, canvas);
    ctx.beginPath(); ctx.moveTo(x, y);
  }
  function mover(e) {
    if (!dibujando.current) return;
    e.preventDefault();
    const canvas = ref.current, ctx = canvas.getContext("2d");
    const { x, y } = posicion(e, canvas);
    ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#111827";
    ctx.lineTo(x, y); ctx.stroke();
    onCambio(ref.current.toDataURL("image/png"), false);
  }
  function soltar() { dibujando.current = false; }
  function limpiar() {
    const canvas = ref.current, ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    onCambio(null, true);
  }

  return h("div", null,
    h("canvas", {
      ref, className: "firma", width: 420, height: 140,
      onMouseDown: iniciar, onMouseMove: mover, onMouseUp: soltar, onMouseLeave: soltar,
      onTouchStart: iniciar, onTouchMove: mover, onTouchEnd: soltar
    }),
    h("button", { type: "button", className: "btn-limpiar-firma", onClick: limpiar }, "Borrar firma")
  );
}

function TarjetaPresupuesto({ datos, estado, procesando, onAprobar, onRechazar }) {
  const { useState } = React;
  const [error, setError] = useState("");
  const [mostrarRechazo, setMostrarRechazo] = useState(false);
  const [comentario, setComentario] = useState("");

  const p = datos.presupuesto;
  const orden = datos.orden;
  const lineas = datos.lineas || [];
  const totalPresupuesto = totalLineas(lineas);

  const yaDecidido = estado === "Aprobado" || estado === "Rechazado";

  async function rechazar() {
    if (!comentario.trim()) { setError("Escribe un comentario explicando el motivo del rechazo."); return; }
    setError("");
    const r = await onRechazar(datos.id, comentario.trim());
    if (!r || !r.ok) setError((r && r.error) || "No se pudo rechazar.");
  }

  const claseBadge = estado === "Aprobado" ? "badge-aprobado" : estado === "Rechazado" ? "badge-rechazado" : "badge-enviado";
  const ocupado = procesando;

  return h("div", { className: "tarjeta-presupuesto" },
    h("div", { className: "cab-presupuesto" },
      h("div", null,
        h("h2", null, p.x_name, h("span", { className: "badge-estado " + claseBadge }, estado)),
        h("div", { className: "cab-datos" },
          h("span", null, h("b", null, "Fecha Ppto: "), formatearFecha(p.x_studio_fecha_presupuesto)),
          h("span", null, h("b", null, "Equipo: "), orden ? campoM2O(orden.x_studio_equipo_id) : "—"),
          h("span", null, h("b", null, "Horas motor: "), (orden && orden.x_studio_horometro_recepcion) ? orden.x_studio_horometro_recepcion : "—"),
          h("span", null, h("b", null, "Tipo mantenimiento: "), (orden && orden.x_studio_tipo_mantenimiento_id) ? campoM2O(orden.x_studio_tipo_mantenimiento_id) : "—")
        )
      ),
      !yaDecidido && h("div", { className: "acciones-presupuesto" },
        h("button", { className: "btn btn-rechazar", disabled: ocupado, onClick: () => setMostrarRechazo(v => !v) }, "Rechazar"),
        h("button", { className: "btn btn-aprobar", disabled: ocupado, onClick: () => onAprobar(datos.id) }, procesando ? "Procesando..." : "✓ Aprobar este presupuesto")
      )
    ),
    h("div", { className: "tabla-lineas-wrap" },
      h("table", { className: "tabla-lineas" },
        h("thead", null, h("tr", null,
          h("th", null, "Línea"), h("th", null, "Artículo"),
          h("th", null, "Cantidad"), h("th", null, "Precio Unitario"), h("th", null, "Total")
        )),
        h("tbody", null,
          lineas.length ? lineas.map((l, i) => {
            const { precio, total } = precioLinea(l);
            return h("tr", { key: i },
              h("td", null, i + 1),
              h("td", null, l.x_studio_descripcion || "—"),
              h("td", null, (l.x_studio_cantidad_presupuestada || 0) + " " + (l.x_studio_unidad_medida || "")),
              h("td", null, moneda(precio)),
              h("td", null, moneda(total))
            );
          }) : h("tr", null, h("td", { colSpan: 5, style: { textAlign: "center", color: "#9ca3af" } }, "(Sin líneas)"))
        )
      )
    ),
    h("div", { className: "total-presupuesto" }, "Total: " + moneda(totalPresupuesto)),
    mostrarRechazo && !yaDecidido && h("div", { className: "caja-rechazo" },
      h("textarea", { placeholder: "Motivo del rechazo (obligatorio)...", value: comentario, onChange: e => setComentario(e.target.value) }),
      h("div", { style: { marginTop: "8px", textAlign: "right" } },
        h("button", { className: "btn btn-rechazar", disabled: ocupado, onClick: rechazar }, ocupado ? "Procesando..." : "Confirmar rechazo")
      )
    ),
    error && h("div", { className: "mensaje-error", style: { padding: "0 16px 12px" } }, error)
  );
}

function construirFilasDetalle(datos) {
  const filas = [];
  const gruposMeta = {};
  const ordenGrupos = [];
  datos.filter(d => !d.error).forEach(d => {
    const p = d.presupuesto, orden = d.orden, lineas = d.lineas || [];
    const equipo = orden ? campoM2O(orden.x_studio_equipo_id) : "—";
    const tipoMant = (orden && orden.x_studio_tipo_mantenimiento_id) ? campoM2O(orden.x_studio_tipo_mantenimiento_id) : "—";
    const horas = (orden && orden.x_studio_horometro_recepcion) ? orden.x_studio_horometro_recepcion : "—";
    const fecha = formatearFecha(p.x_studio_fecha_presupuesto);
    ordenGrupos.push(d.id);
    gruposMeta[d.id] = { equipo, estadoInicial: p.x_studio_estado };
    lineas.forEach((l, i) => {
      const { precio, total } = precioLinea(l);
      const cant = Number(l.x_studio_cantidad_presupuestada) || 0;
      filas.push({
        grupoId: d.id, cotizacion: p.x_name, fecha, tipoMant, equipo, horas,
        linea: i + 1, descripcion: l.x_studio_descripcion || "—", um: l.x_studio_unidad_medida || "",
        cantidad: cant, precio, total
      });
    });
  });
  return { filas, gruposMeta, ordenGrupos };
}

const COLUMNAS_DETALLE = [
  { key: "linea", label: "Línea", valor: f => String(f.linea) },
  { key: "cotizacion", label: "Cotización", valor: f => f.cotizacion, sticky: 1 },
  { key: "fecha", label: "Fecha", valor: f => f.fecha, sticky: 2 },
  { key: "tipoMant", label: "Tipo mantenimiento", valor: f => f.tipoMant, sticky: 3, claseExtra: "col-tipomant" },
  { key: "equipo", label: "Equipo", valor: f => f.equipo, sticky: 4 },
  { key: "horas", label: "Horas Motor", valor: f => String(f.horas) },
  { key: "descripcion", label: "Descripción Art/Serv", valor: f => f.descripcion, claseExtra: "col-descripcion" },
  { key: "um", label: "UM", valor: f => f.um },
  { key: "cantidad", label: "Cantidad", valor: f => Number(f.cantidad).toFixed(2), num: true },
  { key: "precio", label: "Unit US$", valor: f => moneda(f.precio), num: true },
  { key: "total", label: "Total US$", valor: f => moneda(f.total), num: true }
];

const ANCHOS_DEFECTO_DETALLE = {
  linea: 35, cotizacion: 105, fecha: 85, tipoMant: 85, equipo: 100,
  horas: 70, descripcion: 240, um: 55,
  cantidad: 65, precio: 85, total: 95
};

function claseColumna(c) {
  return (c.num ? "num " : "") + (c.sticky ? "sticky-col sticky-col-" + c.sticky + " " : "") + (c.claseExtra ? c.claseExtra : "");
}

function estiloSticky(c, leftPorColumna) {
  if (!c.sticky || leftPorColumna[c.key] === undefined) return undefined;
  return { left: leftPorColumna[c.key] + "px" };
}

// Arrastre manual del ancho de columna: no usa estado/React para el movimiento en sí
// (evita re-renders en cada pixel), solo llama onResize(key, delta) que el padre aplica.
function iniciarRedimensionColumna(e, key, onResize) {
  e.preventDefault(); e.stopPropagation();
  let x = e.clientX;
  function mover(ev) {
    const delta = ev.clientX - x;
    x = ev.clientX;
    onResize(key, delta);
  }
  function soltar() {
    window.removeEventListener("mousemove", mover);
    window.removeEventListener("mouseup", soltar);
  }
  window.addEventListener("mousemove", mover);
  window.addEventListener("mouseup", soltar);
}

function FiltroColumna({ valores, seleccion, onCambiar }) {
  const { useState, useRef, useEffect, useLayoutEffect } = React;
  const [abierto, setAbierto] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [pos, setPos] = useState({ top: 0, left: 0 });
  const refBoton = useRef(null);
  const refPop = useRef(null);

  // El popover usa position:fixed con coordenadas calculadas en JS (en vez de absolute
  // dentro del th) porque .tabla-detalle-wrap tiene overflow-x:auto, y eso recorta
  // cualquier hijo absolutamente posicionado que se salga del área visible — la caja
  // del filtro se cortaba. Con fixed, se posiciona respecto a la ventana y no se recorta.
  useLayoutEffect(() => {
    if (!abierto || !refBoton.current) return;
    const r = refBoton.current.getBoundingClientRect();
    const anchoPopover = 190;
    let left = r.left;
    if (left + anchoPopover > window.innerWidth - 8) left = window.innerWidth - anchoPopover - 8;
    if (left < 8) left = 8;
    let top = r.bottom + 2;
    const altoEstimado = 240;
    if (top + altoEstimado > window.innerHeight - 8) top = Math.max(8, r.top - altoEstimado - 2);
    setPos({ top, left });
  }, [abierto]);

  useEffect(() => {
    if (!abierto) return;
    function fuera(e) {
      if (refBoton.current && refBoton.current.contains(e.target)) return;
      if (refPop.current && refPop.current.contains(e.target)) return;
      setAbierto(false);
    }
    function cerrarAlScroll() { setAbierto(false); }
    document.addEventListener("mousedown", fuera);
    window.addEventListener("scroll", cerrarAlScroll, true);
    window.addEventListener("resize", cerrarAlScroll);
    return () => {
      document.removeEventListener("mousedown", fuera);
      window.removeEventListener("scroll", cerrarAlScroll, true);
      window.removeEventListener("resize", cerrarAlScroll);
    };
  }, [abierto]);

  const activo = seleccion != null;
  const todasMarcadas = seleccion == null;
  const filtradas = valores.filter(v => v.toLowerCase().includes(busqueda.toLowerCase()));

  function toggleValor(v) {
    const actual = seleccion && seleccion.size > 0 ? new Set(seleccion) : new Set(valores);
    if (actual.has(v)) actual.delete(v); else actual.add(v);
    onCambiar(actual.size === valores.length ? null : actual);
  }

  return h("span", null,
    h("button", {
      ref: refBoton, type: "button", className: "btn-filtro-col" + (activo ? " activo" : ""),
      onClick: (e) => { e.stopPropagation(); setAbierto(v => !v); }
    }, "⇅"),
    abierto && h("div", {
      ref: refPop, className: "popover-filtro", onClick: e => e.stopPropagation(),
      style: { position: "fixed", top: pos.top + "px", left: pos.left + "px" }
    },
      h("input", { type: "text", placeholder: "Buscar...", value: busqueda, onChange: e => setBusqueda(e.target.value), className: "input-filtro-busqueda" }),
      h("div", { className: "acciones-filtro" },
        h("a", { onClick: () => onCambiar(null) }, "Todos"),
        h("a", { onClick: () => onCambiar(new Set()) }, "Ninguno")
      ),
      h("div", { className: "lista-filtro" },
        filtradas.map(v => h("label", { key: v, className: "item-filtro" },
          h("input", { type: "checkbox", checked: todasMarcadas ? true : seleccion.has(v), onChange: () => toggleValor(v) }),
          h("span", null, v || "(vacío)")
        ))
      )
    )
  );
}

function FilaGrupoDetalle({ grupo, est, ocupado, onAprobar, onRechazar, leftPorColumna }) {
  const { useState } = React;
  const [mostrarRechazo, setMostrarRechazo] = useState(false);
  const [comentario, setComentario] = useState("");
  const [error, setError] = useState("");

  const yaDecidido = est === "Aprobado" || est === "Rechazado";

  async function confirmarRechazo() {
    if (!comentario.trim()) { setError("Escribe un comentario explicando el motivo del rechazo."); return; }
    setError("");
    const r = await onRechazar(grupo.id, comentario.trim());
    if (!r || !r.ok) setError((r && r.error) || "No se pudo rechazar.");
  }

  const filasLinea = grupo.filasLinea.map((f, i) => h("tr", { key: grupo.id + "-" + i },
    COLUMNAS_DETALLE.map(c => h("td", { key: c.key, className: claseColumna(c), style: estiloSticky(c, leftPorColumna) }, c.valor(f)))
  ));

  // Barra de subtotal: primero los botones de acción, luego la etiqueta "Total <equipo>"
  // (en una celda que ocupa todas las columnas excepto Total US$), y el monto va aparte,
  // alineado debajo de su propia columna Total US$ — igual que las filas de línea normales.
  const filaSubtotal = h("tr", { className: "fila-subtotal", key: grupo.id + "-sub" },
    h("td", { colSpan: COLUMNAS_DETALLE.length - 1 },
      h("div", { className: "barra-subtotal" },
        yaDecidido
          ? h("span", { className: "badge-estado " + (est === "Aprobado" ? "badge-aprobado" : "badge-rechazado") }, est)
          : h("span", { className: "acciones-subtotal" },
              h("button", { className: "btn-aprobar-mini", disabled: ocupado, onClick: () => onAprobar(grupo.id) }, ocupado ? "..." : "✓ Aprobar"),
              h("button", { className: "btn-rechazar-mini", disabled: ocupado, onClick: () => setMostrarRechazo(v => !v) }, "✕ Rechazar")
            ),
        h("span", { className: "etiqueta-subtotal" }, "Total " + grupo.equipo)
      )
    ),
    h("td", { className: "num monto-subtotal" }, moneda(grupo.subTotal))
  );

  const filaRechazo = mostrarRechazo && !yaDecidido && h("tr", { key: grupo.id + "-rechazo" },
    h("td", { colSpan: COLUMNAS_DETALLE.length, style: { background: "#fef2f2", padding: "10px" } },
      h("textarea", { className: "textarea-rechazo-tabla", placeholder: "Motivo del rechazo (obligatorio)...", value: comentario, onChange: e => setComentario(e.target.value) }),
      h("div", { style: { marginTop: "6px", textAlign: "right" } },
        h("button", { className: "btn btn-rechazar", disabled: ocupado, onClick: confirmarRechazo }, ocupado ? "Procesando..." : "Confirmar rechazo")
      ),
      error && h("div", { className: "mensaje-error" }, error)
    )
  );

  return h(React.Fragment, { key: grupo.id }, filasLinea, filaSubtotal, filaRechazo);
}

function TablaDetallada({ datos, estados, procesandoId, onAprobar, onRechazar }) {
  const { useState, useMemo, useEffect } = React;
  const [filtros, setFiltros] = useState({});
  const [anchos, setAnchos] = useState({});
  const [esMovil, setEsMovil] = useState(window.innerWidth <= 640);
  const { filas, gruposMeta, ordenGrupos } = useMemo(() => construirFilasDetalle(datos), [datos]);

  useEffect(() => {
    function alRedimensionar() { setEsMovil(window.innerWidth <= 640); }
    window.addEventListener("resize", alRedimensionar);
    return () => window.removeEventListener("resize", alRedimensionar);
  }, []);

  const anchosFinal = {};
  COLUMNAS_DETALLE.forEach(c => { anchosFinal[c.key] = anchos[c.key] || ANCHOS_DEFECTO_DETALLE[c.key]; });

  // Offset "left" de cada columna congelada, recalculado según los anchos actuales
  // (incluyendo los que el usuario haya arrastrado) y según si estamos en celular
  // (ahí solo Cotización y Equipo quedan realmente congeladas — ver media query).
  const leftPorColumna = {};
  let acumuladoIzq = 0;
  COLUMNAS_DETALLE.forEach(c => {
    if (!c.sticky) return;
    const sigueFijo = !esMovil || c.sticky === 1 || c.sticky === 4;
    if (sigueFijo) {
      leftPorColumna[c.key] = acumuladoIzq;
      acumuladoIzq += anchosFinal[c.key];
    }
  });

  function cambiarAncho(key, delta) {
    setAnchos(prev => {
      const actual = prev[key] || ANCHOS_DEFECTO_DETALLE[key];
      return { ...prev, [key]: Math.max(50, actual + delta) };
    });
  }

  const valoresUnicos = {};
  COLUMNAS_DETALLE.forEach(c => {
    const set = new Set();
    filas.forEach(f => set.add(c.valor(f)));
    valoresUnicos[c.key] = Array.from(set).sort();
  });

  const filasFiltradas = filas.filter(f => COLUMNAS_DETALLE.every(c => {
    const sel = filtros[c.key];
    if (sel === undefined) return true;
    return sel.has(c.valor(f));
  }));

  const grupos = ordenGrupos.map(id => {
    const propias = filasFiltradas.filter(f => f.grupoId === id);
    if (!propias.length) return null;
    const subTotal = propias.reduce((acc, f) => acc + f.total, 0);
    return { id, equipo: gruposMeta[id].equipo, filasLinea: propias, subTotal };
  }).filter(Boolean);

  const totTotal = grupos.reduce((acc, g) => acc + g.subTotal, 0);

  function cambiarFiltro(key, seleccion) {
    setFiltros(prev => {
      const copia = { ...prev };
      if (!seleccion) delete copia[key]; else copia[key] = seleccion;
      return copia;
    });
  }

  function exportarExcel() {
    const idxEtiqueta = COLUMNAS_DETALLE.findIndex(c => c.key === "equipo");
    const filasX = [COLUMNAS_DETALLE.map(c => c.label)];
    grupos.forEach(g => {
      g.filasLinea.forEach(f => {
        filasX.push(COLUMNAS_DETALLE.map(c => (c.key === "cantidad" || c.key === "precio" || c.key === "total") ? f[c.key] : c.valor(f)));
      });
      filasX.push(COLUMNAS_DETALLE.map((c, i) => i === idxEtiqueta ? ("Total " + g.equipo) : (c.key === "total" ? g.subTotal : "")));
    });
    filasX.push(COLUMNAS_DETALLE.map((c, i) => i === idxEtiqueta ? "Total General" : (c.key === "total" ? totTotal : "")));
    const ws = XLSX.utils.aoa_to_sheet(filasX);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Presupuestos");
    XLSX.writeFile(wb, "Presupuestos_aprobacion_" + new Date().toISOString().slice(0, 10) + ".xlsx");
  }

  return h("div", null,
    h("div", { className: "fila-controles-tabla" },
      h("div", null, "Detalle de todas las cotizaciones de este link"),
      h("button", { className: "btn-exportar", onClick: exportarExcel }, "📥 Exportar Excel")
    ),
    h("div", { className: "tabla-detalle-wrap" },
      h("table", { className: "tabla-detalle" },
        h("colgroup", null, COLUMNAS_DETALLE.map(c => h("col", { key: c.key, style: { width: anchosFinal[c.key] + "px" } }))),
        h("thead", null, h("tr", null,
          COLUMNAS_DETALLE.map(c => h("th", { key: c.key, className: claseColumna(c), style: estiloSticky(c, leftPorColumna) },
            h("div", { className: "th-contenido" },
              h("span", null, c.label),
              h(FiltroColumna, { valores: valoresUnicos[c.key], seleccion: filtros[c.key], onCambiar: (sel) => cambiarFiltro(c.key, sel) })
            ),
            h("span", { className: "manija-resize", onMouseDown: (e) => iniciarRedimensionColumna(e, c.key, cambiarAncho) })
          ))
        )),
        h("tbody", null,
          grupos.map(g => h(FilaGrupoDetalle, {
            key: g.id, grupo: g, est: estados[g.id] || gruposMeta[g.id].estadoInicial,
            ocupado: procesandoId === g.id, onAprobar, onRechazar, leftPorColumna
          })),
          h("tr", { className: "fila-total-general" },
            h("td", { colSpan: COLUMNAS_DETALLE.length - 1 },
              h("div", { className: "barra-total-general" },
                h("span", null, "Total General")
              )
            ),
            h("td", { className: "num monto-subtotal" }, moneda(totTotal))
          )
        )
      )
    )
  );
}

function AprobarMultiple() {
  const { useState, useEffect } = React;
  const [datos, setDatos] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [nombreFirma, setNombreFirma] = useState("");
  const [firmaBase64, setFirmaBase64] = useState(null);
  const [estados, setEstados] = useState({});
  const [procesandoId, setProcesandoId] = useState(null);
  const [errorAprobar, setErrorAprobar] = useState("");
  const [mostrarTabla, setMostrarTabla] = useState(false);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get("items") || "";
    const parsed = raw.split(",").filter(Boolean).map(par => {
      const [id, token] = par.split(":");
      return { id: parseInt(id), token };
    }).filter(it => it.id && it.token);
    if (!parsed.length) { setError("Link inválido: no se especificaron presupuestos."); setCargando(false); return; }
    cargarTodos(parsed);
  }, []);

  async function cargarTodos(lista) {
    setCargando(true); setError("");
    try {
      const resultados = await Promise.all(lista.map(async it => {
        const res = await fetch(WORKER_BASE + "/taller/presupuesto/publico?id=" + it.id + "&token=" + encodeURIComponent(it.token));
        const data = await res.json();
        if (!data.ok) return { id: it.id, token: it.token, error: data.error || "No se pudo cargar" };
        return { id: it.id, token: it.token, presupuesto: data.presupuesto, lineas: data.lineas, orden: data.orden };
      }));
      setDatos(resultados);
    } catch(e) {
      setError("Error al cargar los presupuestos: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  async function aprobarPresupuesto(id) {
    if (!nombreFirma || !nombreFirma.trim()) { setErrorAprobar("Escribe tu nombre completo arriba antes de aprobar."); return; }
    if (!firmaBase64) { setErrorAprobar("Dibuja tu firma arriba antes de aprobar."); return; }
    const item = (datos || []).find(d => d.id === id);
    if (!item || item.error) return;
    setProcesandoId(id); setErrorAprobar("");
    try {
      const res = await fetch(WORKER_BASE + "/taller/presupuesto/aprobar-publico", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id, token: item.token, aprobado_por: nombreFirma.trim(), firma_base64: firmaBase64 })
      });
      const data = await res.json();
      if (!data.ok) { setErrorAprobar(data.error || "No se pudo aprobar."); setProcesandoId(null); return; }
      setEstados(prev => ({ ...prev, [id]: "Aprobado" }));
    } catch(e) {
      setErrorAprobar("Error: " + e.message);
    } finally {
      setProcesandoId(null);
    }
  }

  async function rechazarPresupuesto(id, comentario) {
    const item = (datos || []).find(d => d.id === id);
    if (!item || item.error) return { ok: false, error: "No encontrado." };
    setProcesandoId(id);
    try {
      const res = await fetch(WORKER_BASE + "/taller/presupuesto/rechazar-publico", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: item.id, token: item.token, comentario })
      });
      const data = await res.json();
      if (!data.ok) return { ok: false, error: data.error || "No se pudo rechazar." };
      setEstados(prev => ({ ...prev, [id]: "Rechazado" }));
      return { ok: true };
    } catch(e) {
      return { ok: false, error: "Error: " + e.message };
    } finally {
      setProcesandoId(null);
    }
  }

  if (cargando) return h("div", { className: "cargando-pagina" }, "Cargando presupuestos...");
  if (error) return h("div", { className: "contenedor" }, h("div", { className: "mensaje-error", style: { fontSize: "1rem", padding: "40px 0", textAlign: "center" } }, error));

  let clienteNombre = "";
  for (const d of datos) { if (d.orden && Array.isArray(d.orden.x_studio_cliente_id)) { clienteNombre = d.orden.x_studio_cliente_id[1]; break; } }

  return h("div", { className: "contenedor", style: mostrarTabla ? { maxWidth: "100%" } : undefined },
    h("h1", null, "Aprobación de Presupuestos"),
    h("div", { className: "subt" }, (clienteNombre ? clienteNombre + " — " : "") + datos.length + " presupuesto(s) para tu revisión. Revisa cada uno y apruébalo o recházalo de forma individual."),
    h("div", { style: { textAlign: "right", marginBottom: mostrarTabla ? "0" : "20px" } },
      h("button", { className: "btn-tabla", onClick: () => setMostrarTabla(v => !v) }, mostrarTabla ? "Ocultar tabla" : "📊 Ver en formato de tabla")
    ),
    mostrarTabla && h(TablaDetallada, { datos, estados, procesandoId, onAprobar: aprobarPresupuesto, onRechazar: rechazarPresupuesto }),
    !mostrarTabla && datos.map(d => d.error
      ? h("div", { className: "tarjeta-presupuesto", key: d.id }, h("div", { style: { padding: "16px", color: "#b91c1c" } }, "Presupuesto #" + d.id + ": " + d.error))
      : h(TarjetaPresupuesto, {
          key: d.id, datos: d,
          estado: estados[d.id] || d.presupuesto.x_studio_estado,
          procesando: procesandoId === d.id,
          onAprobar: aprobarPresupuesto,
          onRechazar: rechazarPresupuesto
        })
    ),
    h("div", { className: "panel-firma" },
      h("label", null, "Tu nombre completo (se usa para aprobar cualquiera de los presupuestos de arriba)"),
      h("input", { type: "text", value: nombreFirma, onChange: e => setNombreFirma(e.target.value), placeholder: "Nombre y apellido" }),
      h("label", null, "Tu firma"),
      h(PizarronFirma, { onCambio: (data, vacio) => setFirmaBase64(vacio ? null : data) }),
      errorAprobar && h("div", { className: "mensaje-error", style: { marginTop: "8px" } }, errorAprobar)
    )
  );
}

const nodoRaiz = document.getElementById("root");
if (ReactDOM.createRoot) {
  ReactDOM.createRoot(nodoRaiz).render(h(AprobarMultiple));
} else {
  ReactDOM.render(h(AprobarMultiple), nodoRaiz);
}
</script>
</body>

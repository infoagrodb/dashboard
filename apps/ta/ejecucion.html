<!DOCTYPE html>

<head>

<title>Infotaller — Ejecución del Trabajo</title>
<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>
<script src="core.js?v=5"></script>
<link rel="stylesheet" href="core.css?v=2">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626; --color-peligro-suave:#FEE2E2;
    --color-alerta:#D97706; --color-alerta-suave:#FEF3C7;
    --radio:10px; --sombra:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--color-fondo); color:var(--color-texto); font-size:13.5px;}
  .barra-superior{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .barra-superior h1{font-size:15px; margin:0;}
  .link-volver{background:none; border:none; color:var(--color-primario-oscuro); font-size:13px; cursor:pointer; padding:0; text-decoration:underline; margin-bottom:10px;}
  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px; margin-bottom:14px;}
  .panel h2{font-size:13.5px; margin:0 0 12px; display:flex; align-items:center; gap:6px;}
  .cargando, .error-carga, .buscador-vacio{text-align:center; padding:20px; color:var(--color-texto-suave);}

  .comparativo{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px;}
  .caja-comparativo{background:#F8FAFC; border-radius:8px; padding:14px; text-align:center;}
  .caja-comparativo .etiqueta{font-size:10.5px; text-transform:uppercase; color:var(--color-texto-suave); letter-spacing:.03em; margin-bottom:4px;}
  .caja-comparativo .valor{font-size:19px; font-weight:700;}
  .caja-comparativo.positiva .valor{color:var(--color-primario-oscuro);}
  .caja-comparativo.negativa .valor{color:var(--color-peligro);}

  label{display:block; font-size:11px; color:var(--color-texto-suave); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em;}
  input, select, textarea{width:100%; border:1px solid var(--color-borde); border-radius:7px; padding:7px 9px; font-size:13px; background:#fff; color:var(--color-texto); font-family:inherit;}

  table.tabla-reg{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:12px;}
  table.tabla-reg th{background:#F8FAFC; text-align:left; padding:7px 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:#374151; border-bottom:2px solid var(--color-borde);}
  table.tabla-reg td{padding:6px 8px; border-bottom:1px solid #F1F5F9; vertical-align:middle;}
  .texto-derecha{text-align:right;}
  .btn-quitar{background:none; border:none; color:var(--color-peligro); cursor:pointer; font-size:14px; padding:2px 6px;}

  .form-nueva{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; background:#F8FAFC; padding:10px; border-radius:8px;}
  .form-nueva .campo-chico{min-width:100px; flex:1;}
  .form-nueva label{margin-bottom:3px;}
  .btn-primario{background:var(--color-primario); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-primario:hover:not(:disabled){background:var(--color-primario-oscuro);}
  .btn-primario:disabled{opacity:.6; cursor:default;}
  .btn-secundario{background:#fff; border:1px solid var(--color-borde); border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; color:var(--color-texto);}

  .buscador{position:relative;}
  .buscador-resultados{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--color-borde); border-radius:7px; box-shadow:var(--sombra); max-height:200px; overflow-y:auto; z-index:50; margin-top:4px;}
  .buscador-item{padding:8px 10px; cursor:pointer; border-bottom:1px solid var(--color-fondo); font-size:13px;}
  .buscador-item:hover{background:var(--color-acento-suave);}
  .buscador-item .sub{font-size:11px; color:var(--color-texto-suave);}

  .mensaje-error{background:var(--color-peligro-suave); border-left:3px solid var(--color-peligro); color:#991B1B; font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}
  .mensaje-exito{background:var(--color-acento-suave); border-left:3px solid var(--color-primario); color:var(--color-primario-oscuro); font-size:12px; padding:8px 10px; border-radius:6px; margin-top:10px;}
  .campo-check{display:flex; align-items:center; gap:6px; font-size:12px;}
  .campo-check input{width:auto;}
</style>

<body>
<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">ejecucion.html — v1</div>

<script>
const h = React.createElement;
const { useState, useEffect, useRef, useMemo } = React;

function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function moneda(v){ return "$" + num(v).toFixed(2); }
const ESTADOS_EJECUTABLES = ["Aprobada","En reparación","Pendiente de repuesto"];

function Buscador({ placeholder, buscar, renderItem, onSeleccionar }){
  const [texto, setTexto] = useState("");
  const [resultados, setResultados] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const timerRef = useRef(null);

  function cambiar(valor){
    setTexto(valor);
    if (timerRef.current) clearTimeout(timerRef.current);
    if (!valor.trim()){ setResultados(null); return; }
    timerRef.current = setTimeout(async () => {
      setBuscando(true);
      try { setResultados(await buscar(valor.trim())); }
      catch(e) { setResultados([]); }
      finally { setBuscando(false); }
    }, 300);
  }

  return h("div", { className: "buscador" },
    h("input", { type: "text", placeholder, value: texto, onChange: e => cambiar(e.target.value) }),
    resultados !== null && h("div", { className: "buscador-resultados" },
      buscando ? h("div", { className: "buscador-vacio" }, "Buscando...") :
      resultados.length === 0 ? h("div", { className: "buscador-vacio" }, "Sin resultados") :
      resultados.map(item => h("div", {
          key: item.id, className: "buscador-item",
          onClick: () => { onSeleccionar(item); setTexto(""); setResultados(null); },
        }, renderItem(item))
      )
    )
  );
}

function SelectorOrden({ onSeleccionar }){
  const [ordenes, setOrdenes] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    tallerQuery("x_taller_orden", [
      "id","x_name","x_studio_cliente_id","x_studio_equipo_id","x_studio_estado","x_studio_fecha_recepcion",
    ], [["x_studio_estado","in",ESTADOS_EJECUTABLES]], 1000)
      .then(setOrdenes)
      .catch(e => setError("No se pudieron cargar las órdenes: " + e.message));
  }, []);

  const columnas = [
    { clave: "x_name", titulo: "Folio" },
    { clave: "x_studio_cliente_id", titulo: "Cliente" },
    { clave: "x_studio_equipo_id", titulo: "Equipo" },
    { clave: "x_studio_estado", titulo: "Estado" },
    { clave: "x_studio_fecha_recepcion", titulo: "Recepción", formatear: formatearFecha },
  ];

  if (error) return h("div", { className: "error-carga" }, error);
  if (!ordenes) return h("div", { className: "buscador-vacio" }, "Cargando órdenes...");
  if (!ordenes.length) return h("div", { className: "error-carga" }, "No hay órdenes en estado Aprobada / En reparación / Pendiente de repuesto ahora mismo.");

  return TablaInfoAgro(h, { columnas, filas: ordenes, onFilaClick: onSeleccionar });
}

function EjecucionOrden({ orden, onVolver }){
  const [presupuestoAprobado, setPresupuestoAprobado] = useState(null);
  const [totalPresupuestado, setTotalPresupuestado] = useState(0);
  const [manoObra, setManoObra] = useState([]);
  const [tecnicos, setTecnicos] = useState([]);
  const [consumos, setConsumos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [exito, setExito] = useState("");

  useEffect(() => { cargar(); }, [orden.id]);

  async function cargar(){
    setCargando(true); setError("");
    try {
      const [presRows, moRows, consumoRows, tecRows] = await Promise.all([
        tallerQuery("x_taller_presupuesto", ["id","x_name","x_studio_version"],
          [["x_studio_orden_id","=",orden.id],["x_studio_estado","=","Aprobado"]], 10),
        tallerQuery("x_taller_mano_obra", [
          "id","x_studio_tecnico_id","x_studio_fecha","x_studio_horas_normales","x_studio_horas_extra",
          "x_studio_tarifa_costo","x_studio_costo_total","x_studio_actividad",
        ], [["x_studio_orden_id","=",orden.id]], 500),
        tallerQuery("x_costo_real_detalle", [
          "id","x_studio_tipo_linea","x_studio_sku","x_studio_descripcion","x_studio_cantidad_real",
          "x_studio_unidad_medida","x_studio_costo_unitario_real","x_studio_total_costo_real","x_studio_origen",
          "x_studio_proveedor","x_studio_es_linea_no_presupuestada","x_studio_motivo_cambio",
        ], [["x_studio_orden_id","=",orden.id]], 500),
        tallerQuery("x_taller_usuario", ["id","x_name"], [["x_studio_rol","=","Técnico"]], 500),
      ]);
      setManoObra(moRows);
      setConsumos(consumoRows);
      setTecnicos(tecRows);
      if (presRows.length) {
        const masReciente = presRows.sort((a,b) => b.x_studio_version - a.x_studio_version)[0];
        setPresupuestoAprobado(masReciente);
        const lineasPres = await tallerQuery("x_presupuesto_detalle", ["x_studio_total_costo_presupuestado"],
          [["x_studio_presupuesto_id","=",masReciente.id]], 500);
        setTotalPresupuestado(lineasPres.reduce((s,l) => s + num(l.x_studio_total_costo_presupuestado), 0));
      }
    } catch(e) {
      setError("Error al cargar: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  const totalManoObra = manoObra.reduce((s,m) => s + num(m.x_studio_costo_total), 0);
  const totalConsumos = consumos.reduce((s,c) => s + num(c.x_studio_total_costo_real), 0);
  const totalRealAcumulado = totalManoObra + totalConsumos;
  const variacion = totalRealAcumulado - totalPresupuestado;

  if (cargando) return h("div", { className: "panel cargando" }, "Cargando datos de la orden...");

  return h("div", null,
    h("button", { className: "link-volver", onClick: onVolver }, "← Volver"),

    h("div", { className: "panel" },
      h("h2", null, "🔧 " + orden.x_name),
      h("div", { style: { fontSize:"12px", color:"var(--color-texto-suave)", marginBottom:"16px" } },
        (Array.isArray(orden.x_studio_cliente_id) ? orden.x_studio_cliente_id[1] : "") + " · " +
        (Array.isArray(orden.x_studio_equipo_id) ? orden.x_studio_equipo_id[1] : "") +
        (presupuestoAprobado ? " · Presupuesto: " + presupuestoAprobado.x_name : " · ⚠️ Sin presupuesto aprobado")
      ),
      h("div", { className: "comparativo" },
        h("div", { className: "caja-comparativo" },
          h("div", { className: "etiqueta" }, "Presupuestado"),
          h("div", { className: "valor" }, moneda(totalPresupuestado))
        ),
        h("div", { className: "caja-comparativo" },
          h("div", { className: "etiqueta" }, "Real acumulado"),
          h("div", { className: "valor" }, moneda(totalRealAcumulado))
        ),
        h("div", { className: "caja-comparativo " + (variacion <= 0 ? "positiva" : "negativa") },
          h("div", { className: "etiqueta" }, "Variación"),
          h("div", { className: "valor" }, (variacion >= 0 ? "+" : "") + moneda(variacion))
        )
      ),
      error && h("div", { className: "mensaje-error" }, error),
      exito && h("div", { className: "mensaje-exito" }, exito)
    ),

    h(SeccionManoObra, { orden, tecnicos, manoObra, setManoObra, setExito, setError }),
    h(SeccionConsumos, { orden, consumos, setConsumos, setExito, setError })
  );
}

function SeccionManoObra({ orden, tecnicos, manoObra, setManoObra, setExito, setError }){
  const [tecnicoId, setTecnicoId] = useState("");
  const [fecha, setFecha] = useState(fechaParaOdoo(new Date()));
  const [horasNormales, setHorasNormales] = useState(1);
  const [horasExtra, setHorasExtra] = useState(0);
  const [tarifa, setTarifa] = useState(0);
  const [actividad, setActividad] = useState("");
  const [guardando, setGuardando] = useState(false);

  function m2oTexto(v){ return Array.isArray(v) ? v[1] : (v || "—"); }

  async function agregar(){
    if (!tecnicoId){ setError("Elegí el técnico."); return; }
    if (!actividad.trim()){ setError("Describí la actividad realizada."); return; }
    setGuardando(true); setError(""); setExito("");
    const costoTotal = (num(horasNormales) + num(horasExtra)) * num(tarifa);
    const nombreTec = tecnicos.find(t => t.id === Number(tecnicoId))?.x_name || "";
    try {
      const resp = await tallerCrear("x_taller_mano_obra", {
        x_name: orden.x_name + " — " + nombreTec + " — " + fecha,
        x_studio_orden_id: orden.id,
        x_studio_tecnico_id: Number(tecnicoId),
        x_studio_fecha: fecha,
        x_studio_horas_normales: num(horasNormales),
        x_studio_horas_extra: num(horasExtra),
        x_studio_tarifa_costo: num(tarifa),
        x_studio_costo_total: costoTotal,
        x_studio_actividad: actividad.trim(),
      });
      if (resp.ok) {
        setManoObra(prev => [...prev, {
          id: resp.id, x_studio_tecnico_id: [Number(tecnicoId), nombreTec], x_studio_fecha: fecha,
          x_studio_horas_normales: num(horasNormales), x_studio_horas_extra: num(horasExtra),
          x_studio_tarifa_costo: num(tarifa), x_studio_costo_total: costoTotal, x_studio_actividad: actividad.trim(),
        }]);
        setActividad(""); setHorasNormales(1); setHorasExtra(0);
        setExito("Hora registrada.");
      } else {
        setError(resp.error || "No se pudo registrar.");
      }
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  async function quitar(m, indice){
    if (!confirm("¿Quitar este registro de mano de obra?")) return;
    try { await tallerDesactivar("x_taller_mano_obra", m.id, "Quitado desde ejecución"); }
    catch(e) { setError("No se pudo quitar: " + e.message); return; }
    setManoObra(prev => prev.filter((_,i) => i !== indice));
  }

  return h("div", { className: "panel" },
    h("h2", null, "👷 Mano de Obra"),
    h("table", { className: "tabla-reg" },
      h("thead", null, h("tr", null,
        h("th", null, "Técnico"), h("th", null, "Fecha"), h("th", null, "Hrs. Norm."),
        h("th", null, "Hrs. Extra"), h("th", null, "Tarifa"), h("th", { className: "texto-derecha" }, "Total"),
        h("th", null, "Actividad"), h("th", null, "")
      )),
      h("tbody", null,
        manoObra.map((m,i) => h("tr", { key: m.id || i },
          h("td", null, m2oTexto(m.x_studio_tecnico_id)),
          h("td", null, formatearFecha(m.x_studio_fecha)),
          h("td", null, m.x_studio_horas_normales),
          h("td", null, m.x_studio_horas_extra),
          h("td", null, moneda(m.x_studio_tarifa_costo)),
          h("td", { className: "texto-derecha" }, moneda(m.x_studio_costo_total)),
          h("td", null, m.x_studio_actividad),
          h("td", null, h("button", { className: "btn-quitar", onClick: () => quitar(m, i) }, "✕"))
        )),
        manoObra.length === 0 && h("tr", null, h("td", { colSpan: 8, style: { textAlign:"center", color:"var(--color-texto-suave)", padding:"12px" } }, "Sin horas registradas todavía."))
      )
    ),
    h("div", { className: "form-nueva" },
      h("div", { className: "campo-chico" },
        h("label", null, "Técnico"),
        h("select", { value: tecnicoId, onChange: e => setTecnicoId(e.target.value) },
          h("option", { value: "" }, "—"),
          tecnicos.map(t => h("option", { key: t.id, value: t.id }, t.x_name))
        )
      ),
      h("div", { className: "campo-chico" },
        h("label", null, "Fecha"),
        h("input", { type: "date", value: fecha, onChange: e => setFecha(e.target.value) })
      ),
      h("div", { className: "campo-chico" },
        h("label", null, "Hrs. normales"),
        h("input", { type: "number", step: "0.5", value: horasNormales, onChange: e => setHorasNormales(e.target.value) })
      ),
      h("div", { className: "campo-chico" },
        h("label", null, "Hrs. extra"),
        h("input", { type: "number", step: "0.5", value: horasExtra, onChange: e => setHorasExtra(e.target.value) })
      ),
      h("div", { className: "campo-chico" },
        h("label", null, "Tarifa/hora"),
        h("input", { type: "number", step: "0.01", value: tarifa, onChange: e => setTarifa(e.target.value) })
      ),
      h("div", { className: "campo-chico", style: { flex: "2" } },
        h("label", null, "Actividad"),
        h("input", { type: "text", value: actividad, onChange: e => setActividad(e.target.value) })
      ),
      h("button", { className: "btn-primario", onClick: agregar, disabled: guardando }, guardando ? "..." : "+ Agregar")
    )
  );
}

function SeccionConsumos({ orden, consumos, setConsumos, setExito, setError }){
  const [tipoLinea, setTipoLinea] = useState("Repuesto");
  const [descripcion, setDescripcion] = useState("");
  const [sku, setSku] = useState("");
  const [cantidad, setCantidad] = useState(1);
  const [um, setUm] = useState("und");
  const [costoUnitario, setCostoUnitario] = useState(0);
  const [origen, setOrigen] = useState("Inventario");
  const [proveedor, setProveedor] = useState("");
  const [noPresupuestada, setNoPresupuestada] = useState(false);
  const [motivo, setMotivo] = useState("");
  const [guardando, setGuardando] = useState(false);

  async function agregar(){
    if (!descripcion.trim()){ setError("Falta la descripción."); return; }
    if (noPresupuestada && !motivo){ setError("Elegí el motivo — esta línea no estaba presupuestada."); return; }
    setGuardando(true); setError(""); setExito("");
    const total = num(cantidad) * num(costoUnitario);
    try {
      const resp = await tallerCrear("x_costo_real_detalle", {
        x_name: descripcion.trim(),
        x_studio_orden_id: orden.id,
        x_studio_tipo_linea: tipoLinea,
        x_studio_sku: sku || false,
        x_studio_descripcion: descripcion.trim(),
        x_studio_cantidad_real: num(cantidad),
        x_studio_unidad_medida: um,
        x_studio_costo_unitario_real: num(costoUnitario),
        x_studio_total_costo_real: total,
        x_studio_origen: origen,
        x_studio_proveedor: proveedor || false,
        x_studio_fecha_consumo: fechaParaOdoo(new Date()) + " " + new Date().toTimeString().slice(0,8),
        x_studio_es_linea_no_presupuestada: noPresupuestada,
        x_studio_motivo_cambio: noPresupuestada ? motivo : false,
      });
      if (resp.ok) {
        setConsumos(prev => [...prev, {
          id: resp.id, x_studio_tipo_linea: tipoLinea, x_studio_sku: sku, x_studio_descripcion: descripcion.trim(),
          x_studio_cantidad_real: num(cantidad), x_studio_unidad_medida: um, x_studio_costo_unitario_real: num(costoUnitario),
          x_studio_total_costo_real: total, x_studio_origen: origen, x_studio_proveedor: proveedor,
          x_studio_es_linea_no_presupuestada: noPresupuestada, x_studio_motivo_cambio: motivo,
        }]);
        setDescripcion(""); setSku(""); setCantidad(1); setCostoUnitario(0); setProveedor(""); setNoPresupuestada(false); setMotivo("");
        setExito("Consumo registrado.");
      } else {
        setError(resp.error || "No se pudo registrar.");
      }
    } catch(e) {
      setError("Error: " + e.message);
    } finally {
      setGuardando(false);
    }
  }

  async function quitar(c, indice){
    if (!confirm("¿Quitar este consumo?")) return;
    try { await tallerDesactivar("x_costo_real_detalle", c.id, "Quitado desde ejecución"); }
    catch(e) { setError("No se pudo quitar: " + e.message); return; }
    setConsumos(prev => prev.filter((_,i) => i !== indice));
  }

  return h("div", { className: "panel" },
    h("h2", null, "📦 Consumo Real de Materiales / Servicios"),
    h("table", { className: "tabla-reg" },
      h("thead", null, h("tr", null,
        h("th", null, "Tipo"), h("th", null, "Descripción"), h("th", null, "Cant."), h("th", null, "UM"),
        h("th", null, "Costo Unit."), h("th", { className: "texto-derecha" }, "Total"), h("th", null, "Origen"), h("th", null, "")
      )),
      h("tbody", null,
        consumos.map((c,i) => h("tr", { key: c.id || i },
          h("td", null, c.x_studio_tipo_linea, c.x_studio_es_linea_no_presupuestada && h("span", { style: { color:"var(--color-alerta)", marginLeft:"4px", fontSize:"10px" } }, "⚠️ extra")),
          h("td", null, c.x_studio_descripcion),
          h("td", null, c.x_studio_cantidad_real),
          h("td", null, c.x_studio_unidad_medida),
          h("td", null, moneda(c.x_studio_costo_unitario_real)),
          h("td", { className: "texto-derecha" }, moneda(c.x_studio_total_costo_real)),
          h("td", null, c.x_studio_origen),
          h("td", null, h("button", { className: "btn-quitar", onClick: () => quitar(c, i) }, "✕"))
        )),
        consumos.length === 0 && h("tr", null, h("td", { colSpan: 8, style: { textAlign:"center", color:"var(--color-texto-suave)", padding:"12px" } }, "Sin consumos registrados todavía."))
      )
    ),
    h("div", { className: "form-nueva" },
      h("div", { className: "campo-chico" },
        h("label", null, "Tipo"),
        h("select", { value: tipoLinea, onChange: e => setTipoLinea(e.target.value) },
          ["Repuesto","Material","Servicio","Otro"].map(t => h("option", { key: t, value: t }, t))
        )
      ),
      h("div", { className: "campo-chico", style: { flex: "2" } },
        h("label", null, "Descripción" + (["Repuesto","Material"].includes(tipoLinea) ? " (Exactus + InfoAgro)" : "")),
        ["Repuesto","Material"].includes(tipoLinea)
          ? h(Buscador, {
              placeholder: "Buscar artículo...",
              buscar: async texto => (await buscarArticulosCombinado(texto)).map(a => ({ ...a, id: a.ARTICULO })),
              onSeleccionar: a => {
                const costo = num(a.COSTO_PROM_DOL) > 0 ? num(a.COSTO_PROM_DOL) : num(a.COSTO_ULT_DOL);
                setDescripcion(a.DESCRIPCION); setSku(a.ARTICULO); setCostoUnitario(costo);
                setUm(a.UNIDAD_ALMACEN || um); setOrigen(a.ORIGEN === "Exactus" ? "Inventario" : "Manual");
              },
              renderItem: a => h(React.Fragment, null,
                a.DESCRIPCION,
                h("div", { className: "sub" }, a.ARTICULO + " · " + moneda(num(a.COSTO_PROM_DOL) > 0 ? a.COSTO_PROM_DOL : a.COSTO_ULT_DOL))
              ),
            })
          : h("input", { type: "text", value: descripcion, onChange: e => setDescripcion(e.target.value) })
      ),
      h("div", { className: "campo-chico" },
        h("label", null, "Cantidad"),
        h("input", { type: "number", step: "0.01", value: cantidad, onChange: e => setCantidad(e.target.value) })
      ),
      h("div", { className: "campo-chico" },
        h("label", null, "UM"),
        h("input", { type: "text", value: um, onChange: e => setUm(e.target.value) })
      ),
      h("div", { className: "campo-chico" },
        h("label", null, "Costo Unit."),
        h("input", { type: "number", step: "0.01", value: costoUnitario, onChange: e => setCostoUnitario(e.target.value) })
      ),
      h("div", { className: "campo-chico" },
        h("label", null, "Origen"),
        h("select", { value: origen, onChange: e => setOrigen(e.target.value) },
          ["Inventario","Compra","Manual","Servicio"].map(o => h("option", { key: o, value: o }, o))
        )
      ),
      (origen === "Servicio" || origen === "Compra") && h("div", { className: "campo-chico" },
        h("label", null, "Proveedor"),
        h("input", { type: "text", value: proveedor, onChange: e => setProveedor(e.target.value) })
      ),
      h("button", { className: "btn-primario", onClick: agregar, disabled: guardando }, guardando ? "..." : "+ Agregar")
    ),
    h("div", { style: { marginTop: "10px" } },
      h("label", { className: "campo-check" },
        h("input", { type: "checkbox", checked: noPresupuestada, onChange: e => setNoPresupuestada(e.target.checked) }),
        " Esta línea NO estaba presupuestada (trabajo/repuesto adicional encontrado)"
      ),
      noPresupuestada && h("div", { style: { marginTop: "8px", maxWidth: "320px" } },
        h("label", null, "Motivo"),
        h("select", { value: motivo, onChange: e => setMotivo(e.target.value) },
          h("option", { value: "" }, "— Elegí un motivo —"),
          INFOTALLER_CAUSAS_DESVIACION.map(c => h("option", { key: c, value: c }, c))
        )
      )
    )
  );
}

function Ejecucion(){
  const [sesion, setSesion] = useState(null);
  const [ordenElegida, setOrdenElegida] = useState(null);

  useEffect(() => {
    const s = exigirSesion();
    if (s) setSesion(s);
  }, []);

  if (!sesion) return null;

  if (ordenElegida) {
    return h(EjecucionOrden, { orden: ordenElegida, onVolver: () => setOrdenElegida(null) });
  }

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "🔧 Ejecución del Trabajo")
    ),
    h("div", { className: "panel" },
      h("h2", null, "Elegí la orden en ejecución"),
      h(SelectorOrden, { onSeleccionar: setOrdenElegida })
    )
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Ejecucion));
</script>
</body>
</html>

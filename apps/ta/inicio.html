  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>

<style>
  /* ============================================================
     INICIO — KPI de Gestión de Fechas
     ------------------------------------------------------------
     Definición tomada de la pizarra de proceso de la Jefatura de
     Taller. Fuente de datos: Odoo Studio, vía tallerQuery (core.js):

       x_taller_orden:
         x_studio_fecha_recepcion, x_studio_fecha_diagnostico,
         x_studio_fecha_entrega, x_studio_estado, x_studio_bahia_id,
         x_studio_equipo_id, x_studio_tecnico_responsable_id

       x_taller_presupuesto (una fila por versión de cotización):
         x_studio_orden_id, x_studio_version, x_studio_estado
         ("Borrador"/"Enviado"/"Aprobado"/"Rechazado"),
         x_studio_fecha_presupuesto, x_studio_fecha_aprobacion

     Fórmulas (según pizarra):
       Tiempo Diagnóstico = fecha_diagnostico − fecha_recepcion        (Receptor/Técnico)
       Tiempo Cotizar     = fecha_presupuesto − fecha_diagnostico      (Jefatura Taller/Bodega)
       Tiempo Autorizar   = fecha_aprobacion  − fecha_presupuesto      (Jefe Taller/Cliente)
       Tiempo Bahía       = fecha_entrega     − fecha_aprobacion       (Bahía)
       Tiempo Reparar TOTAL = (fecha_entrega − fecha_recepcion) − Tiempo Autorizar
          → el tiempo que el cliente tarda en aprobar la cotización
            NO cuenta contra el taller, se resta del total (KPI: Jefatura)
     ============================================================ */

  .ia-kpi-destacada.azul{background:linear-gradient(135deg,#2563EB 0%,#1D4ED8 100%); box-shadow:0 8px 20px rgba(29,78,216,.28);}
  .ia-kpi-destacada.teal{background:linear-gradient(135deg,#0D9488 0%,#0F766E 100%); box-shadow:0 8px 20px rgba(15,118,110,.28);}

  .kpi-destacada-clic{cursor:pointer;}

  .etapas-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}

  .etapa-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}

  .etapa-valor{font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}

  .etapa-nota-excluida{font-size:9.5px; color:var(--color-alerta); font-weight:600; margin-top:5px;}

  .barra-card{background:#fff; border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px 18px;}
  .barra-card h2{font-size:13px; margin:0 0 2px;}
  .barra-sub{font-size:11px; color:var(--color-texto-suave); margin-bottom:12px;}
  .barra-track{display:flex; height:32px; border-radius:9px; overflow:hidden; background:var(--color-fondo); border:1px solid var(--color-borde);}
  .barra-seg{display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; cursor:pointer;}
  .barra-seg.excluida{background:repeating-linear-gradient(135deg,#D97706,#D97706 8px,#C2660A 8px,#C2660A 16px);}
  .barra-leyenda{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;}
  .barra-leyenda-item{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--color-texto-suave);}

  .tabla-card{background:#fff; border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px 18px; overflow-x:auto;}

  .drill-fondo{position:fixed; inset:0; background:rgba(17,24,39,.45); z-index:998; display:none;}
  .drill-fondo.abierto{display:block;}
  .drill-modal{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.97); width:min(760px,94vw); max-height:82vh; background:#fff; border-radius:16px; box-shadow:0 20px 50px rgba(17,24,39,.28); z-index:999; display:none; flex-direction:column; overflow:hidden; opacity:0; transition:opacity .12s,transform .12s;}
  .drill-modal.abierto{display:flex; opacity:1; transform:translate(-50%,-50%) scale(1);}
  .drill-header{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--color-borde); flex-shrink:0;}
  .drill-header h3{margin:0; font-size:13.5px;}

  .pie-nota b{color:var(--color-primario-oscuro);}
</style>

<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">inicio.html — v1 (KPI de gestión de fechas)</div>

<script>
const h = React.createElement;
const { useState, useEffect } = React;

/* Palabras clave por si algún día se agrega una etapa nueva —
   hoy las 4 fechas ya existen como campos directos, no hace falta
   inferir por bitácora. */
const COLORES_ETAPA = {
  diagnostico: "#3B82F6",
  cotizar:     "#8B5CF6",
  autorizar:   "#D97706",
  bahia:       "#0D9488"
};
const DEF_ETAPAS = [
  { key:"diagnostico", paso:"1", label:"Tiempo Diagnóstico", formula:"F. Diagnóstico − F. Recepción", responsable:"👤 Receptor / Técnico", componente:1 },
  { key:"cotizar",     paso:"2", label:"Tiempo Cotizar",     formula:"F. Cotizado − F. Diagnóstico",   responsable:"👤 Jefatura Taller / Bodega", componente:1 },
  { key:"autorizar",   paso:"3", label:"Tiempo Autorizar",   formula:"F. Aprobar − F. Cotizado",       responsable:"👤 Jefe Taller / Cliente", componente:1 },
  { key:"bahia",       paso:"4", label:"Tiempo Bahía",       formula:"F. Entrega − F. Autorizado",     responsable:"👤 Bahía", componente:2 }
];

const ESTADOS_CERRADOS = ["Entregada","Cerrada","Cancelada"];

function parseFechaOdoo(v){
  if (!v) return null;
  const d = new Date(String(v).replace(" ", "T"));
  return isNaN(d.getTime()) ? null : d;
}
function diasEntre(a, b){ return (b - a) / 86400000; }
function promedio(arr){
  const v = arr.filter(x => x !== null && x !== undefined && !isNaN(x));
  if (!v.length) return null;
  return v.reduce((a,b)=>a+b,0) / v.length;
}
function fmtDias(v){ return (v === null || v === undefined) ? "—" : v.toFixed(1); }
function nombreM2O(v){ return Array.isArray(v) ? v[1] : (v || "—"); }
function idM2O(v){ return Array.isArray(v) ? v[0] : v; }

function calcularTiempos(orden, presupuestosDeOrden){
  const fRecepcion = parseFechaOdoo(orden.x_studio_fecha_recepcion);
  const fDiagnostico = parseFechaOdoo(orden.x_studio_fecha_diagnostico);
  const fEntrega = parseFechaOdoo(orden.x_studio_fecha_entrega);
  if (!fEntrega || !fRecepcion) return null; // solo cuentan para KPI de tiempo las órdenes con recepción y entrega

  const conFechaCotiz = presupuestosDeOrden
    .map(p => ({ p, f: parseFechaOdoo(p.x_studio_fecha_presupuesto) }))
    .filter(x => x.f)
    .sort((a,b) => a.f - b.f);
  const fCotizado = conFechaCotiz[0] ? conFechaCotiz[0].f : null;

  const aprobado = presupuestosDeOrden.find(p => p.x_studio_estado === "Aprobado");
  const fCotizadoAprobado = aprobado ? parseFechaOdoo(aprobado.x_studio_fecha_presupuesto) : null;
  const fAprobado = aprobado ? parseFechaOdoo(aprobado.x_studio_fecha_aprobacion) : null;

  /* ============================================================
     TIEMPO DE REPARAR — KPI que ve el gerente. Requisito explícito:
     el TOTAL nunca se le resta nada; se descompone en dos tramos
     que suman EXACTO al total (mismo punto de corte: la fecha en
     que se autoriza el presupuesto), para que sea verificable:

       Total       = Fecha Entrega − Fecha Recepción
       Componente1 = Fecha Autoriza − Fecha Recepción   (todo lo previo a bahía:
                                                           diagnóstico + cotizar + espera del cliente)
       Componente2 = Fecha Entrega  − Fecha Autoriza     (ejecución en bahía)
       Componente1 + Componente2 = Total, siempre, por construcción.
     ============================================================ */
  const total = diasEntre(fRecepcion, fEntrega);
  const componente1 = fAprobado ? diasEntre(fRecepcion, fAprobado) : null;
  const componente2 = fAprobado ? diasEntre(fAprobado, fEntrega) : null;

  // Desglose fino (informativo, no altera el total ni los componentes)
  const tDiag  = (fDiagnostico && fRecepcion) ? diasEntre(fRecepcion, fDiagnostico) : null;
  const tCotiz = (fCotizado && fDiagnostico)   ? diasEntre(fDiagnostico, fCotizado) : null;
  const tAutor = (fAprobado && fCotizadoAprobado) ? diasEntre(fCotizadoAprobado, fAprobado) : null;
  const tBahia = (fEntrega && fAprobado)        ? diasEntre(fAprobado, fEntrega) : null;

  return { diagnostico:tDiag, cotizar:tCotiz, autorizar:tAutor, bahia:tBahia, componente1, componente2, total, fRecepcion, fEntrega };
}

function Inicio(){
  const [sesion, setSesion] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [ordenes, setOrdenes] = useState([]);
  const [presupuestos, setPresupuestos] = useState([]);
  const [diasFiltro, setDiasFiltro] = useState(30);
  const [bahiaFiltro, setBahiaFiltro] = useState("");
  const [drill, setDrill] = useState(null); // { titulo, sub, filas:[[cols...]], columnas:[...] }

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargar(); }
  }, []);

  async function cargar(){
    setCargando(true); setError("");
    try {
      // Fetch SIEMPRE secuencial (nunca Promise.all — ver notas del proyecto).
      const filasOrdenes = await tallerQuery("x_taller_orden", [
        "id","x_name","x_studio_estado","x_studio_bahia_id","x_studio_equipo_id",
        "x_studio_tecnico_responsable_id","x_studio_fecha_recepcion",
        "x_studio_fecha_diagnostico","x_studio_fecha_entrega",
      ], [], 5000);
      const filasPresupuestos = await tallerQuery("x_taller_presupuesto", [
        "id","x_studio_orden_id","x_studio_version","x_studio_estado",
        "x_studio_fecha_presupuesto","x_studio_fecha_aprobacion",
      ], [], 5000);
      setOrdenes(filasOrdenes);
      setPresupuestos(filasPresupuestos);
    } catch(e) {
      setError("No se pudieron cargar los KPI: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  if (!sesion) return null;
  if (cargando) return h("div", { className: "cargando" }, "Cargando KPI de gestión de fechas...");
  if (error) return h("div", { className: "error-carga" }, error);

  // ---- Bahías disponibles para el filtro (a partir de las propias órdenes) ----
  const bahiasUnicas = [...new Map(
    ordenes.filter(o => o.x_studio_bahia_id).map(o => [idM2O(o.x_studio_bahia_id), nombreM2O(o.x_studio_bahia_id)])
  ).entries()].sort((a,b) => a[1].localeCompare(b[1]));

  // ---- Rango de fechas ----
  const ahora = new Date();
  const desde = new Date(ahora.getTime() - diasFiltro * 86400000);

  const ordenesFiltradas = ordenes.filter(o => {
    if (bahiaFiltro && String(idM2O(o.x_studio_bahia_id)) !== bahiaFiltro) return false;
    return true;
  });

  const presupuestosPorOrden = {};
  presupuestos.forEach(p => {
    const oid = idM2O(p.x_studio_orden_id);
    (presupuestosPorOrden[oid] = presupuestosPorOrden[oid] || []).push(p);
  });

  const cerradas = ordenesFiltradas.filter(o => o.x_studio_fecha_entrega);
  const cerradasEnRango = cerradas.filter(o => {
    const f = parseFechaOdoo(o.x_studio_fecha_entrega);
    return f && f >= desde && f <= ahora;
  });
  const activas = ordenesFiltradas.filter(o => !ESTADOS_CERRADOS.includes(o.x_studio_estado));

  const tiempos = cerradasEnRango
    .map(o => ({ orden:o, t: calcularTiempos(o, presupuestosPorOrden[o.id] || []) }))
    .filter(x => x.t);

  const promTotal = promedio(tiempos.map(x => x.t.total));
  const promComponente1 = promedio(tiempos.map(x => x.t.componente1));
  const promComponente2 = promedio(tiempos.map(x => x.t.componente2));
  const promedios = {};
  DEF_ETAPAS.forEach(def => { promedios[def.key] = promedio(tiempos.map(x => x.t[def.key])); });

  // Verificación visible para el gerente: Componente1 + Componente2 debe calzar con el Total
  // (siempre calza por construcción cuando ambos existen — se muestra igual para dar confianza).
  const sumaComponentes = (promComponente1 || 0) + (promComponente2 || 0);
  const conAmbosComponentes = tiempos.filter(x => x.t.componente1 !== null && x.t.componente2 !== null).length;

  function abrirDrillEtapa(def){
    const filas = tiempos
      .filter(x => x.t[def.key] !== null)
      .sort((a,b) => b.t[def.key] - a.t[def.key])
      .map(x => [x.orden.x_name, nombreM2O(x.orden.x_studio_equipo_id), nombreM2O(x.orden.x_studio_bahia_id), fmtDias(x.t[def.key]) + " días"]);
    setDrill({
      titulo: def.label + " — detalle por orden",
      sub: (def.formula || "") + (def.responsable ? " · " + def.responsable.replace("👤 ","Responsable: ") : ""),
      columnas: ["Orden","Equipo","Bahía", def.label],
      filas,
    });
  }
  function abrirDrillTotal(){
    const filas = tiempos
      .sort((a,b) => b.t.total - a.t.total)
      .map(x => [x.orden.x_name, nombreM2O(x.orden.x_studio_equipo_id), nombreM2O(x.orden.x_studio_bahia_id),
        (x.t.componente1===null?"—":fmtDias(x.t.componente1)) + " + " + (x.t.componente2===null?"—":fmtDias(x.t.componente2)) + " días",
        fmtDias(x.t.total) + " días"]);
    setDrill({
      titulo: "Tiempo de Reparar (Total) — detalle por orden",
      sub: "Fecha de Entrega − Fecha de Recepción · Responsable: Jefatura",
      columnas: ["Orden","Equipo","Bahía","Comp.1 + Comp.2","Tiempo Total"],
      filas,
    });
  }
  function abrirDrillComponente(n){
    const clave = n === 1 ? "componente1" : "componente2";
    const titulo = n === 1
      ? "Antes de Autorización (Comp. 1) — detalle por orden"
      : "Después de Autorización — Bahía (Comp. 2) — detalle por orden";
    const sub = n === 1
      ? "Fecha Autoriza Presupuesto − Fecha de Recepción · incluye Diagnóstico + Cotizar + espera del cliente"
      : "Fecha de Entrega − Fecha Autoriza Presupuesto · ejecución en bahía";
    const filas = tiempos
      .filter(x => x.t[clave] !== null)
      .sort((a,b) => b.t[clave] - a.t[clave])
      .map(x => [x.orden.x_name, nombreM2O(x.orden.x_studio_equipo_id), nombreM2O(x.orden.x_studio_bahia_id), fmtDias(x.t[clave]) + " días"]);
    setDrill({ titulo, sub, columnas: ["Orden","Equipo","Bahía", n===1 ? "Comp. 1" : "Comp. 2"], filas });
  }

  const sumaEtapas = DEF_ETAPAS.reduce((s,d) => s + (promedios[d.key] || 0), 0) || 1;

  const topBottlenecks = [...tiempos].sort((a,b) => b.t.total - a.t.total).slice(0, 8);

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("div", null,
        h("h1", null, "🏠 Inicio — KPI de Gestión de Fechas"),
        h("p", null, "Tiempos de ciclo del taller, según la definición de la Jefatura de Taller")
      ),
      h("div", { className: "barra-derecha" },
        h("div", { className: "ia-pildora-grupo" },
          [7,30,90].map(d => h("button", {
            key: d, className: "ia-pildora" + (diasFiltro === d ? " activa" : ""),
            onClick: () => setDiasFiltro(d),
          }, d + " días"))
        ),
        h("select", {
          className: "selector-simple", value: bahiaFiltro,
          onChange: e => setBahiaFiltro(e.target.value),
        },
          h("option", { value: "" }, "Todas las bahías"),
          bahiasUnicas.map(([id, nombre]) => h("option", { key: id, value: String(id) }, nombre))
        ),
        h("button", { className: "btn-refrescar", onClick: cargar }, "↻ Refrescar")
      )
    ),

    h("div", { className: "fila-resumen" },
      h("div", { className: "ia-kpi-destacada kpi-destacada-clic", onClick: abrirDrillTotal, tabIndex: 0, role: "button" },
        h("div", { className: "ia-kpi-destacada-etiqueta" }, "⭐ Tiempo de Reparar — Total (KPI Jefatura)"),
        h("div", { className: "kpi-destacada-formula" }, "Fecha de Entrega − Fecha de Recepción"),
        h("div", { className: "ia-kpi-destacada-valor" }, fmtDias(promTotal), h("span", { style:{fontSize:"15px",fontWeight:600,marginLeft:"6px",opacity:.9} }, "días")),
        h("div", { className: "ia-kpi-destacada-sub" }, tiempos.length + " orden(es) entregadas en el período"),
        h("div", { className: "kpi-destacada-nota" }, "Es la suma exacta de los dos tramos de la derecha (Comp. 1 + Comp. 2). Clic para ver el detalle por orden.")
      ),
      h("div", { className: "ia-kpi-destacada azul kpi-destacada-clic", onClick: () => abrirDrillComponente(1), tabIndex: 0, role: "button" },
        h("div", { className: "ia-kpi-destacada-etiqueta" }, "1️⃣ Antes de Autorización"),
        h("div", { className: "kpi-destacada-formula" }, "Fecha Autoriza Presupuesto − Fecha de Recepción"),
        h("div", { className: "ia-kpi-destacada-valor" }, fmtDias(promComponente1), h("span", { style:{fontSize:"15px",fontWeight:600,marginLeft:"6px",opacity:.9} }, "días")),
        h("div", { className: "ia-kpi-destacada-sub" }, "Diagnóstico + Cotizar + espera del cliente"),
        h("div", { className: "kpi-destacada-nota" }, "Incluye el tiempo que el cliente tarda en aprobar la cotización.")
      ),
      h("div", { className: "ia-kpi-destacada teal kpi-destacada-clic", onClick: () => abrirDrillComponente(2), tabIndex: 0, role: "button" },
        h("div", { className: "ia-kpi-destacada-etiqueta" }, "2️⃣ Después de Autorización"),
        h("div", { className: "kpi-destacada-formula" }, "Fecha de Entrega − Fecha Autoriza Presupuesto"),
        h("div", { className: "ia-kpi-destacada-valor" }, fmtDias(promComponente2), h("span", { style:{fontSize:"15px",fontWeight:600,marginLeft:"6px",opacity:.9} }, "días")),
        h("div", { className: "ia-kpi-destacada-sub" }, "Ejecución en Bahía"),
        h("div", { className: "kpi-destacada-nota" }, "Desde que el cliente autoriza hasta que se entrega el equipo.")
      )
    ),

    h("div", { className: "verificacion-franja" },
      (promComponente1 !== null && promComponente2 !== null)
        ? h("span", null, "✓ Verificado: ", h("b", null, fmtDias(promComponente1) + "d"), " (Comp. 1) + ", h("b", null, fmtDias(promComponente2) + "d"), " (Comp. 2) = ", h("b", null, fmtDias(sumaComponentes) + "d"), " — calza con el Total (", fmtDias(promTotal), "d) sobre " + conAmbosComponentes + " de " + tiempos.length + " orden(es) con presupuesto aprobado registrado.")
        : h("span", null, "⚠ Todavía no hay suficientes órdenes con fecha de autorización de presupuesto registrada para desglosar el Total en los dos componentes.")
    ),

    h("div", { className: "fila-secundaria" },
      h("div", { className: "ia-kpi" },
        h("div", { className: "ia-kpi-icono azul" }, "✅"),
        h("div", { className: "ia-kpi-etiqueta" }, "Órdenes entregadas"),
        h("div", { className: "ia-kpi-valor" }, cerradasEnRango.length),
        h("div", { className: "ia-kpi-delta neutro" }, "en los últimos " + diasFiltro + " días")
      ),
      h("div", { className: "ia-kpi" },
        h("div", { className: "ia-kpi-icono ambar" }, "⏳"),
        h("div", { className: "ia-kpi-etiqueta" }, "Órdenes activas"),
        h("div", { className: "ia-kpi-valor" }, activas.length),
        h("div", { className: "ia-kpi-delta neutro" }, "sin entregar aún")
      )
    ),

    h("div", { className: "seccion-titulo" }, h("span", null, "Tiempo por etapa del flujo (detalle dentro de cada componente)"), h("span", { className: "linea" })),
    h("div", { className: "etapas-grid" },
      DEF_ETAPAS.map(def => h("div", {
          key: def.key, className: "etapa",
          onClick: () => abrirDrillEtapa(def), tabIndex: 0, role: "button",
        },
        h("div", { className: "etapa-top" },
          h("div", { className: "etapa-icono", style: { background: COLORES_ETAPA[def.key] } },
            def.key === "diagnostico" ? "🔍" : def.key === "cotizar" ? "💵" : def.key === "autorizar" ? "✍️" : "🅿️"),
          h("div", { className: "etapa-paso" }, "Comp. " + def.componente)
        ),
        h("div", { className: "etapa-label" }, def.label),
        h("div", { className: "etapa-formula" }, def.formula),
        h("div", { className: "etapa-valor" }, fmtDias(promedios[def.key]), h("span", { className: "unidad" }, "días")),
        h("div", { className: "etapa-responsable" }, def.responsable)
      ))
    ),

    h("div", { className: "seccion-titulo" }, h("span", null, "Composición del tiempo total (promedio)"), h("span", { className: "linea" })),
    h("div", { className: "barra-card" },
      h("h2", null, "Recepción → Diagnóstico → Cotización → Autorización → Bahía → Entrega"),
      h("div", { className: "barra-sub" }, "Los 4 tramos suman el 100% del Tiempo de Reparar Total — los 3 primeros son el Componente 1, el último es el Componente 2."),
      h("div", { className: "barra-track" },
        DEF_ETAPAS.map(def => {
          const val = promedios[def.key] || 0;
          const pct = Math.max((val / sumaEtapas) * 100, val > 0 ? 4 : 0);
          return h("div", {
            key: def.key,
            className: "barra-seg",
            style: { width: pct + "%", background: COLORES_ETAPA[def.key] },
            title: def.label + ": " + fmtDias(val) + " días",
            onClick: () => abrirDrillEtapa(def),
          }, val > 0 ? fmtDias(val) + "d" : "");
        })
      ),
      h("div", { className: "barra-leyenda" },
        DEF_ETAPAS.map(def => h("div", { key: def.key, className: "barra-leyenda-item" },
          h("span", { className: "barra-leyenda-punto", style: { background: COLORES_ETAPA[def.key] } }),
          def.label + " (Comp. " + def.componente + ")"
        ))
      )
    ),

    h("div", { className: "seccion-titulo" }, h("span", null, "Órdenes con mayor tiempo total (posibles cuellos de botella)"), h("span", { className: "linea" })),
    h("div", { className: "tabla-scroll tabla-card", style: { padding: 0 } },
      h("table", { className: "tabla-infoagro" },
        h("thead", null, h("tr", null,
          ["Orden","Equipo","Bahía","Recepción","Entrega","Etapa más lenta","Tiempo Total"].map(c => h("th", { key: c }, h("div", { className: "tabla-th-contenido" }, c)))
        )),
        h("tbody", null,
          topBottlenecks.length
            ? topBottlenecks.map(({ orden, t }) => {
                let claveLenta = "diagnostico", maxV = -1;
                DEF_ETAPAS.forEach(def => { const v = t[def.key]; if (v !== null && v > maxV) { maxV = v; claveLenta = def.key; } });
                const defLenta = DEF_ETAPAS.find(d => d.key === claveLenta);
                return h("tr", { key: orden.id },
                  h("td", null, h("b", null, orden.x_name)),
                  h("td", null, nombreM2O(orden.x_studio_equipo_id)),
                  h("td", null, nombreM2O(orden.x_studio_bahia_id)),
                  h("td", null, formatearFecha(orden.x_studio_fecha_recepcion)),
                  h("td", null, formatearFecha(orden.x_studio_fecha_entrega)),
                  h("td", null, h("span", { className: "chip-etapa", style: { background: COLORES_ETAPA[claveLenta] } }, defLenta.label.replace("Tiempo ", "") + " · " + fmtDias(maxV) + "d")),
                  h("td", { className: t.total > 15 ? "chip-alerta" : "" }, fmtDias(t.total) + " días")
                );
              })
            : h("tr", null, h("td", { colSpan: 7, className: "tabla-vacia" }, "Sin órdenes entregadas en el período seleccionado"))
        )
      )
    ),

    h("div", { className: "pie-nota" },
      h("b", null, "Definición del KPI (a pedido de Jefatura, tras observación del gerente):"),
      " el Tiempo de Reparar Total nunca se le resta nada — es ", h("code", null, "Fecha de Entrega − Fecha de Recepción"),
      " tal cual, y se desglosa en dos tramos que suman exacto: ", h("b", null, "Comp. 1"), " = ", h("code", null, "Fecha Autoriza − Fecha Recepción"),
      " (antes de bahía) y ", h("b", null, "Comp. 2"), " = ", h("code", null, "Fecha Entrega − Fecha Autoriza"), " (bahía). ",
      h("b", null, "Fuente de datos:"), " ", h("code", null, "x_taller_orden"), " + ", h("code", null, "x_taller_presupuesto"), " vía ", h("code", null, "tallerQuery"), " (Odoo Studio)."
    ),

    drill && h("div", { className: "drill-fondo abierto", onClick: () => setDrill(null) }),
    drill && h("div", { className: "drill-modal abierto" },
      h("div", { className: "drill-header" },
        h("div", null, h("h3", null, drill.titulo), h("p", null, drill.sub)),
        h("button", { className: "drill-cerrar", onClick: () => setDrill(null) }, "✕")
      ),
      h("div", { className: "drill-cuerpo" },
        h("table", { className: "tabla-infoagro" },
          h("thead", null, h("tr", null, drill.columnas.map(c => h("th", { key: c }, h("div", { className: "tabla-th-contenido" }, c))))),
          h("tbody", null,
            drill.filas.length
              ? drill.filas.map((fila, i) => h("tr", { key: i }, fila.map((v, j) => h("td", { key: j }, j === 0 ? h("b", null, v) : v))))
              : h("tr", null, h("td", { colSpan: drill.columnas.length, className: "tabla-vacia" }, "Sin datos"))
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Inicio));
</script>
</body>
</html>

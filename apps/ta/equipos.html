<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotaller — Equipos</title>
<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>
<script src="core.js?v=10"></script>
<link rel="stylesheet" href="core.css?v=2">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626;
    --radio:10px; --sombra:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--color-fondo); color:var(--color-texto); font-size:13.5px;}
  .barra-superior{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .barra-superior h1{font-size:15px; margin:0;}
  .btn-refrescar{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .btn-refrescar:hover{border-color:var(--color-primario); color:var(--color-primario-oscuro);}
  .link-volver{background:none; border:none; color:var(--color-primario-oscuro); font-size:13px; cursor:pointer; padding:0; text-decoration:underline; margin-bottom:10px; display:block;}
  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px; margin-bottom:14px;}
  .panel h2{font-size:13.5px; margin:0 0 12px;}
  .cargando, .error-carga{text-align:center; padding:40px; color:var(--color-texto-suave);}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:14px;}
  .kpi .etiqueta{font-size:10.5px; text-transform:uppercase; color:var(--color-texto-suave); letter-spacing:.03em; margin-bottom:5px;}
  .kpi .valor{font-size:20px; font-weight:700;}

  .paneles-2col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:900px){ .paneles-2col{grid-template-columns:1fr;} }
  .fila-barra{margin-bottom:9px;}
  .fila-barra .encabezado{display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;}
  .fila-barra .pista{height:8px; background:#F1F5F9; border-radius:4px; overflow:hidden;}
  .fila-barra .relleno{height:100%; border-radius:4px; background:var(--color-primario);}

  .cabecera-equipo{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .cabecera-equipo h2{margin:0 0 4px; font-size:17px;}
  .cabecera-equipo .sub{font-size:12.5px; color:var(--color-texto-suave);}
  .grid-datos{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-top:14px;}
  .dato{background:#F8FAFC; border-radius:8px; padding:10px 12px;}
  .dato .etiqueta{font-size:10px; text-transform:uppercase; color:var(--color-texto-suave); letter-spacing:.03em; margin-bottom:3px;}
  .dato .valor{font-size:13.5px; font-weight:600;}
</style>
</head>
<body>
<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">equipos.html — v2 (fix orden de Hooks)</div>

<script>
const h = React.createElement;
const { useState, useEffect, useMemo } = React;

function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function moneda(v){ return "$" + num(v).toFixed(2); }
function m2oTexto(v){ return Array.isArray(v) ? v[1] : (v || "—"); }
function m2oId(v){ return Array.isArray(v) ? v[0] : (v || null); }

function BarraDistribucion({ datos, maximo, formatearValor }){
  return h("div", null,
    datos.map(([etiqueta, valor]) => h("div", { key: etiqueta, className: "fila-barra" },
      h("div", { className: "encabezado" },
        h("span", null, etiqueta),
        h("span", null, formatearValor ? formatearValor(valor) : valor)
      ),
      h("div", { className: "pista" },
        h("div", { className: "relleno", style: { width: (maximo > 0 ? (valor / maximo) * 100 : 0) + "%" } })
      )
    ))
  );
}

function DetalleEquipo({ equipo, ordenesDelEquipo, onVolver }){
  const [consumos, setConsumos] = useState(null);
  const [manoObra, setManoObra] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");

  const idsOrdenes = ordenesDelEquipo.map(o => o.id);

  useEffect(() => { cargar(); }, [equipo.id]);

  async function cargar(){
    setCargando(true); setError("");
    try {
      if (!idsOrdenes.length) { setConsumos([]); setManoObra([]); setCargando(false); return; }
      const consumoRows = await tallerQuery("x_costo_real_detalle", [
        "id","x_studio_orden_id","x_studio_tipo_linea","x_studio_sku","x_studio_descripcion",
        "x_studio_cantidad_real","x_studio_unidad_medida","x_studio_costo_unitario_real",
        "x_studio_total_costo_real","x_studio_origen","x_studio_fecha_consumo","x_studio_es_linea_no_presupuestada",
      ], [["x_studio_orden_id","in",idsOrdenes]], 2000);
      const moRows = await tallerQuery("x_taller_mano_obra", [
        "id","x_studio_orden_id","x_studio_tecnico_id","x_studio_fecha","x_studio_horas_normales","x_studio_horas_extra","x_studio_costo_total",
      ], [["x_studio_orden_id","in",idsOrdenes]], 2000);
      setConsumos(consumoRows);
      setManoObra(moRows);
    } catch(e) {
      setError("Error al cargar el historial: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  const totalRepuestos = (consumos || []).reduce((s,c) => s + num(c.x_studio_total_costo_real), 0);
  const totalManoObra = (manoObra || []).reduce((s,m) => s + num(m.x_studio_costo_total), 0);
  const totalGeneral = totalRepuestos + totalManoObra;
  const horasTotales = (manoObra || []).reduce((s,m) => s + num(m.x_studio_horas_normales) + num(m.x_studio_horas_extra), 0);

  const columnasConsumos = [
    { clave: "x_studio_orden_id", titulo: "Orden" },
    { clave: "x_studio_fecha_consumo", titulo: "Fecha", formatear: formatearFecha },
    { clave: "x_studio_tipo_linea", titulo: "Tipo" },
    { clave: "x_studio_descripcion", titulo: "Descripción" },
    { clave: "x_studio_cantidad_real", titulo: "Cant." },
    { clave: "x_studio_costo_unitario_real", titulo: "Costo Unit.", formatear: moneda },
    { clave: "x_studio_total_costo_real", titulo: "Total", formatear: moneda },
    { clave: "x_studio_origen", titulo: "Origen" },
  ];

  return h("div", null,
    h("button", { className: "link-volver", onClick: onVolver }, "← Volver al listado"),

    h("div", { className: "panel" },
      h("div", { className: "cabecera-equipo" },
        h("div", null,
          h("h2", null, equipo.x_name),
          h("div", { className: "sub" },
            [equipo.x_studio_tipo_equipo, equipo.x_studio_marca, equipo.x_studio_modelo].filter(Boolean).join(" · ") +
            (equipo.x_studio_cliente_id ? " · " + m2oTexto(equipo.x_studio_cliente_id) : "")
          )
        )
      ),
      h("div", { className: "grid-datos" },
        h("div", { className: "dato" }, h("div", { className: "etiqueta" }, "Serie"), h("div", { className: "valor" }, equipo.x_studio_serie || "—")),
        h("div", { className: "dato" }, h("div", { className: "etiqueta" }, "Año"), h("div", { className: "valor" }, equipo.x_studio_anio || "—")),
        h("div", { className: "dato" }, h("div", { className: "etiqueta" }, "Horómetro actual"), h("div", { className: "valor" }, equipo.x_studio_horometro_actual || "—")),
        h("div", { className: "dato" }, h("div", { className: "etiqueta" }, "Kilometraje actual"), h("div", { className: "valor" }, equipo.x_studio_kilometraje_actual || "—")),
        h("div", { className: "dato" }, h("div", { className: "etiqueta" }, "Órdenes de trabajo"), h("div", { className: "valor" }, ordenesDelEquipo.length))
      )
    ),

    h("div", { className: "kpis" },
      h("div", { className: "kpi" }, h("div", { className: "etiqueta" }, "Total repuestos/materiales"), h("div", { className: "valor" }, moneda(totalRepuestos))),
      h("div", { className: "kpi" }, h("div", { className: "etiqueta" }, "Total mano de obra"), h("div", { className: "valor" }, moneda(totalManoObra))),
      h("div", { className: "kpi" }, h("div", { className: "etiqueta" }, "Gasto histórico total"), h("div", { className: "valor" }, moneda(totalGeneral))),
      h("div", { className: "kpi" }, h("div", { className: "etiqueta" }, "Horas de mano de obra"), h("div", { className: "valor" }, horasTotales.toFixed(1)))
    ),

    h("div", { className: "panel" },
      h("h2", null, "🔧 Repuestos y materiales instalados"),
      cargando
        ? h("div", { className: "cargando" }, "Cargando historial...")
        : error
          ? h("div", { className: "error-carga" }, error)
          : consumos.length === 0
            ? h("div", { className: "error-carga" }, "Sin repuestos/materiales registrados todavía para este equipo.")
            : TablaInfoAgro(h, { columnas: columnasConsumos, filas: consumos })
    )
  );
}

function Equipos(){
  const [sesion, setSesion] = useState(null);
  const [equipos, setEquipos] = useState(null);
  const [ordenes, setOrdenes] = useState(null);
  const [costos, setCostos] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [errorCarga, setErrorCarga] = useState("");
  const [equipoAbierto, setEquipoAbierto] = useState(null);

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargar(); }
  }, []);

  async function cargar(){
    setCargando(true); setErrorCarga("");
    try {
      const equiposRows = await tallerQuery("x_equiposagricolas", [
        "id","x_name","x_studio_tipo_equipo","x_studio_marca","x_studio_modelo","x_studio_serie",
        "x_studio_anio","x_studio_horometro_actual","x_studio_kilometraje_actual","x_studio_cliente_id",
      ], [], 3000);
      const ordenesRows = await tallerQuery("x_taller_orden", ["id","x_studio_equipo_id","x_studio_estado"], [["x_studio_equipo_id","!=",false]], 3000);
      const idsOrdenes = ordenesRows.map(o => o.id);
      let costosRows = [];
      if (idsOrdenes.length) {
        costosRows = await tallerQuery("x_costo_real_detalle", ["id","x_studio_orden_id","x_studio_total_costo_real"], [["x_studio_orden_id","in",idsOrdenes]], 5000);
      }
      const idsClientes = [...new Set(equiposRows.filter(e => Array.isArray(e.x_studio_cliente_id)).map(e => e.x_studio_cliente_id[0]))];
      let clientesRows = [];
      if (idsClientes.length) {
        clientesRows = await tallerQuery("x_taller_cliente", ["id","x_studio_centro_costo"], [["id","in",idsClientes]], idsClientes.length);
      }
      const centroCostoPorCliente = {};
      clientesRows.forEach(c => { centroCostoPorCliente[c.id] = c.x_studio_centro_costo || "Sin centro de costo"; });

      setEquipos(equiposRows.map(e => ({ ...e, _centroCosto: Array.isArray(e.x_studio_cliente_id) ? (centroCostoPorCliente[e.x_studio_cliente_id[0]] || "Sin centro de costo") : "Sin cliente" })));
      setOrdenes(ordenesRows);
      setCostos(costosRows);
    } catch(e) {
      setErrorCarga("No se pudieron cargar los equipos: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  const costoPorOrden = useMemo(() => {
    const mapa = {};
    (costos || []).forEach(c => {
      const idOrden = m2oId(c.x_studio_orden_id);
      if (idOrden === null) return;
      mapa[idOrden] = (mapa[idOrden] || 0) + num(c.x_studio_total_costo_real);
    });
    return mapa;
  }, [costos]);

  const ordenesPorEquipo = useMemo(() => {
    const mapa = {};
    (ordenes || []).forEach(o => {
      const idEquipo = m2oId(o.x_studio_equipo_id);
      if (idEquipo === null) return;
      if (!mapa[idEquipo]) mapa[idEquipo] = [];
      mapa[idEquipo].push(o);
    });
    return mapa;
  }, [ordenes]);

  const equiposConGasto = useMemo(() => {
    return (equipos || []).map(e => {
      const ordenesDeEste = ordenesPorEquipo[e.id] || [];
      const totalGastado = ordenesDeEste.reduce((s,o) => s + (costoPorOrden[o.id] || 0), 0);
      return { ...e, _ordenes: ordenesDeEste.length, _totalGastado: totalGastado };
    });
  }, [equipos, ordenesPorEquipo, costoPorOrden]);

  // El chequeo de sesión va DESPUÉS de todos los Hooks — nunca antes. Si un
  // return condicional se cuela entre useState/useMemo, React llama distinta
  // cantidad de Hooks entre renders y truena (regla de los Hooks).
  if (!sesion) return null;

  if (equipoAbierto) {
    return h(DetalleEquipo, {
      equipo: equipoAbierto,
      ordenesDelEquipo: ordenesPorEquipo[equipoAbierto.id] || [],
      onVolver: () => setEquipoAbierto(null),
    });
  }

  if (cargando) return h("div", { className: "panel cargando" }, "Cargando equipos...");
  if (errorCarga) return h("div", { className: "panel error-carga" }, errorCarga);

  const totalGeneral = equiposConGasto.reduce((s,e) => s + e._totalGastado, 0);
  const promedioEquipo = equiposConGasto.length ? totalGeneral / equiposConGasto.length : 0;

  const gastoPorFamilia = {};
  equiposConGasto.forEach(e => {
    const fam = e.x_studio_tipo_equipo || "Sin definir";
    gastoPorFamilia[fam] = (gastoPorFamilia[fam] || 0) + e._totalGastado;
  });
  const distribucionFamilia = Object.entries(gastoPorFamilia).sort((a,b) => b[1]-a[1]);
  const maxFamilia = Math.max(1, ...distribucionFamilia.map(([,v]) => v));

  const gastoPorCentroCosto = {};
  equiposConGasto.forEach(e => {
    gastoPorCentroCosto[e._centroCosto] = (gastoPorCentroCosto[e._centroCosto] || 0) + e._totalGastado;
  });
  const distribucionCentro = Object.entries(gastoPorCentroCosto).sort((a,b) => b[1]-a[1]);
  const maxCentro = Math.max(1, ...distribucionCentro.map(([,v]) => v));

  const columnas = [
    { clave: "x_name", titulo: "Equipo" },
    { clave: "x_studio_tipo_equipo", titulo: "Familia" },
    { clave: "x_studio_marca", titulo: "Marca" },
    { clave: "x_studio_modelo", titulo: "Modelo" },
    { clave: "x_studio_cliente_id", titulo: "Cliente" },
    { clave: "_centroCosto", titulo: "Centro de Costo" },
    { clave: "x_studio_horometro_actual", titulo: "Horómetro" },
    { clave: "_ordenes", titulo: "# Órdenes" },
    { clave: "_totalGastado", titulo: "Total Gastado", formatear: moneda },
  ];

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "🚜 Equipos"),
      h("button", { className: "btn-refrescar", onClick: cargar }, "↻ Refrescar")
    ),

    h("div", { className: "kpis" },
      h("div", { className: "kpi" }, h("div", { className: "etiqueta" }, "Total de equipos"), h("div", { className: "valor" }, equiposConGasto.length)),
      h("div", { className: "kpi" }, h("div", { className: "etiqueta" }, "Gasto histórico total"), h("div", { className: "valor" }, moneda(totalGeneral))),
      h("div", { className: "kpi" }, h("div", { className: "etiqueta" }, "Promedio por equipo"), h("div", { className: "valor" }, moneda(promedioEquipo)))
    ),

    h("div", { className: "paneles-2col" },
      h("div", { className: "panel" },
        h("h2", null, "Gasto por familia de equipo"),
        distribucionFamilia.length
          ? h(BarraDistribucion, { datos: distribucionFamilia, maximo: maxFamilia, formatearValor: moneda })
          : h("div", { className: "error-carga" }, "Sin datos todavía.")
      ),
      h("div", { className: "panel" },
        h("h2", null, "Gasto por centro de costo"),
        distribucionCentro.length
          ? h(BarraDistribucion, { datos: distribucionCentro, maximo: maxCentro, formatearValor: moneda })
          : h("div", { className: "error-carga" }, "Sin datos todavía.")
      )
    ),

    h("div", { className: "panel" },
      h("h2", null, "Listado de equipos"),
      equiposConGasto.length === 0
        ? h("div", { className: "error-carga" }, "No hay equipos registrados todavía.")
        : TablaInfoAgro(h, { columnas, filas: equiposConGasto, onFilaClick: setEquipoAbierto })
    )
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Equipos));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infotaller — Indicadores</title>
<script>
  window.addEventListener('error', function(e){
    var msg = e.message || (e.target && e.target.src ? 'No cargó: ' + e.target.src : 'Error desconocido');
    var caja = document.getElementById('cajaErrorDiag');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'cajaErrorDiag';
      caja.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;'
        + 'padding:12px 16px;font:12px/1.5 monospace;z-index:99999;white-space:pre-wrap;'
        + 'box-shadow:0 2px 8px rgba(0,0,0,.3);';
      document.body.appendChild(caja);
    }
    caja.textContent += (caja.textContent ? '\n\n' : '') + '⚠️ ' + msg;
  }, true);
</script>
<script src="core.js?v=6"></script>
<link rel="stylesheet" href="core.css?v=2">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root{
    --color-fondo:#F8FAFC; --color-panel:#ffffff; --color-borde:#E4E9EE;
    --color-texto:#111827; --color-texto-suave:#6B7280;
    --color-primario:#16A34A; --color-primario-oscuro:#15803D;
    --color-acento-suave:#D1FAE5; --color-peligro:#DC2626;
    --radio:10px; --sombra:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0; padding:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--color-fondo); color:var(--color-texto); font-size:13.5px;}
  .barra-superior{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .barra-superior h1{font-size:15px; margin:0;}
  .btn-refrescar{background:#fff; border:1px solid var(--color-borde); border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--color-texto);}
  .btn-refrescar:hover{border-color:var(--color-primario); color:var(--color-primario-oscuro);}
  .cargando, .error-carga{text-align:center; padding:40px; color:var(--color-texto-suave);}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:16px;}
  .kpi{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px;}
  .kpi .etiqueta{font-size:11px; text-transform:uppercase; color:var(--color-texto-suave); letter-spacing:.03em; margin-bottom:6px;}
  .kpi .valor{font-size:24px; font-weight:700; color:var(--color-texto);}
  .kpi .valor.positiva{color:var(--color-primario-oscuro);}
  .kpi .valor.negativa{color:var(--color-peligro);}

  .paneles{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:900px){ .paneles{grid-template-columns:1fr;} }
  .panel{background:var(--color-panel); border:1px solid var(--color-borde); border-radius:var(--radio); box-shadow:var(--sombra); padding:16px; margin-bottom:14px;}
  .panel h2{font-size:13.5px; margin:0 0 12px;}

  .fila-barra{margin-bottom:10px;}
  .fila-barra .encabezado{display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;}
  .fila-barra .pista{height:8px; background:#F1F5F9; border-radius:4px; overflow:hidden;}
  .fila-barra .relleno{height:100%; border-radius:4px; background:var(--color-primario);}
</style>
</head>
<body>
<div id="raiz"></div>
<div style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#9CA3AF;z-index:99998;">indicadores.html — v1</div>

<script>
const h = React.createElement;
const { useState, useEffect } = React;

function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function moneda(v){ return "$" + num(v).toFixed(2); }

const ESTADOS_ACTIVOS = ["Recibida","En diagnóstico","Pendiente de presupuesto","Presupuestada",
  "Pendiente de aprobación","Aprobada","En reparación","Pendiente de repuesto"];

function BarraDistribucion({ datos, maximo, formatearValor }){
  return h("div", null,
    datos.map(([etiqueta, valor]) => h("div", { key: etiqueta, className: "fila-barra" },
      h("div", { className: "encabezado" },
        h("span", null, etiqueta),
        h("span", null, formatearValor ? formatearValor(valor) : valor)
      ),
      h("div", { className: "pista" },
        h("div", { className: "relleno", style: { width: (maximo > 0 ? (valor / maximo) * 100 : 0) + "%" } })
      )
    ))
  );
}

function Indicadores(){
  const [sesion, setSesion] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [datos, setDatos] = useState(null);

  useEffect(() => {
    const s = exigirSesion();
    if (s) { setSesion(s); cargar(); }
  }, []);

  async function cargar(){
    setCargando(true); setError("");
    try {
      const [ordenes, cierres, bahias, presupuestosAprobados] = await Promise.all([
        tallerQuery("x_taller_orden", ["id","x_studio_estado","x_studio_bahia_id","x_studio_veces_reabierta"], [], 5000),
        tallerQuery("x_taller_cierre", ["id","x_studio_total_presupuestado","x_studio_total_costo_real","x_studio_porcentaje_variacion","x_studio_causa_principal"], [], 2000),
        tallerQuery("x_taller_bahia", ["id","x_name","x_studio_capacidad"], [], 500),
        tallerQuery("x_taller_presupuesto", ["id","x_studio_total_presupuesto"], [["x_studio_estado","=","Aprobado"]], 2000),
      ]);
      setDatos({ ordenes, cierres, bahias, presupuestosAprobados });
    } catch(e) {
      setError("No se pudieron cargar los indicadores: " + e.message);
    } finally {
      setCargando(false);
    }
  }

  if (!sesion) return null;
  if (cargando) return h("div", { className: "panel cargando" }, "Cargando indicadores...");
  if (error) return h("div", { className: "panel error-carga" }, error);
  if (!datos) return null;

  const { ordenes, cierres, bahias, presupuestosAprobados } = datos;

  const ordenesActivas = ordenes.filter(o => ESTADOS_ACTIVOS.includes(o.x_studio_estado)).length;
  const totalAprobado = presupuestosAprobados.reduce((s,p) => s + num(p.x_studio_total_presupuesto), 0);
  const promedioVariacion = cierres.length
    ? cierres.reduce((s,c) => s + num(c.x_studio_porcentaje_variacion), 0) / cierres.length
    : 0;
  const ordenesReabiertas = ordenes.filter(o => num(o.x_studio_veces_reabierta) > 0).length;

  const porEstado = {};
  ordenes.forEach(o => { porEstado[o.x_studio_estado] = (porEstado[o.x_studio_estado] || 0) + 1; });
  const distribucionEstados = Object.entries(porEstado).sort((a,b) => b[1] - a[1]);
  const maxEstado = Math.max(1, ...distribucionEstados.map(([,v]) => v));

  const porCausa = {};
  cierres.forEach(c => {
    const causa = c.x_studio_causa_principal || "Sin causa registrada";
    porCausa[causa] = (porCausa[causa] || 0) + 1;
  });
  const distribucionCausas = Object.entries(porCausa).sort((a,b) => b[1] - a[1]);
  const maxCausa = Math.max(1, ...distribucionCausas.map(([,v]) => v));

  const ocupacionBahia = {};
  ordenes.forEach(o => {
    if (!ESTADOS_ACTIVOS.includes(o.x_studio_estado)) return;
    if (!o.x_studio_bahia_id) return;
    const bId = Array.isArray(o.x_studio_bahia_id) ? o.x_studio_bahia_id[0] : o.x_studio_bahia_id;
    ocupacionBahia[bId] = (ocupacionBahia[bId] || 0) + 1;
  });
  const distribucionBahias = bahias.map(b => [b.x_name, ocupacionBahia[b.id] || 0]);
  const maxBahia = Math.max(1, ...distribucionBahias.map(([,v]) => v));

  return h("div", null,
    h("div", { className: "barra-superior" },
      h("h1", null, "📊 Indicadores"),
      h("button", { className: "btn-refrescar", onClick: cargar }, "↻ Refrescar")
    ),

    h("div", { className: "kpis" },
      h("div", { className: "kpi" },
        h("div", { className: "etiqueta" }, "Órdenes activas"),
        h("div", { className: "valor" }, ordenesActivas)
      ),
      h("div", { className: "kpi" },
        h("div", { className: "etiqueta" }, "Total aprobado"),
        h("div", { className: "valor" }, moneda(totalAprobado))
      ),
      h("div", { className: "kpi" },
        h("div", { className: "etiqueta" }, "Variación promedio"),
        h("div", { className: "valor " + (promedioVariacion <= 0 ? "positiva" : "negativa") },
          (promedioVariacion >= 0 ? "+" : "") + promedioVariacion.toFixed(1) + "%")
      ),
      h("div", { className: "kpi" },
        h("div", { className: "etiqueta" }, "Órdenes cerradas"),
        h("div", { className: "valor" }, cierres.length)
      ),
      h("div", { className: "kpi" },
        h("div", { className: "etiqueta" }, "Retrabajo (reabiertas)"),
        h("div", { className: "valor " + (ordenesReabiertas > 0 ? "negativa" : "") }, ordenesReabiertas)
      )
    ),

    h("div", { className: "paneles" },
      h("div", { className: "panel" },
        h("h2", null, "Órdenes por estado"),
        distribucionEstados.length
          ? BarraDistribucion({ datos: distribucionEstados, maximo: maxEstado })
          : h("div", { className: "error-carga" }, "Sin órdenes todavía.")
      ),
      h("div", { className: "panel" },
        h("h2", null, "Ocupación por bahía (activas ahora)"),
        distribucionBahias.length
          ? BarraDistribucion({ datos: distribucionBahias, maximo: maxBahia })
          : h("div", { className: "error-carga" }, "Sin bahías configuradas.")
      ),
      h("div", { className: "panel" },
        h("h2", null, "Causas de desviación en cierres"),
        distribucionCausas.length
          ? BarraDistribucion({ datos: distribucionCausas, maximo: maxCausa })
          : h("div", { className: "error-carga" }, "Sin cierres registrados todavía.")
      ),
      h("div", { className: "panel" },
        h("h2", null, "Resumen"),
        h("div", { style: { fontSize:"12.5px", lineHeight:"1.8", color:"var(--color-texto-suave)" } },
          h("div", null, "Total de órdenes en el sistema: ", h("strong", { style: { color:"var(--color-texto)" } }, ordenes.length)),
          h("div", null, "Presupuestos aprobados: ", h("strong", { style: { color:"var(--color-texto)" } }, presupuestosAprobados.length)),
          h("div", null, "Bahías configuradas: ", h("strong", { style: { color:"var(--color-texto)" } }, bahias.length))
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("raiz")).render(h(Indicadores));
</script>
</body>
</html>

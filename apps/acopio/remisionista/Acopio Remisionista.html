<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f43">

<title>Acopio · Remisionista</title>
<style>
:root{--verde:#1f6f43;--verde2:#2e8b57;--claro:#eaf4ee;--ambar:#c77d12;--rojo:#b3261e;--gris:#5f6b66;--borde:#d5ddd8;--bg:#f4f7f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1c2421;padding-bottom:40px}
header.top{background:var(--verde);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:600}
header.top button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px}
main{max-width:720px;margin:0 auto;padding:14px}
.net{font-size:12px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.2)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:18px 10px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mod:active{transform:scale(.98)}.mod.full{grid-column:1/3}
.mod .ic{font-size:46px;line-height:1}.mod h2{font-size:16px;margin:8px 0 2px}.mod small{color:var(--gris);display:block;font-size:12px}
.badge{display:inline-block;background:var(--ambar);color:#fff;border-radius:10px;font-size:12px;padding:1px 8px;margin-top:6px}.badge.ok{background:var(--verde2)}.badge.rojo{background:var(--rojo)}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:15px;color:var(--verde)}
label{display:block;font-size:12px;color:var(--gris);margin:8px 0 3px}
input,select{width:100%;font-size:16px;padding:10px;border:1px solid var(--borde);border-radius:8px;background:#fff;font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rem{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--verde);color:#fff;width:100%;margin-top:10px}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--verde)}.btn.rojo{background:var(--rojo)}.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px}.btn:disabled{opacity:.5}
.aviso{background:#fff7e6;border:1px solid #f0d49b;border-radius:10px;padding:10px;font-size:13px;margin:10px 0}.aviso.err{background:#fdecea;border-color:#f0b5b0}.aviso.ok{background:var(--claro);border-color:#b7d8c5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--borde);border-radius:18px;padding:8px 12px;font-size:14px;background:#fff}.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}.chip small{opacity:.75;display:block;font-size:11px}
.big{font-size:30px;font-weight:700;color:var(--verde)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin-top:8px}.kv div{background:var(--claro);border-radius:8px;padding:8px;font-size:12px;color:var(--gris)}.kv b{display:block;font-size:16px;color:#1c2421}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 5px;border-bottom:1px solid var(--borde);text-align:left;white-space:nowrap}th{color:var(--gris);font-size:11px}.scroll{overflow-x:auto}
@media(max-width:380px){.row,.g2{grid-template-columns:1fr}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{min-height:44px}
.stickybar{position:sticky;bottom:0;z-index:15;padding:14px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(244,247,245,0),var(--bg) 35%)}
.stickybar .btn{margin-top:0;font-size:17px;padding:15px}
.eqst{font-size:12px;margin-top:3px;min-height:15px}.eqst.ok{color:var(--verde)}.eqst.mal{color:var(--ambar)}
.lt{border:1px solid var(--borde);border-radius:12px;padding:10px;margin-top:8px;background:#fbfdfb}.lt .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}.lt small{color:var(--gris);font-weight:400}.lt .calc{font-size:12px;color:var(--gris);margin-top:6px}
@media(min-width:700px){main{max-width:760px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:20px;padding:9px 16px;font-size:14px;z-index:60;display:none;max-width:90%}
#scan{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#scan video{flex:1;width:100%;object-fit:cover}#scan .bar{padding:12px;display:flex;gap:8px;background:#111}#scan .bar .btn{margin:0}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top"><button id="back" class="hide">←</button><h1 id="titulo">Acopio · Remisionista</h1><span class="net" id="net">—</span><button id="cfgBtn">⚙</button></header>
<main id="main"></main>
<div id="toast"></div>
<div id="scan"><video id="vid" playsinline muted></video><div class="bar"><button class="btn sec" id="scanFoto">📁 Foto</button><button class="btn rojo" id="scanX">Cerrar</button></div></div>
<input type="file" id="fileQR" accept="image/*" capture="environment" class="hide">
<script>
'use strict';
const APP_VERSION = '2026.11.18-2';
const APP_ROL = 'remisionista'; /*ROL: lo fija build_apps.py → 'remisionista' | 'chofer'*/
const ROL_TXT = { remisionista: { app: 'Remisionista', main: 'salida' }, chofer: { app: 'Chofer', main: 'chofer' } }[APP_ROL];
const WORKER = 'https://weathered-recipe-d18c.ignagher.workers.dev';
const SYNC_KEY = 'infaogro-recuentosagricolas-10021705020946';
// Remisionista conserva sus claves de siempre (no pierde pendientes); el Chofer usa las suyas: cada app guarda sus propios datos.
const LP = APP_ROL === 'chofer' ? 'rrc_' : 'rr_';
const LS = { cfg: LP + 'cfg_v1', cat: LP + 'cat_v1', sal: LP + 'salidas_v1', trk: LP + 'track_v1', hist: LP + 'hist_v1' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Almacenamiento lleno'); } };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const MES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
function fhora(iso) { if (!iso) return '—'; const d = new Date(iso.length === 19 && !iso.includes('T') ? iso.replace(' ', 'T') + 'Z' : iso); if (isNaN(d)) return '—'; const p = (n) => String(n).padStart(2, '0'); return `${p(d.getDate())}-${MES[d.getMonth()]} ${p(d.getHours())}:${p(d.getMinutes())}`; }
let tt; function toast(m, ms = 2500) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', ms); }

let cfg = Object.assign({ nombre: '', ult: {} }, load(LS.cfg, {})); delete cfg.planta;
let cat = Object.assign({ lotes: [], planta: null, updated_at: null, cs: null }, load(LS.cat, {}));
let salidas = load(LS.sal, []);
let track = load(LS.trk, null);
let vista = ROL_TXT.main;
const plantaCfg = () => cat.planta || null;   // la planta se guarda en el Worker (no en cada teléfono)

/* ---------- QR: extrae el número de remisión de lo que traiga el código ---------- */
function parseQR(txt) {
  const raw = String(txt || '').trim(); let rem = '';
  try { const j = JSON.parse(raw); if (j && typeof j === 'object') { const k = Object.keys(j).find((x) => /remis|numero|num|folio|^id$/i.test(x)); if (k) rem = String(j[k]); } } catch (e) { /* no es JSON */ }
  if (!rem && /^https?:\/\//i.test(raw)) {
    try { const u = new URL(raw); for (const [k, v] of u.searchParams) if (/remis|numero|num|folio|^id$|^n$/i.test(k)) { rem = v; break; }
      if (!rem) { const m = u.pathname.match(/(\d{3,})\/?$/); if (m) rem = m[1]; } } catch (e) { /* url inválida */ }
  }
  if (!rem) { const m = raw.match(/(?:remisi[oó]n|rem|no\.?|n[ºo°])\s*[:#-]?\s*(\d{3,})/i) || raw.match(/\b(\d{3,})\b/); if (m) rem = m[1]; }
  return { remision: rem.trim(), raw };
}

/* ---------- Geometría ---------- */
function pipRing(x, y, ring) { let d = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) d = !d; } return d; }
function geo(l) { if (l._g) return l._g; try { l._g = JSON.parse(l.geojson); } catch (e) { l._g = null; } return l._g; }
function pip(lng, lat, l) { const g = geo(l); if (!g || !g.coordinates) return false; const polys = g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates]; return polys.some((p) => pipRing(lng, lat, p[0]) && !p.slice(1).some((h) => pipRing(lng, lat, h))); }
function centro(l) { if (l._c) return l._c; const g = geo(l); if (!g) return (l._c = [0, 0]); const pts = (g.type === 'MultiPolygon' ? g.coordinates[0][0] : g.coordinates[0]); let x = 0, y = 0; pts.forEach((p) => { x += p[0]; y += p[1]; }); return (l._c = [x / pts.length, y / pts.length]); }
function dist(lat1, lng1, lat2, lng2) { const R = 6371000, r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lng2 - lng1) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(a)); }
function getPos(alta = true) { return new Promise((res, rej) => { if (!navigator.geolocation) return rej(new Error('Este teléfono no tiene GPS')); navigator.geolocation.getCurrentPosition((p) => res(p), (e) => rej(new Error(e.code === 1 ? 'Permiso de ubicación denegado' : 'No se pudo obtener la ubicación')), { enableHighAccuracy: alta, timeout: 20000, maximumAge: 0 }); }); }

/* ---------- Lector QR (BarcodeDetector + cámara; manual como respaldo) ---------- */
let stream = null, scanning = false;
async function leerQR(cb) {
  if (!('BarcodeDetector' in window)) { toast('Este navegador no lee QR con cámara: usa "Foto" o escribe el número', 4000); }
  $('#scan').style.display = 'flex'; scanning = true;
  const det = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  const fin = (txt) => { cerrarScan(); cb(txt); };
  $('#scanX').onclick = cerrarScan;
  $('#scanFoto').onclick = () => $('#fileQR').click();
  $('#fileQR').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f || !det) return toast('No se pudo leer la foto'); try { const r = await det.detect(await createImageBitmap(f)); if (r.length) fin(r[0].rawValue); else toast('No se encontró un QR en la foto'); } catch (x) { toast('No se pudo leer la foto'); } };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const v = $('#vid'); v.srcObject = stream; v.play().catch(() => {});
    const tick = async () => { if (!scanning) return; if (det) { try { const r = await det.detect(v); if (r.length) return fin(r[0].rawValue); } catch (e) { /* frame no listo */ } } setTimeout(tick, 250); };
    tick();
  } catch (e) { toast('No se pudo abrir la cámara'); }
}
function cerrarScan() { scanning = false; if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; $('#scan').style.display = 'none'; }

/* ---------- Catálogo (lotes con polígono) ---------- */
async function cargarCatalogo(silencioso) {
  let ok = false;
  try {
    const r = await fetch(WORKER + '/acopio/geocercas').then((x) => x.json());
    if (r.error) throw new Error(r.error);
    cat = Object.assign(cat, { lotes: r.lotes, planta: r.planta, updated_at: r.updated_at, ciclo: r.ciclo }); ok = true;
  } catch (e) { /* se conserva lo guardado */ }
  try {   // listas del formulario (ciclo, productor, variedad, camión, furgón, conductor): quedan guardadas para trabajar sin señal
    const r = await fetch(WORKER + '/acopio/catalogos').then((x) => x.json());
    if (r.error) throw new Error(r.error);
    cat.cs = { companias: r.companias || [], sectores: r.sectores || [], fincas: r.fincas || [], productor_por_company: r.productor_por_company || {}, ciclos: r.ciclos || [], productores: r.productores || [], variedades: r.variedades || [], camiones: r.camiones || [], furgones: r.furgones || [], conductores: r.conductores || [] }; cat.ciclo = r.ciclo || cat.ciclo; ok = true;
  } catch (e) { /* se conserva lo guardado */ }
  if (ok) save(LS.cat, cat);
  if (!silencioso) toast(ok ? `Catálogo al día: ${cat.lotes.length} lotes · ${cat.cs ? cat.cs.conductores.length : 0} conductores` : 'Sin conexión: se usa el catálogo guardado');
}

/* ---------- Navegación ---------- */
function ir(v) { vista = (v === 'home' ? ROL_TXT.main : v); render(); window.scrollTo(0, 0); }   // «home» = la pantalla principal de este rol
function render() {
  $('#back').classList.toggle('hide', vista === ROL_TXT.main);
  $('#titulo').textContent = { salida: 'Remisionista · salida del plantillo', chofer: 'Chofer · rastreo del camión', cfg: 'Ajustes' }[vista];
  ({ salida: rSalida, chofer: rChofer, cfg: rCfg })[vista]();
}
$('#back').onclick = () => ir('home'); $('#cfgBtn').onclick = () => ir('cfg');
const actualizaRed = () => { const n = $('#net'); n.textContent = navigator.onLine ? 'en línea' : 'sin señal'; };
addEventListener('online', () => { actualizaRed(); sincronizar(); flush(); }); addEventListener('offline', actualizaRed);

/* ---------- REMISIONISTA: captura de la remisión (escribe directo en x_acopio) ---------- */
const CIAS_FIJAS = { 2: 'Division Agricola Comasa', 3: 'Grupo ZP' };
const CS = () => {   // listas del catálogo; si faltan compañías/fincas (Worker anterior o catálogo sin bajar) se arman con los lotes guardados
  const c = Object.assign({ companias: [], sectores: [], fincas: [], productor_por_company: {}, ciclos: [], productores: [], variedades: [], camiones: [], furgones: [], conductores: [] }, cat.cs || {});
  if (!c.companias.length || !c.fincas.length) {
    const cm = new Map(), fm = new Map();
    cat.lotes.forEach((l) => { if (l.company && !cm.has(l.company)) cm.set(l.company, { id: l.company, nombre: CIAS_FIJAS[l.company] || ('Compañía ' + l.company) }); if (l.finca_id && !fm.has(l.finca_id)) fm.set(l.finca_id, { id: l.finca_id, nombre: l.finca, company: l.company }); });
    if (!c.companias.length) c.companias = [...cm.values()];
    if (!c.fincas.length) c.fincas = [...fm.values()].sort((x, y) => String(x.nombre).localeCompare(String(y.nombre)));
  }
  return c;
};
const tmpRem = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return 'TR' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(); };
const num = (v) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
const K_MED = 65 / 75;                                        // una tolvada mediana equivale a 65/75 de una grande
const convL = (t) => num(t && t.g) + num(t && t.m) * K_MED;   // tolvadas convertidas a grandes
const qqL = (t) => num(t && t.g) * 75 + num(t && t.m) * 65;   // QQ estimados
const f2 = (n) => (Math.round(n * 100) / 100).toFixed(2);
function resolverEq(lista, texto, furgon) {
  let t = String(texto || '').trim(); if (!t) return null;
  if (furgon) { const m = t.match(/^(?:nr|f)?\s*0*(\d{1,3})$/i); if (m) t = 'F' + m[1].padStart(3, '0'); }   // NR19 → F019
  const n = (x) => x.toLowerCase().replace(/\s+/g, ' '), tt = n(t);
  let r = lista.filter((e) => n(e.nombre) === tt);
  if (!r.length) r = lista.filter((e) => n(e.nombre).startsWith(tt));
  if (!r.length && tt.length >= 3) r = lista.filter((e) => n(e.nombre).includes(tt));
  return r.length === 1 ? r[0] : (r.length > 1 ? 'amb' : null);
}
const optsL = (arr, sel, vacio) => `<option value="">${vacio}</option>` + arr.map((x) => `<option value="${x.id}" ${+sel === x.id ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('');
let sf = null; // formulario de salida en curso
function nuevoSf() {
  const u = cfg.ult || {};
  const cs = CS();
  const o = { remision: '', qr: '', temporal: tmpRem(), company: (cs.companias.some((c) => c.id === u.company) ? u.company : (cs.companias[0] || {}).id) || 0, sector: u.sector || 0, finca: u.finca || 0, ciclo_id: 0, variedad_id: u.variedad_id || 0,
    camion: '', camion_id: 0, remolque: '', furgon: '', furgon_id: 0, conductor: '', conductor_id: 0, pos: null, sel: new Set(), tolv: {}, msg: '' };
  sf = o; fijaCiclo(); return o;
}
const fincasSf = () => CS().fincas.filter((f) => (!sf.company || f.company === sf.company) && (!sf.sector || f.sector === sf.sector));
const sectoresSf = () => { const ids = new Set(CS().fincas.filter((f) => !sf.company || f.company === sf.company).map((f) => f.sector).filter(Boolean)); return CS().sectores.filter((x) => ids.has(x.id)); };
const productorSf = () => CS().productor_por_company[sf.company] || null;   // FIJO por compañía; si hay que cambiarlo se hace en Odoo
function fijaCiclo() { const lst = CS().ciclos.filter((x) => !sf.company || x.company === sf.company); if (!lst.some((x) => x.id === sf.ciclo_id)) sf.ciclo_id = (lst.find((x) => x.nombre === cat.ciclo) || {}).id || 0; }
function companiaSf() { if (sf.company) return sf.company; const l = cat.lotes.find((x) => sf.sel.has(x.id)); return l ? l.company : null; }
function eqCampo(id, label, lista, key, listId, furg, ph) {
  return `<div><label>${label}</label><input id="${id}" list="${listId}" autocomplete="off" autocapitalize="characters" placeholder="${ph || 'Escribe o elige'}" value="${esc(sf[key])}"><datalist id="${listId}">${lista.map((e) => `<option value="${esc(e.nombre)}">`).join('')}</datalist><div class="eqst" id="${id}_st"></div></div>`;
}
function pintaEqSt(id, key, lista, furg) {
  const st = $('#' + id + '_st'); if (!st) return;
  const r = resolverEq(lista, sf[key], furg);
  if (!sf[key]) { st.textContent = ''; st.className = 'eqst'; sf[key + '_id'] = 0; return; }
  if (r && r !== 'amb') { sf[key + '_id'] = r.id; st.textContent = '✔ ' + r.nombre; st.className = 'eqst ok'; }
  else { sf[key + '_id'] = 0; st.textContent = !lista.length ? 'Sin catálogo guardado: se enviará como texto' : r === 'amb' ? 'Varias coincidencias: elige de la lista' : '⚠ No está en el catálogo: se enviará como texto'; st.className = 'eqst mal'; }
}
function rSalida() {
  if (!cfg.nombre) { toast('Primero indica quién usa este dispositivo', 4000); return ir('cfg'); }   // el nombre se pide una sola vez y se guarda en el dispositivo
  sf = sf || nuevoSf();
  if (!sf.company) { const u = cfg.ult || {}, cs0 = CS(); sf.company = (cs0.companias.some((x) => x.id === u.company) ? u.company : (cs0.companias[0] || {}).id) || 0; }
  fijaCiclo();
  const c = CS(), lista = salidas.slice().reverse().slice(0, 15);
  const comp = companiaSf(), ciclos = c.ciclos.filter((x) => !comp || x.company === comp);
  $('#main').innerHTML = `
  <div class="card"><h3>1. Remisión</h3>
    <div class="rem"><input id="s_rem" inputmode="numeric" placeholder="Nº de remisión" value="${esc(sf.remision)}"><button class="btn sm" id="s_scan" style="width:auto">📷 QR</button></div>
    ${sf.qr ? `<div style="font-size:11px;color:var(--gris);margin-top:4px;word-break:break-all">QR: ${esc(sf.qr.slice(0, 120))}</div>` : ''}
    <div style="font-size:12px;color:var(--gris);margin-top:6px">Nº temporal: <b>${esc(sf.temporal)}</b> · INFOAGRO lo liga a la remisión.<br>El Nº de remisión puede repetirse entre ciclos (la planta reinicia el consecutivo): se identifica con <b>Nº + ciclo</b>, revisa el ciclo en el paso 2.</div>
    <div style="margin-top:8px;font-size:14px">Remisionista: <b>${esc(cfg.nombre)}</b> <small style="color:var(--gris)">(usuario de este dispositivo)</small> <a href="#" id="s_user_ch" style="font-size:12px">cambiar</a></div></div>
  <div class="card"><h3>2. Datos de la remisión</h3>

  const d = pl && u ? dist(u.lat, u.lng, pl.lat, pl.lng) : null;

}
function iniciarTrack(rem, qr) { track = { remision: rem, qr, started: new Date().toISOString(), pts: [], llegada: null, llegadaSent: false }; save(LS.trk, track); cercaN = 0; ultimoFix = null; comenzar(); render(); }

  $('#main').innerHTML = `<div class="card"><h3>Usuario de este dispositivo</h3><small style="color:var(--gris)">${APP_ROL === 'chofer' ? 'Nombre del chofer que usa este teléfono.' : 'Se pide una sola vez. Es quien aparece como remisionista (usuario dispositivo) en INFOAGRO.'}</small><input id="k_nom" value="${esc(cfg.nombre)}" placeholder="Nombre y apellido" autocomplete="name"></div>
  ${APP_ROL !== 'chofer' ? '' : `<div class="card"><h3>Planta Comasa (llegada)</h3><small>${pl ? `Ubicación guardada en el servidor · radio ${pl.radio || 300} m. La llegada se registra sola.` : 'La ubicación de la planta aún no está en el servidor: avisa al administrador. Mientras tanto la llegada se marca manualmente.'}</small></div>
  <div class="card"><h3>Rastreo en segundo plano (recomendado)</h3>
    <small style="color:var(--gris)">Esta app solo manda la ubicación mientras está abierta en pantalla: si pasas a WhatsApp, Waze o música, el teléfono pausa el GPS. Para rastrear con otras apps abiertas instala <b>Traccar Client</b> (gratis, Android/iOS) y configúralo una sola vez:</small>
    <ol style="margin:8px 0 8px 18px;padding:0;font-size:13px;line-height:1.5"><li><b>Identificador del dispositivo</b>: el código de tu camión (ej. CH16345)</li><li><b>URL del servidor</b>: copia la de abajo</li><li>Precisión: <b>alta</b> · Frecuencia: <b>15 s</b> · permiso de ubicación <b>«Siempre»</b></li><li>Activa el servicio antes de salir; el remisionista debe registrar tu camión en la remisión</li></ol>
    <input id="k_tr" readonly value="${esc(WORKER + '/acopio/traccar?k=' + SYNC_KEY)}" onclick="this.select()"><button class="btn sec" id="k_trc">Copiar URL</button></div>`}
  <div class="card"><h3>Catálogo</h3><small>${cat.lotes.length} lotes con geocerca · ${cat.updated_at ? fhora(cat.updated_at) : 'sin descargar'}</small><button class="btn sec" id="k_cat">Actualizar catálogo</button></div>
  <button class="btn" id="k_ok">Guardar</button><div style="text-align:center;font-size:12px;color:var(--gris);margin-top:14px">Versión ${APP_VERSION}</div>`;
  if ($('#k_trc')) $('#k_trc').onclick = async () => { try { await navigator.clipboard.writeText($('#k_tr').value); toast('URL copiada'); } catch (e) { $('#k_tr').select(); toast('Selecciónala y cópiala'); } };
  $('#k_cat').onclick = async () => { await cargarCatalogo(false); rCfg(); };
  $('#k_ok').onclick = () => { cfg.nombre = $('#k_nom').value.trim(); save(LS.cfg, cfg); toast('Guardado'); ir('home'); };
}

/* ---------- Arranque ---------- */
actualizaRed(); render();
cargarCatalogo(true).then(() => { if (vista === 'salida' && sf && !sf.company) rSalida(); }); sincronizar();
if (track && !track.llegada) comenzar(); else if (track) flush();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

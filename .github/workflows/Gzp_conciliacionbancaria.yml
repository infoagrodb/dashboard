name: gzp_ConciliacionBancaria

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch lineas y estados de cuenta bancarios desde Odoo
        shell: bash
        env:
          GZP_API_KEY: ${{ secrets.GZP_API_KEY }}
        run: |
          set -euo pipefail

          echo "Descargando account.bank.statement.line (BNK1 + BNK2)..."
          jq -n --arg key "$GZP_API_KEY" '{
            jsonrpc: "2.0",
            method: "call",
            id: 1,
            params: {
              service: "object",
              method: "execute_kw",
              args: [
                "grupozp-main-13656030",
                7,
                $key,
                "account.bank.statement.line",
                "search_read",
                [[["journal_id","in",[6,9]]]],
                {"fields":["date","amount","payment_ref","journal_id"],"limit":0}
              ]
            }
          }' > _payload_lines.json

          curl -sf -X POST https://grupozp.odoo.com/jsonrpc \
            -H "Content-Type: application/json" \
            --data @_payload_lines.json \
            -o _raw_lines.json

          if [ ! -s _raw_lines.json ] || jq -e '.error' _raw_lines.json > /dev/null 2>&1; then
            echo "ERROR en respuesta Odoo (lines):"
            cat _raw_lines.json
            exit 1
          fi

          echo "Descargando account.bank.statement (BNK1 + BNK2)..."
          jq -n --arg key "$GZP_API_KEY" '{
            jsonrpc: "2.0",
            method: "call",
            id: 2,
            params: {
              service: "object",
              method: "execute_kw",
              args: [
                "grupozp-main-13656030",
                7,
                $key,
                "account.bank.statement",
                "search_read",
                [[["journal_id","in",[6,9]]]],
                {"fields":["date","balance_end_real","journal_id"],"limit":0}
              ]
            }
          }' > _payload_stmts.json

          curl -sf -X POST https://grupozp.odoo.com/jsonrpc \
            -H "Content-Type: application/json" \
            --data @_payload_stmts.json \
            -o _raw_statements.json

          if [ ! -s _raw_statements.json ] || jq -e '.error' _raw_statements.json > /dev/null 2>&1; then
            echo "ERROR en respuesta Odoo (statements):"
            cat _raw_statements.json
            exit 1
          fi

          echo "Descargando account.move.line de cuentas transitorias..."
          jq -n --arg key "$GZP_API_KEY" '{
            jsonrpc: "2.0",
            method: "call",
            id: 3,
            params: {
              service: "object",
              method: "execute_kw",
              args: [
                "grupozp-main-13656030",
                7,
                $key,
                "account.move.line",
                "search_read",
                [[["account_id","in",[715,716,730,731]]]],
                {"fields":["date","debit","credit","matching_number","payment_id","statement_line_id","partner_id","account_id"],"limit":0}
              ]
            }
          }' > _payload_clearing.json

          curl -sf -X POST https://grupozp.odoo.com/jsonrpc \
            -H "Content-Type: application/json" \
            --data @_payload_clearing.json \
            -o _raw_clearing.json

          if [ ! -s _raw_clearing.json ] || jq -e '.error' _raw_clearing.json > /dev/null 2>&1; then
            echo "ERROR en respuesta Odoo (clearing):"
            cat _raw_clearing.json
            exit 1
          fi

          jq '.result' _raw_lines.json > _lines_result.json
          jq '.result' _raw_statements.json > _stmts_result.json
          jq '.result' _raw_clearing.json > _clearing_result.json

          jq -n \
            --slurpfile linesFile _lines_result.json \
            --slurpfile stmtsFile _stmts_result.json \
            --slurpfile clearingFile _clearing_result.json \
            '{
              generated_at: (now | todate),
              BNK1: {
                label: "11103 Banpro Cta Cordoba 95447 (C$)",
                currency: "C$",
                lines: ($linesFile[0] | map(select(.journal_id[0]==6)) | sort_by(.date) | map([.date, .amount, .payment_ref])),
                statements: ($stmtsFile[0] | map(select(.journal_id[0]==6)) | sort_by(.date) | map({date: .date, real: .balance_end_real})),
                clearing: ($clearingFile[0] | map(select(.account_id[0]==715 or .account_id[0]==716)) | sort_by(.date) | map(
                  if .payment_id != false then
                    ["P", .date, (.debit - .credit), (.partner_id[1] // ""), (.payment_id[1] // ""), (.matching_number // "")]
                  else
                    ["B", .date, (.debit - .credit), (.partner_id[1] // ""), (.statement_line_id[1] // ""), (.matching_number // "")]
                  end
                ))
              },
              BNK2: {
                label: "Banpro 48612 (USD)",
                currency: "US$",
                lines: ($linesFile[0] | map(select(.journal_id[0]==9)) | sort_by(.date) | map([.date, .amount, .payment_ref])),
                statements: ($stmtsFile[0] | map(select(.journal_id[0]==9)) | sort_by(.date) | map({date: .date, real: .balance_end_real})),
                clearing: ($clearingFile[0] | map(select(.account_id[0]==730 or .account_id[0]==731)) | sort_by(.date) | map(
                  if .payment_id != false then
                    ["P", .date, (.debit - .credit), (.partner_id[1] // ""), (.payment_id[1] // ""), (.matching_number // "")]
                  else
                    ["B", .date, (.debit - .credit), (.partner_id[1] // ""), (.statement_line_id[1] // ""), (.matching_number // "")]
                  end
                ))
              }
            }' > gzp_ConciliacionBancaria.json

          rm -f _payload_*.json _raw_*.json _*_result.json

          N1=$(jq '.BNK1.lines | length' gzp_ConciliacionBancaria.json)
          N2=$(jq '.BNK2.lines | length' gzp_ConciliacionBancaria.json)
          echo "OK: BNK1=$N1 lineas, BNK2=$N2 lineas"
          echo "Tamano: $(wc -c < gzp_ConciliacionBancaria.json) bytes"

      - name: Commit y push
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gzp_ConciliacionBancaria.json
          git commit -m "Auto: ConciliacionBancaria GZP" || echo "Sin cambios"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              exit 1
            fi
            sleep $(( (RANDOM % 5) + 3 ))
          done
